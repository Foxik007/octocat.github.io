# Локальный запуск игры + сервера мультиплеера
services:
  game:
    image: nginx:alpine
    container_name: battlecity-web
    ports: ["8000:80"]
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./donate.html:/usr/share/nginx/html/donate.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  multiplayer:
    image: node:20-alpine
    container_name: battlecity-ws
    working_dir: /app
    command: sh -c "npm i ws --silent && node server.js"
    volumes: [ "./:/app" ]
    ports: ["8080:8080"]
    restart: unless-stopped
