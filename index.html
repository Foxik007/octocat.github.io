<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>BATTLE CITY — Танчики 1990</title>
<style>
/* ================== ОБЩИЕ СТИЛИ (ретро-стилизация NES) ================== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;overflow:hidden;
  font-family:"Courier New",Courier,monospace;color:#e8e8e8;user-select:none;
  touch-action:manipulation;overscroll-behavior:none}
/* Сцена фиксированного размера 544x448 — масштабируется целочисленно под экран */
#stage{position:absolute;left:50%;top:50%;width:544px;height:448px;
  transform-origin:center center;background:#000;overflow:hidden}
canvas{display:block;image-rendering:pixelated;image-rendering:-moz-crisp-edges;
  image-rendering:crisp-edges}
#game{position:absolute;left:0;top:0}
/* Когда поле масштабируется вниз (телефон), увеличиваем шрифты меню,
   иначе после ужатия текст становится нечитаемым */
#stage.big-ui .overlay{font-size:14px;line-height:1.5;padding:10px 12px}
#stage.big-ui .ttl{font-size:20px}
#stage.big-ui .sub{font-size:12px}
#stage.big-ui .hint{font-size:12px}
#stage.big-ui .row{padding:5px 4px}
#stage.big-ui .tag{font-size:12px}
#stage.big-ui .tab{font-size:12px;padding:3px 8px}
#stage.big-ui .mbox{font-size:13px}
#stage.big-ui #edgrid{grid-template-columns:repeat(13,26px);grid-template-rows:repeat(13,26px)}
#stage.big-ui #edgrid div{width:26px;height:26px}
#stage.big-ui .pal div{padding:5px 8px;font-size:12px}
/* ---------- Оверлеи меню ---------- */
.overlay{position:absolute;left:0;top:0;width:100%;height:100%;display:none;
  flex-direction:column;background:#000;padding:10px 14px;font-size:11px;line-height:1.45}
.overlay.on{display:flex}
.ttl{color:#C09848;font-size:14px;letter-spacing:2px;margin-bottom:6px;flex:none}
.sub{color:#7d7d7d;font-size:9px;margin-bottom:6px;flex:none}
.list{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;scrollbar-width:thin;
  scrollbar-color:#404040 #000}
.list::-webkit-scrollbar{width:6px}
.list::-webkit-scrollbar-thumb{background:#404040}
.row{display:flex;align-items:center;gap:6px;padding:2px 4px;white-space:nowrap}
.card.row{white-space:normal}
.row.sel{background:#1a1a1a;outline:1px solid #C09848}
.row .cur{width:10px;color:#C09848}
.row.sel .cur::after{content:"\25BA"}
.blink{animation:bl .5s steps(1,end) infinite}
@keyframes bl{50%{opacity:0}}
.name{flex:1;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:9px;padding:0 4px;border:1px solid #444;color:#9a9a9a}
.tag.own{border-color:#70B050;color:#70B050}
.tag.eq{border-color:#5da0f0;color:#5da0f0}
.tag.lock{border-color:#8a3030;color:#c05050}
.price{color:#f0c020}
/* --- Магазин карточками: у каждого товара живое превью --- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:7px;padding:4px 2px}
.card{border:1px solid #2e2e2e;background:#0c0c0c;padding:6px 4px;display:flex;flex-direction:column;
      align-items:center;gap:4px;cursor:pointer;transition:border-color .12s,background .12s,transform .12s}
.card:hover{border-color:#5a5a5a}
.card.sel{border-color:#C09848;background:#17120a;transform:translateY(-2px)}
.card.own{border-color:#3d5a30}
.card.eq{border-color:#5da0f0}
.card.lock{opacity:.45}
.card canvas{image-rendering:pixelated;width:72px;height:72px;background:#000;border:1px solid #1c1c1c}
.card .cname{font-size:9px;line-height:1.35;text-align:center;min-height:26px;color:#d8d8d8;white-space:normal;overflow-wrap:anywhere;width:100%}
.card.sel .cname{color:#fff}
.card .cfoot{display:flex;align-items:center;gap:4px;min-height:14px}
.card .cprice{font-size:10px;color:#f0c020}
.card .ctag{font-size:8px;padding:0 3px;border:1px solid #444;color:#9a9a9a}
.card .ctag.own{border-color:#70B050;color:#70B050}
.card .ctag.eq{border-color:#5da0f0;color:#5da0f0}
.card .ctag.lock{border-color:#8a3030;color:#c05050}
.hint{flex:none;color:#6a6a6a;font-size:9px;border-top:1px solid #262626;
  padding-top:5px;margin-top:5px}
.gold{color:#f0c020}.grn{color:#70B050}.red{color:#d05050}.blu{color:#5da0f0}
.gray{color:#777}.wht{color:#fff}
.cols{display:flex;gap:10px;flex:1;min-height:0}
.tabs{display:flex;gap:4px;flex:none;margin-bottom:5px;flex-wrap:wrap}
.tab{padding:1px 6px;border:1px solid #333;font-size:9px;color:#888}
.tab.on{border-color:#C09848;color:#C09848;background:#1a1400}
/* ---------- Редактор уровней ---------- */
#edgrid{display:grid;grid-template-columns:repeat(13,20px);grid-template-rows:repeat(13,20px);
  gap:1px;background:#222;padding:2px;flex:none}
#edgrid div{width:20px;height:20px;background:#000;cursor:pointer}
.pal{display:flex;flex-direction:column;gap:3px;font-size:9px}
.pal div{padding:2px 5px;border:1px solid #333;cursor:pointer;display:flex;gap:5px;align-items:center}
.pal div.on{border-color:#C09848;color:#C09848}
.sw{width:12px;height:12px;display:inline-block;border:1px solid #000}
/* ---------- Модальное окно ---------- */
#modal{position:absolute;left:0;top:0;width:100%;height:100%;display:none;
  align-items:center;justify-content:center;background:rgba(0,0,0,.86);z-index:20}
#modal.on{display:flex}
.mbox{width:min(430px,92%);max-height:86%;overflow:auto;border:2px solid #C09848;background:#0b0b0b;
  padding:12px;font-size:10px;line-height:1.5}
.mbox h3{color:#C09848;font-size:12px;margin-bottom:6px;letter-spacing:1px}
.btn{display:inline-block;margin-top:8px;padding:3px 10px;border:1px solid #70B050;
  color:#70B050;cursor:pointer;font-size:10px}
.btn:hover{background:#0f2a0f}
.warn{border:1px solid #8a6a20;background:#1a1200;color:#e0b040;padding:6px;margin:6px 0;font-size:9px}
/* ---------- Мобильное управление ---------- */
#touch{position:fixed;left:0;top:0;width:100%;height:100%;display:none;z-index:30;
  pointer-events:none}
#touch.on{display:block}
/* Джойстик и огонь нужны только в бою, кнопка «назад/пауза» — всегда */
#stickBase,#btnFire{display:none}
#touch.ingame #stickBase,#touch.ingame #btnFire{display:flex}
#stickBase{position:absolute;left:calc(14px + env(safe-area-inset-left));
  bottom:calc(18px + env(safe-area-inset-bottom));
  width:min(36vmin,180px);height:min(36vmin,180px);border-radius:50%;
  border:2px solid #3a3a3a;background:rgba(255,255,255,.05);pointer-events:auto;
  touch-action:none;align-items:center;justify-content:center}
#stickKnob{position:absolute;width:40%;height:40%;left:30%;top:30%;border-radius:50%;
  background:rgba(192,152,72,.55);border:2px solid #C09848}
#btnFire{position:absolute;right:calc(18px + env(safe-area-inset-right));
  bottom:calc(30px + env(safe-area-inset-bottom));
  width:min(27vmin,132px);height:min(27vmin,132px);border-radius:50%;
  border:2px solid #d05050;background:rgba(208,80,80,.25);color:#ff9090;pointer-events:auto;
  touch-action:none;align-items:center;justify-content:center;font-size:15px;letter-spacing:1px}
#btnFire:active{background:rgba(208,80,80,.5)}
#btnPause{position:absolute;right:calc(12px + env(safe-area-inset-right));
  top:calc(10px + env(safe-area-inset-top));min-width:56px;height:40px;padding:0 10px;
  border:2px solid #555;border-radius:6px;
  background:rgba(0,0,0,.55);color:#ccc;pointer-events:auto;display:flex;
  align-items:center;justify-content:center;font-size:13px}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:50;
  display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none}
.tst{background:#101010;border:1px solid #C09848;color:#f0d090;padding:4px 12px;font-size:11px;
  animation:tin .3s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="544" height="448"></canvas>

  <!-- ===== ГЛАВНОЕ МЕНЮ ===== -->
  <div class="overlay" id="scr-menu">
    <canvas id="logo" width="516" height="104" style="margin:4px auto 2px;max-width:100%;height:auto"></canvas>
    <div class="list" id="menuList"></div>
    <div class="hint" id="menuHint">&uarr;&darr; — выбор &nbsp; ENTER — ок &nbsp; &larr;&rarr; — уровень &nbsp; ESC — назад</div>
  </div>

  <!-- ===== УНИВЕРСАЛЬНЫЙ СПИСОЧНЫЙ ЭКРАН (магазин, рейтинг, ачивки, статистика, режимы) ===== -->
  <div class="overlay" id="scr-list">
    <div class="ttl" id="listTitle">SHOP</div>
    <div class="tabs" id="listTabs"></div>
    <div class="sub" id="listSub"></div>
    <div class="list" id="listBody"></div>
    <div class="hint" id="listHint">&uarr;&darr; — выбор &nbsp; ENTER — действие &nbsp; TAB — вкладка &nbsp; ESC — назад</div>
  </div>

  <!-- ===== РЕДАКТОР УРОВНЕЙ ===== -->
  <div class="overlay" id="scr-editor">
    <div class="ttl">LEVEL EDITOR</div>
    <div class="cols">
      <div id="edgrid"></div>
      <div class="pal" id="edpal"></div>
    </div>
    <div class="hint">ЛКМ — рисовать &nbsp; S — сохранить &nbsp; P — играть &nbsp; C — очистить &nbsp; E — код &nbsp; I — импорт &nbsp; ESC — назад</div>
  </div>

  <!-- ===== МОДАЛЬНОЕ ОКНО ===== -->
  <div id="modal"><div class="mbox" id="mbox"></div></div>
</div>

<!-- ===== СЕНСОРНОЕ УПРАВЛЕНИЕ ===== -->
<div id="touch">
  <div id="stickBase"><div id="stickKnob"></div></div>
  <div id="btnFire">FIRE</div>
  <div id="btnPause">II</div>
</div>
<div id="toast"></div>

<script>
"use strict";
/* =====================================================================================
   BATTLE CITY (Танчики, Dendy/NES 1990) — расширенная версия
   Один файл: движок, магазин внешнего вида, монеты, БД, онлайн, редактор уровней.
   Автор кода: сгенерировано для Дениса Павлова.
   Структура: CONFIG -> Utils -> Font -> Audio -> Palette/Art -> Save/Profile ->
              Shop -> Achievements -> Levels/Field -> Entities -> Game -> UI -> Online.
   ===================================================================================== */

/* ============================== 1. КОНФИГУРАЦИЯ ============================== */
const CFG = {
  UNIT: 8,             // юнит разрушения = 8 px (4x4 пикселя NES) — как в оригинале
  UCOLS: 52,           // 52x52 юнита = 13x13 клеток по 32 px
  TILE: 8,             // синоним UNIT для совместимости
  CELL: 32,            // размер клетки поля (как в оригинале)
  FIELD: 416,          // 13*32
  CW: 544, CH: 448,    // размер холста (поле + правая панель)
  OX: 16, OY: 16,      // отступ поля на холсте
  portrait: false,     // на телефоне в портрете панель уезжает под поле
  FPS: 60,
  MAX_ENEMIES_ON_SCREEN: 4,
  // Насколько настойчиво враги ломятся к орлу. AI_BASE_SHARE — доля танков,
  // которые идут ломать базу по кратчайшему маршруту (остальные охотятся на
  // игрока), AI_RANDOM — доля случайных ходов у тех, кто идёт к базе.
  // Меньше первое / больше второе = у игрока больше времени на оборону.
  AI_BASE_SHARE: 0.3,
  AI_RANDOM: 0.55,
  ENEMIES_PER_LEVEL: 20,
  TOTAL_LEVELS: 35,
  // Ключи внешних сервисов — ЗАГЛУШКИ. Подставьте свои, чтобы включить онлайн/оплату.
  FIREBASE: { apiKey: "", authDomain: "", projectId: "", appId: "" },
  MP_SERVER: "wss://battle-city-lm0b.onrender.com",                 // wss://your-server/ws — WebSocket для мультиплеера
};

/* ============================== 2. УТИЛИТЫ ============================== */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const chance = p => Math.random() < p;
const now = () => Date.now();
const today = () => new Date().toISOString().slice(0, 10);
// Пересечение прямоугольников
const hit = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
// Детерминированный ГПСЧ (для генерации уровней)
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function seedFromString(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const pad = (n, l) => String(n).padStart(l, "0");
function timeStr(ms) { const s = Math.floor(ms / 1000); return `${Math.floor(s / 3600)}ч ${Math.floor(s % 3600 / 60)}м ${s % 60}с`; }

// Всплывающие уведомления
/* Экранирование для вставки в innerHTML. Нужно для чата: сообщение приходит от
   другого игрока по сети, и без этого он мог бы прислать разметку или скрипт. */
function esc(v) {
  return String(v).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function toast(text, color) {
  const el = document.createElement("div");
  el.className = "tst"; el.textContent = text;
  if (color) { el.style.borderColor = color; el.style.color = color; }
  $("#toast").appendChild(el);
  setTimeout(() => { el.style.transition = "opacity .4s"; el.style.opacity = 0; setTimeout(() => el.remove(), 400); }, 2200);
}

/* ============================== 3. ПИКСЕЛЬНЫЙ ШРИФТ 5x7 ============================== */
const FONT = {
  "A": "01110/10001/10001/11111/10001/10001/10001", "B": "11110/10001/10001/11110/10001/10001/11110",
  "C": "01110/10001/10000/10000/10000/10001/01110", "D": "11110/10001/10001/10001/10001/10001/11110",
  "E": "11111/10000/10000/11110/10000/10000/11111", "F": "11111/10000/10000/11110/10000/10000/10000",
  "G": "01110/10001/10000/10111/10001/10001/01111", "H": "10001/10001/10001/11111/10001/10001/10001",
  "I": "11111/00100/00100/00100/00100/00100/11111", "J": "00111/00010/00010/00010/00010/10010/01100",
  "K": "10001/10010/10100/11000/10100/10010/10001", "L": "10000/10000/10000/10000/10000/10000/11111",
  "M": "10001/11011/10101/10101/10001/10001/10001", "N": "10001/11001/10101/10011/10001/10001/10001",
  "O": "01110/10001/10001/10001/10001/10001/01110", "P": "11110/10001/10001/11110/10000/10000/10000",
  "Q": "01110/10001/10001/10001/10101/10010/01101", "R": "11110/10001/10001/11110/10100/10010/10001",
  "S": "01111/10000/10000/01110/00001/00001/11110", "T": "11111/00100/00100/00100/00100/00100/00100",
  "U": "10001/10001/10001/10001/10001/10001/01110", "V": "10001/10001/10001/10001/10001/01010/00100",
  "W": "10001/10001/10001/10101/10101/11011/01010", "X": "10001/10001/01010/00100/01010/10001/10001",
  "Y": "10001/10001/01010/00100/00100/00100/00100", "Z": "11111/00001/00010/00100/01000/10000/11111",
  "0": "01110/10001/10011/10101/11001/10001/01110", "1": "00100/01100/00100/00100/00100/00100/01110",
  "2": "01110/10001/00001/00010/00100/01000/11111", "3": "11111/00010/00100/00010/00001/10001/01110",
  "4": "00010/00110/01010/10010/11111/00010/00010", "5": "11111/10000/11110/00001/00001/10001/01110",
  "6": "00110/01000/10000/11110/10001/10001/01110", "7": "11111/00001/00010/00100/01000/01000/01000",
  "8": "01110/10001/10001/01110/10001/10001/01110", "9": "01110/10001/10001/01111/00001/00010/01100",
  " ": "00000/00000/00000/00000/00000/00000/00000", "-": "00000/00000/00000/11111/00000/00000/00000",
  ".": "00000/00000/00000/00000/00000/01100/01100", ":": "00000/00100/00100/00000/00100/00100/00000",
  "!": "00100/00100/00100/00100/00100/00000/00100", "?": "01110/10001/00001/00010/00100/00000/00100",
  "/": "00001/00010/00010/00100/01000/01000/10000", "+": "00000/00100/00100/11111/00100/00100/00000",
  "%": "11001/11010/00010/00100/01000/01011/10011", "$": "00100/01111/10100/01110/00101/11110/00100",
  "(": "00010/00100/01000/01000/01000/00100/00010", ")": "01000/00100/00010/00010/00010/00100/01000",
  "*": "00000/10101/01110/11111/01110/10101/00000", "<": "00010/00100/01000/10000/01000/00100/00010",
  ">": "01000/00100/00010/00001/00010/00100/01000", ",": "00000/00000/00000/00000/01100/01100/11000",
  "#": "01010/11111/01010/01010/01010/11111/01010", "=": "00000/00000/11111/00000/11111/00000/00000",
  "'": "00100/00100/00000/00000/00000/00000/00000", "x": "00000/00000/10001/01010/00100/01010/10001"
};
// Кэш разобранных глифов
const GLYPH = {}; for (const k in FONT) GLYPH[k] = FONT[k].split("/");
// Отрисовка пиксельного текста
function text(ctx, str, x, y, scale = 1, color = "#fff") {
  ctx.fillStyle = color;
  let cx = x;
  for (const ch of String(str).toUpperCase()) {
    const g = GLYPH[ch] || GLYPH["?"];
    for (let r = 0; r < 7; r++) for (let c = 0; c < 5; c++)
      if (g[r][c] === "1") ctx.fillRect(cx + c * scale, y + r * scale, scale, scale);
    cx += 6 * scale;
  }
  return cx;
}
const textW = (str, scale = 1) => String(str).length * 6 * scale;
function textC(ctx, str, cx, y, scale, color) { text(ctx, str, cx - textW(str, scale) / 2, y, scale, color); }

/* ============================== 4. ЗВУК — МОДЕЛЬ APU NES ==============================
   Все звуки синтезируются так же, как их формировала звуковая микросхема Famicom/NES:
     * мелодии — импульсный канал со скважностью 50% (проверено по гармоникам оригинала:
       присутствуют только нечётные, h3≈0.33, h5≈0.20 — это чистый меандр);
     * шумы (выстрел, взрывы, попадания) — канал шума на 15-битном сдвиговом регистре (LFSR)
       с тактовой частотой, как в NES, поэтому тембр «хрустящий», а не «белый шум».
   Ноты и длительности мелодий, частоты и огибающие шумов сняты измерением
   оригинальных звуков игры (спектральный анализ: частоты, центроид, rolloff, огибающая).
   =================================================================================== */
const NOTE_IDX = { C: 0, "C#": 1, D: 2, "D#": 3, E: 4, F: 5, "F#": 6, G: 7, "G#": 8, A: 9, "A#": 10, B: 11 };
function noteFreq(n) {
  if (typeof n === "number") return n;
  const m = /^([A-G]#?)(-?\d)$/.exec(n);
  if (!m) return 440;
  const midi = (parseInt(m[2]) + 1) * 12 + NOTE_IDX[m[1]];
  return 440 * Math.pow(2, (midi - 69) / 12);
}
/* Мелодии оригинала. Шаг стартовой темы — 134.5 мс (снят с записи). */

/* --- Проигрыватель оригинальных записей ------------------------------------
   Записи звучат «как есть»: они идут мимо фильтра, который подобран для
   синтезированных звуков, иначе верхи срезались бы дважды.                   */
const SFX = {
  buffers: {}, offset: {}, ready: false, loading: false, failed: false,
  async load(ctx) {
    if (this.loading || this.ready) return;
    this.loading = true;
    let ok = 0;
    for (const k in SFX_DATA) {
      try {
        const bin = atob(SFX_DATA[k]);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        const buf = await new Promise((res, rej) => {
          const p = ctx.decodeAudioData(arr.buffer, res, rej);
          if (p && p.then) p.then(res, rej);           // современная промис-форма
        });
        this.buffers[k] = buf;
        this.offset[k] = this.findStart(buf);
        ok++;
      } catch (e) { /* формат не поддержан — останется синтез */ }
    }
    this.ready = ok > 0; this.failed = ok === 0; this.loading = false;
    if (this.failed) console.warn("Оригинальные записи не декодировались, работает APU-синтез");
  },
  // MP3-кодер добавляет тишину в начале — ищем реальное начало звука,
  // иначе выстрел отзывался бы с задержкой в пару десятков миллисекунд
  findStart(buf) {
    const d = buf.getChannelData(0);
    let peak = 0;
    for (let i = 0; i < d.length; i++) { const a = Math.abs(d[i]); if (a > peak) peak = a; }
    const th = peak * 0.02;
    for (let i = 0; i < d.length; i++) if (Math.abs(d[i]) > th) return Math.max(0, i / buf.sampleRate - 0.002);
    return 0;
  },
  play(name, vol, when) {
    const A = Audio_;
    if (!A.ok() || !this.buffers[name]) return false;
    const t = A.t0(when);
    const src = A.ctx.createBufferSource(); src.buffer = this.buffers[name];
    const g = A.ctx.createGain(); g.gain.value = vol == null ? 1 : vol;
    src.connect(g); g.connect(A.sfxBus);
    src.start(t, this.offset[name] || 0);
    return true;
  }
};

const Audio_ = {
  ctx: null, enabled: true, master: null, bufCache: {},
  engineSrc: null, engineGain: null, engineOn: false,
  init() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.30;
      this.master.connect(this.ctx.destination);
      // Шина синтеза: срез 7500 Гц подобран так, чтобы спектральный центроид
      // синтезированных звуков совпал с центроидом записей игры (2584 против 2586 Гц).
      this.lp = this.ctx.createBiquadFilter();
      this.lp.type = "lowpass"; this.lp.frequency.value = 7500; this.lp.Q.value = 0.7071;
      this.synth = this.ctx.createGain(); this.synth.gain.value = 1;
      this.synth.connect(this.lp); this.lp.connect(this.master);
      // Шина оригинальных записей — мимо фильтра
      this.sfxBus = this.ctx.createGain(); this.sfxBus.gain.value = 1.15;
      this.sfxBus.connect(this.master);
      SFX.load(this.ctx);          // декодируем вшитые записи
    } catch (e) { this.enabled = false; }
  },
  resume() { if (this.ctx && this.ctx.state === "suspended") this.ctx.resume(); },
  ok() { return this.enabled && this.ctx; },
  t0(when) { return this.ctx.currentTime + (when || 0); },

  /* --- КАНАЛ ШУМА NES: 15-битный LFSR ---------------------------------------
     Обратная связь: бит0 XOR бит1 (длинный режим) или бит0 XOR бит6 (короткий,
     «металлический»). Выход — инверсия бита 0. Частота сдвига задаётся таблицей
     периодов NES; здесь она берётся из измерений оригинальных звуков.          */
  lfsrBuffer(dur, rate0, rate1, short, variant) {
    variant = variant || 0;
    const key = `${dur}|${rate0}|${rate1}|${short ? 1 : 0}|${variant}`;
    if (this.bufCache[key]) return this.bufCache[key];
    const sr = this.ctx.sampleRate, len = Math.max(1, Math.ceil(sr * dur));
    const buf = this.ctx.createBuffer(1, len, sr), d = buf.getChannelData(0);
    let reg = 1, acc = 0, out = 1;
    // В NES регистр шума крутится непрерывно, а не сбрасывается на каждый звук.
    // Начало последовательности от seed=1 статистически смещено (доля единиц 0.66
    // вместо 0.5) — это давало «постоянку» и одинаковый призвук в начале каждого
    // выстрела. Прокручиваем регистр вперёд; разные варианты дают разную фазу шума.
    const warm = 977 + variant * 4093;
    for (let w = 0; w < warm; w++) {
      const fb = (reg ^ (reg >> (short ? 6 : 1))) & 1;
      reg = (reg >> 1) | (fb << 14);
    }
    out = (reg & 1) ? -1 : 1;
    for (let i = 0; i < len; i++) {
      const rate = rate0 * Math.pow(rate1 / rate0, i / len);
      acc += rate / sr;
      while (acc >= 1) {
        acc -= 1;
        const fb = (reg ^ (reg >> (short ? 6 : 1))) & 1;
        reg = (reg >> 1) | (fb << 14);
        out = (reg & 1) ? -1 : 1;
      }
      d[i] = out;
    }
    // Убираем постоянную составляющую: короткий отрезок шума неизбежно несимметричен,
    // а на приставке её срезает разделительный конденсатор на выходе звукового тракта.
    // Без этого каждый выстрел давал слышимый «щелчок» смещения.
    let mean = 0;
    for (let i = 0; i < len; i++) mean += d[i];
    mean /= len;
    for (let i = 0; i < len; i++) d[i] -= mean;
    this.bufCache[key] = buf;
    return buf;
  },
  // Шумовой звук с огибающей env = [[доляВремени, громкость], ...]
  noiseFX(dur, rate0, rate1, vol, env, when, short) {
    if (!this.ok()) return;
    const t = this.t0(when);
    const src = this.ctx.createBufferSource();
    // Три варианта фазы шума, чтобы подряд идущие выстрелы не звучали одинаково
    src.buffer = this.lfsrBuffer(dur, rate0, rate1 || rate0, short, rnd(3));
    const g = this.ctx.createGain();
    const e = env || [[0, 1], [1, 0.6]];
    g.gain.setValueAtTime(vol * e[0][1], t);
    for (let i = 1; i < e.length; i++) g.gain.linearRampToValueAtTime(Math.max(0.0001, vol * e[i][1]), t + dur * e[i][0]);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    src.connect(g); g.connect(this.synth); src.start(t); src.stop(t + dur + 0.02);
  },
  /* --- ИМПУЛЬСНЫЙ КАНАЛ (меандр 50%, как в мелодиях оригинала) --- */
  pulse(freq, dur, vol, when, slideTo) {
    if (!this.ok()) return;
    const t = this.t0(when), o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = "square"; o.frequency.setValueAtTime(noteFreq(freq), t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, noteFreq(slideTo)), t + dur);
    // Ступенчатая огибающая APU: держим уровень, затем резкий спад
    g.gain.setValueAtTime(vol, t);
    g.gain.setValueAtTime(vol, t + dur * 0.82);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.synth); o.start(t); o.stop(t + dur + 0.02);
  },
  // Проигрывание мелодии по сетке
  seqGrid(notes, step, vol, when, gate) {
    notes.forEach((n, i) => { if (n) this.pulse(n, step * (gate || 0.95), vol, (when || 0) + i * step); });
  },
  seqTimed(notes, vol, when) {
    notes.forEach(o => this.pulse(o.n, o.d, vol, (when || 0) + o.t));
  },
  // Совместимость со старым API
  tone(freq, dur, type, vol, slideTo) { this.pulse(freq, dur, vol != null ? vol : 0.3, 0, slideTo); },
  noise(dur, vol) { this.noiseFX(dur || 0.3, 5000, 4200, vol != null ? vol : 0.5); },

  /* ======================= ЗВУКИ ОРИГИНАЛА =======================
     По умолчанию играются ВШИТЫЕ ЗАПИСИ из оригинальной игры. Если браузер их не
     декодировал или в настройках выбран синтез — звучит модель APU, у которой частоты
     LFSR и огибающие подобраны по спектру тех же записей (расхождение центроида 1–9%). */
  useOrig() { return SFX.ready && SAVE.settings.origSfx !== false; },
  smp(name, vol, when) { return this.useOrig() && SFX.play(name, vol, when); },

  // Выстрел: запись 99 мс; синтез — шум с падающей яркостью (центроид 2466 -> 1673 Гц)
  shoot() { if (this.smp("bullet_shot", 1.0)) return; this.noiseFX(0.10, 4800, 3600, 0.45, [[0, 1], [0.5, 0.85], [1, 0.75]]); },
  shootEnemy() { if (this.smp("bullet_shot", 0.45)) return; this.noiseFX(0.10, 4800, 3600, 0.20, [[0, 1], [0.5, 0.85], [1, 0.75]]); },
  // Попадание в кирпич — тихий щелчок; в сталь/край поля — ниже и громче
  hitBrick() { if (this.smp("bullet_hit_1", 1.0)) return; this.noiseFX(0.085, 13400, 15000, 0.16, [[0, 0.2], [0.15, 1], [1, 0.9]]); },
  hitSteel() { if (this.smp("bullet_hit_2", 1.0)) return; this.noiseFX(0.073, 1400, 1100, 0.42, [[0, 1], [0.5, 0.7], [0.85, 1], [1, 0.9]]); },
  hitWall() { this.hitBrick(); },
  // Взрывы: 298 мс (враг) и 510 мс (игрок/база)
  explode(big) {
    if (this.smp(big ? "explosion_2" : "explosion_1", 1.0)) return;
    big ? this.noiseFX(0.51, 3800, 3120, 0.55, [[0, 1], [0.25, 0.9], [0.6, 0.7], [1, 0.55]])
      : this.noiseFX(0.30, 3800, 3740, 0.50, [[0, 1], [0.4, 0.95], [1, 0.7]]);
  },
  // Появление бонуса и его подбор
  bonusAppear() { if (this.smp("powerup_appear", 1.0)) return; this.seqGrid(TUNE_POWERUP_APPEAR, 0.066, 0.26); },
  bonus() { if (this.smp("powerup_pick", 1.0)) return; this.seqGrid(TUNE_POWERUP_PICK, 0.05, 0.28, 0, 1.0); },
  coin() { if (this.smp("statistics_1", 0.9)) { this.pulse("C6", 0.05, 0.14, 0.03); return; } this.pulse("C6", 0.05, 0.22); this.pulse("G6", 0.07, 0.22, 0.05); },
  // Стартовая тема игры (4.35 с)
  stageStart() {
    if (this.smp("stage_start", 1.0)) return;
    const step = 0.1345;
    this.seqGrid(TUNE_START_LEAD, step, 0.26, 0, 0.92);
    this.seqGrid(TUNE_START_BASS, step, 0.15, 0, 0.55);
  },
  start() { this.pulse("C5", 0.05, 0.2); this.pulse("G5", 0.07, 0.2, 0.06); },   // короткий сигнал старта уровня
  // GAME OVER
  lose() { if (this.smp("game_over", 1.0)) return; this.seqTimed(TUNE_GAMEOVER, 0.28); this.seqTimed(TUNE_GAMEOVER_BASS, 0.16); },
  gameOverTune() { this.lose(); },
  // Пауза
  pauseSfx() { if (this.smp("pause", 1.0)) return; this.seqGrid(TUNE_PAUSE, 0.062, 0.26); },
  // Тик подсчёта очков на экране статистики
  tick() { if (this.smp("statistics_1", 1.0)) return; this.noiseFX(0.041, 13200, 22000, 0.30, [[0, 1], [0.4, 0.5], [1, 0.15]]); },
  // Зачёт уровня — серия тиков подсчёта, как в оригинале, плюс аккорд
  win() {
    for (let i = 0; i < 10; i++) setTimeout(() => this.tick(), i * 55);
    setTimeout(() => { this.pulse("C5", 0.12, 0.26); this.pulse("E5", 0.12, 0.2, 0.12); this.pulse("G5", 0.22, 0.26, 0.24); }, 620);
  },
  // Эффекты выстрелов из магазина (не из оригинала — для купленных стилей)
  laser() { this.pulse(1400, 0.09, 0.22, 0, 220); },
  plasma() { this.pulse(500, 0.11, 0.22, 0, 1600); },

  /* --- МОТОР ТАНКА: непрерывный низкочастотный шум APU ---
     В оригинале двигатель гудит постоянно и меняет тон при движении.       */
  engine(on, moving) {
    if (!this.ok()) { return; }
    if (on && !this.engineSrc) {
      const src = this.ctx.createBufferSource();
      src.buffer = this.lfsrBuffer(0.5, 900, 900, false, 0);
      src.loop = true;
      const g = this.ctx.createGain(); g.gain.value = 0.05;
      const lp = this.ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900;
      src.connect(lp); lp.connect(g); g.connect(this.synth); src.start();
      this.engineSrc = src; this.engineGain = g; this.engineLp = lp;
    } else if (!on && this.engineSrc) {
      try { this.engineSrc.stop(); } catch (e) { }
      this.engineSrc = null; this.engineGain = null;
    }
    if (this.engineSrc) {
      // Едет — тон выше и громче, стоит — низкий холостой гул
      const t = this.ctx.currentTime;
      this.engineSrc.playbackRate.setTargetAtTime(moving ? 1.0 : 0.55, t, 0.04);
      this.engineGain.gain.setTargetAtTime(moving ? 0.06 : 0.035, t, 0.05);
    }
  },
  toggle() { this.enabled = !this.enabled; if (!this.enabled) this.engine(false); return this.enabled; }
};

/* Вывод пиксельной матрицы. colorOf(символ, строка) -> цвет или null.
   Одинаковые символы подряд склеиваются в одну заливку — это и быстрее,
   и края остаются ровно на пиксельной сетке. */
function drawArt(ctx, x, y, art, colorOf, s) {
  for (let r = 0; r < art.length; r++) {
    const row = art[r];
    let c = 0;
    while (c < row.length) {
      const ch = row[c];
      if (ch === ".") { c++; continue; }
      let n = 1;
      while (c + n < row.length && row[c + n] === ch) n++;
      const col = colorOf(ch, r);
      if (col) { ctx.fillStyle = col; ctx.fillRect(x + c * s, y + r * s, n * s, s); }
      c += n;
    }
  }
}
/* Рисование танка по спрайту. dir: 0=вверх, 1=вправо, 2=вниз, 3=влево. */
function drawTank(ctx, x, y, dir, colors, opt = {}) {
  const s = 2, [m, l, d] = colors;
  const art = TANK_ART[opt.art] || TANK_ART.p0;
  ctx.save();
  ctx.translate(x + 16, y + 16); ctx.rotate(dir * Math.PI / 2); ctx.translate(-x - 16, -y - 16);
  const ph = opt.trackPhase ? 1 : 0;
  // Гусеница: полосы сдвигаются на кадр — так видно, что танк едет
  drawArt(ctx, x, y, art, (ch, r) => ch === "T" ? ((r + ph) % 2 ? l : d)
    : ch === "M" ? m : ch === "L" ? l : ch === "D" ? d : "#f8f8f8", s);
  // Эмблема-скин на корпусе
  if (opt.skin && opt.skin !== "classic") drawSkin(ctx, x, y, opt.skin, s, opt.skinData);
  ctx.restore();
  // Щит неуязвимости — мерцающее кольцо из пикселей, а не сглаженная обводка
  if (opt.shield) {
    const f = Math.floor(now() / 70) % 2;
    drawArt(ctx, x, y, SHIELD_ART[f], ch => ch === "W" ? "#ffffff" : "#80d8ff", 2);
  }
  // Броня (купленный апгрейд) — уголки
  if (opt.armor > 0) {
    ctx.fillStyle = "#40e0ff";
    ctx.fillRect(x, y, 4, 2); ctx.fillRect(x + 28, y, 4, 2);
    ctx.fillRect(x, y + 30, 4, 2); ctx.fillRect(x + 28, y + 30, 4, 2);
  }
}
// Эмблемы (скины) 6x6 в центре корпуса
/* Эмблемы 8x8 на корпусе. Были одноцветными — на танке любая из них читалась
   как белое пятно, особенно пламя. Теперь у каждой своя палитра: символ в
   матрице = цвет. Плюс тёмная подложка на пиксель ниже, чтобы рисунок
   отделялся от корпуса на любом цвете танка. */
const SKIN_ART = {
  // Звезда: белое ядро и золотая кайма — видна на танке любого цвета
  star: { art: ["...gg...", "...ww...", "..gwwg..", "gwwwwwwg", ".gwwwwg.", "..gwwg..", ".gg..gg.", "gg....gg"], pal: { g: "#e0a800", w: "#ffffff" } },
  // Молния: жёлтая с белым сколом
  bolt: { art: ["....yy..", "...yy...", "..yy....", ".yyyyy..", "..llyy..", "..yy....", ".yy.....", "yy......"], pal: { y: "#f8d020", l: "#ffffff" } },
  // Череп: кость и тёмные глазницы
  skull: { art: ["..wwww..", ".wwwwww.", "wddwwddw", "wddwwddw", "wwwwwwww", ".wwddww.", ".wwwwww.", "..w..w.."], pal: { w: "#f0f0f0", d: "#202020" } },
  // Пламя: три цвета от края к ядру
  flame: { art: ["...y....", "..oy.o..", ".royyoo.", ".royyyo.", "roryyyor", "roryyyor", ".royyyo.", "..roor.."], pal: { r: "#8a2010", o: "#e05010", y: "#ffd020" } },
  // Дракон: голова с красными глазами, распахнутые крылья, хвост
  dragon: { art: ["d......d", "dg.ee.gd", "dggeeggd", "dggggggd", ".dggggd.", "..dggd..", "..dggd..", "...dd..."], pal: { d: "#14361a", g: "#5cc04a", e: "#ff3020" } }
};
/* Флаг — три полосы и древко. По умолчанию российский: белый, синий, красный. */
const FLAG_ART = ["paaaaaa.", "paaaaaa.", "pbbbbbb.", "pbbbbbb.", "pcccccc.", "pcccccc.", "p.......", "p......."];
function drawSkin(ctx, x, y, skin, s, data) {
  let art, pal;
  if (skin === "custom") {
    art = (data && data.length) ? data : SKIN_ART.star.art;
    pal = { "#": "#ffffff" };
  } else if (skin === "flag") {
    const b = (data && data.length === 3) ? data : ["#ffffff", "#0039A6", "#D52B1E"];
    art = FLAG_ART;
    pal = { p: "#8a6a28", a: b[0], b: b[1], c: b[2] };
  } else {
    const e = SKIN_ART[skin] || SKIN_ART.star;
    art = e.art; pal = e.pal;
  }
  const n = art.length, w = art[0].length;
  const ox = x + (8 - w / 2) * s, oy = y + 6 * s;            // ровно по центру корпуса
  // тень на пиксель вниз-вправо, затем сам рисунок
  ctx.fillStyle = "rgba(0,0,0,.55)";
  for (let r = 0; r < n; r++) for (let c = 0; c < w; c++)
    if (art[r][c] !== ".") ctx.fillRect(ox + (c + 1) * s, oy + (r + 1) * s, s, s);
  for (let r = 0; r < n; r++) for (let c = 0; c < w; c++) {
    const col = pal[art[r][c]];
    if (col) { ctx.fillStyle = col; ctx.fillRect(ox + c * s, oy + r * s, s, s); }
  }
}

function loadSave() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return JSON.parse(JSON.stringify(DEFAULT_SAVE));
    const s = JSON.parse(raw);
    return deepMerge(JSON.parse(JSON.stringify(DEFAULT_SAVE)), s);
  } catch (e) { return JSON.parse(JSON.stringify(DEFAULT_SAVE)); }
}
function deepMerge(base, over) {
  for (const k in over) {
    if (over[k] && typeof over[k] === "object" && !Array.isArray(over[k]) && base[k]) deepMerge(base[k], over[k]);
    else base[k] = over[k];
  }
  return base;
}
let saveTimer = null;
function persist() {   // отложенная запись, чтобы не тормозить 60 FPS
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(SAVE)); } catch (e) { }
    Cloud.pushSoon();       // отложенная отправка профиля в облако
  }, 300);
}

}

// Куплен ли товар (с учётом премиума и бесплатных стартовых)
function isOwned(cat, item) {
  if (item.price === 0) return true;
  return (SAVE.owned[cat] || []).includes(item.id);
}
function isLocked(item) {
  if (item.top10) return !LB.isTop10(SAVE.name);
  return (item.lvl || 0) > SAVE.maxLevel;
}
function buy(cat, item) {
  if (isOwned(cat, item)) return false;
  if (isLocked(item)) { toast("ЗАБЛОКИРОВАНО: нужен уровень " + item.lvl, "#d05050"); Audio_.hitWall(); return false; }
  if (item.price < 0) { toast("Доступно только по подписке", "#d05050"); return false; }
  if (SAVE.coins < item.price) {
    toast("НЕ ХВАТАЕТ МОНЕТ", "#d05050"); Audio_.hitWall();
    Log.warn("не хватило монет на «" + item.name + "»: нужно " + item.price + ", есть " + SAVE.coins);
    return false;
  }
  SAVE.coins -= item.price;
  SAVE.owned[cat] = SAVE.owned[cat] || []; SAVE.owned[cat].push(item.id);
  persist(); Audio_.bonus(); toast("КУПЛЕНО: " + item.name, "#70B050");
  Log.info("покупка: " + item.name + " за " + item.price + ", остаток " + SAVE.coins);
  Ach.check();
  return true;
}

    for (const [dx, dy] of [[0, 0], [16, 0], [0, 16], [16, 16]]) {
      x.fillStyle = NES.snowB; x.fillRect(dx, dy, 16, 16);
      const p = (px, py, col) => { x.fillStyle = col; x.fillRect(dx + px * P, dy + py * P, P, P); };
      p(0, 0, NES.snowC); p(3, 0, NES.snowA); p(4, 0, NES.snowC); p(0, 3, NES.snowA); p(0, 4, NES.snowC);
      for (let t = 0; t < 8; t++) p(t, 7 - t, NES.snowA);
      for (let t = 0; t < 7; t++) p(1 + t, 7 - t, NES.snowC);
      for (let t = 0; t < 4; t++) p(4 + t, 7 - t, NES.snowA);
      for (let t = 0; t < 3; t++) p(5 + t, 7 - t, NES.snowC);
    }
  });
  // Лес (кусты)
  const FOREST = ["dbbbcbad", "bbcacaca", "bbbccaaa", "cbbaabca", "bbacaaac", "bcbaaaaa", "aaaaacaa", "daacaaad"];
  const FSCHEME = { a: NES.forestA, b: NES.forestB, c: NES.forestC };
  PAT.forest = makePattern(32, 32, x => {
    for (const [dx, dy] of [[0, 0], [16, 0], [0, 16], [16, 16]])
      FOREST.forEach((row, r) => row.split("").forEach((ch, c) => {
        if (ch === "d") return;
        x.fillStyle = FSCHEME[ch]; x.fillRect(dx + c * P, dy + r * P, P, P);
      }));
  });
  // Орёл и разбитый орёл (16x16 пикселей оригинала -> 32 px)
  PAT.eagle = makePattern(32, 32, x => {
    EAGLE_ART.forEach((row, r) => row.split("").forEach((ch, c) => {
      if (ch === ".") return;
      x.fillStyle = ch === "R" ? NES.eagleRed : NES.eagle;
      x.fillRect(c * P, r * P, P, P);
    }));
  });
  PAT.eagleBroken = makePattern(32, 32, x => {
    EAGLE_BROKEN_ART.forEach((row, r) => row.split("").forEach((ch, c) => {
      if (ch === ".") return;
      x.fillStyle = ch === "B" ? NES.eagleBroken : NES.eagle;
      x.fillRect(c * P, r * P, P, P);
    }));
  });
}
buildPatterns();   // текстуры готовим сразу, чтобы отрисовка не зависела от порядка запуска

// Орёл-база
function drawEagle(ctx, x, y, destroyed) {
  ctx.fillStyle = "#000"; ctx.fillRect(x, y, 32, 32);
  ctx.drawImage(destroyed ? PAT.eagleBroken : PAT.eagle, x, y);
}
// Кирпичный «юнит» 8x8 px — рисунок зависит от чётности клетки (как в оригинале)
function drawBrickUnit(ctx, px, py, ux, uy) {
  const shape = ((ux + uy) % 2 === 0);
  ctx.fillStyle = NES.brickShade; ctx.fillRect(px, py, 8, 8);
  ctx.fillStyle = NES.brickDark; ctx.fillRect(px + (shape ? 0 : 2), py, shape ? 8 : 6, 6);
  ctx.fillStyle = NES.brickLight; ctx.fillRect(px + (shape ? 0 : 4), py + 2, shape ? 8 : 4, 4);
}

/* ================================ ПОЛЕ БОЯ ================================ */
class Field {
  constructor() {
    this.g = new Uint8Array(CFG.UCOLS * CFG.UCOLS);
    // Базы: в кампании/кооперативе одна (внизу), в PvP — две (внизу и вверху)
    this.bases = [{ x: 24, y: 48, dead: false }];
    // Журнал изменений местности — только для сетевой партии у хоста.
    // Без флага он копился бы и в одиночной игре (утечка памяти на длинной партии).
    this.changes = []; this.recording = false;
    this.waterPhase = 0;
    this.cache = document.createElement("canvas");
    this.cache.width = CFG.FIELD; this.cache.height = CFG.FIELD;
    this.cctx = this.cache.getContext("2d");
    this.dirty = true; this.rev = 0; this.waterUnits = []; this.forestUnits = [];
  }
  // Совместимость: baseX/baseY/baseDead всегда указывают на основную базу
  get baseX() { return this.bases[0].x; }
  get baseY() { return this.bases[0].y; }
  get baseDead() { return this.bases[0].dead; }
  at(x, y) { return (x < 0 || y < 0 || x >= CFG.UCOLS || y >= CFG.UCOLS) ? T.STEEL : this.g[y * CFG.UCOLS + x]; }
  set(x, y, v) {
    if (x < 0 || y < 0 || x >= CFG.UCOLS || y >= CFG.UCOLS) return;
    const i = y * CFG.UCOLS + x;
    if (this.g[i] !== v) {
      this.g[i] = v; this.dirty = true; this.rev++;
      if (this.recording) this.changes.push(x, y, v);
    }
  }
  fillRectUnits(ux, uy, w, h, v) { for (let b = 0; b < h; b++) for (let a = 0; a < w; a++) this.set(ux + a, uy + b, v); }
  /* Загрузка карты.
     Новый формат (оригинал): 13 строк по 26 символов, клетка = тип + hex-маска четвертей.
     Старый формат (уровни из редактора v1): 13 строк по 13 символов, по символу на клетку. */
  load(rows, opts) {
    opts = opts || {};
    this.g.fill(T.EMPTY); this.dirty = true;
    this.bases = [{ x: 24, y: 48, dead: false }];
    const isNew = rows[0] && rows[0].length >= 26;
    for (let cy = 0; cy < 13; cy++) {
      const line = rows[cy] || "";
      for (let cx = 0; cx < 13; cx++) {
        let type, mask;
        if (isNew) {
          const t = line[cx * 2], h = line[cx * 2 + 1];
          if (!t || t === ".") continue;
          type = CHAR2TILE[t]; mask = parseInt(h, 16);
          if (isNaN(mask)) mask = 15;
        } else {
          const ch = line[cx];
          if (!ch || ch === ".") continue;
          type = ch === "S" ? T.STEEL : (ch === "W" ? T.WATER : (ch === "T" ? T.TREE : (ch === "I" ? T.ICE : CHAR2TILE[ch])));
          mask = 15;
        }
        if (type === undefined || type === T.EMPTY) continue;
        const ux = cx * 4, uy = cy * 4;
        if (type === T.BRICK || type === T.STEEL) {
          // Маска четвертей: 1=лево-верх, 2=право-верх, 4=лево-низ, 8=право-низ
          if (mask & 1) this.fillRectUnits(ux, uy, 2, 2, type);
          if (mask & 2) this.fillRectUnits(ux + 2, uy, 2, 2, type);
          if (mask & 4) this.fillRectUnits(ux, uy + 2, 2, 2, type);
          if (mask & 8) this.fillRectUnits(ux + 2, uy + 2, 2, 2, type);
        } else {
          this.fillRectUnits(ux, uy, 4, 4, type);   // вода/лес/лёд/орёл — всегда вся клетка
          if (type === T.BASE) { this.bases[0].x = ux; this.bases[0].y = uy; }
        }
      }
    }
    // Точки появления танков всегда свободны
    [[0, 0], [6, 0], [12, 0], [4, 12], [8, 12]].forEach(([cx, cy]) => this.fillRectUnits(cx * 4, cy * 4, 4, 4, T.EMPTY));
    // PvP: зеркальная вторая база сверху со своей кирпичной защитой
    if (opts.twoBases) {
      const b0 = this.bases[0];
      const b1 = { x: b0.x, y: 0, dead: false };
      this.bases.push(b1);
      // Зеркалим защиту первой базы относительно её центра
      const shield = this.shieldUnits(0);
      for (const [x, y] of shield) {
        const dy = y - b0.y;                       // смещение относительно верхнего края орла
        const my = b1.y + (3 - dy);                // отражение по вертикали
        if (my >= 0 && my < CFG.UCOLS) this.set(x, my, T.BRICK);
      }
      // Освобождаем место под второго игрока и убираем чужие блоки из-под орла
      this.fillRectUnits(b1.x, b1.y, 4, 4, T.BASE);
      [[4, 0], [8, 0]].forEach(([cx, cy]) => this.fillRectUnits(cx * 4, cy * 4, 4, 4, T.EMPTY));
    }
    for (const b of this.bases) this.fillRectUnits(b.x, b.y, 4, 4, T.BASE);
    this.changes.length = 0;
  }
  // Юниты кирпичной «коробки» вокруг орла (как в оригинале: U-образная стенка)
  shieldUnits(idx) {
    const b = this.bases[idx || 0]; if (!b) return [];
    const bx = b.x, by = b.y, list = [];
    for (let x = bx - 2; x < bx + 6; x++) { list.push([x, by - 2]); list.push([x, by - 1]); }
    for (let y = by; y < by + 4; y++) {
      list.push([bx - 2, y]); list.push([bx - 1, y]);
      list.push([bx + 4, y]); list.push([bx + 5, y]);
    }
    return list;
  }
  fortify(tile, idx) {
    for (const [x, y] of this.shieldUnits(idx || 0))
      if (this.at(x, y) !== T.BASE && (x >= 0 && y >= 0 && x < CFG.UCOLS && y < CFG.UCOLS)) this.set(x, y, tile);
  }
  isSolidForTank(t) { return t === T.BRICK || t === T.STEEL || t === T.WATER || t === T.BASE; }
  canMove(x, y, w, h) {
    if (x < 0 || y < 0 || x + w > CFG.FIELD || y + h > CFG.FIELD) return false;
    const U = CFG.UNIT;
    const x0 = Math.floor(x / U), y0 = Math.floor(y / U);
    const x1 = Math.floor((x + w - 1) / U), y1 = Math.floor((y + h - 1) / U);
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++)
      if (this.isSolidForTank(this.at(tx, ty))) return false;
    return true;
  }
  onIce(x, y, w, h) {
    const U = CFG.UNIT;
    return this.at(Math.floor((x + w / 2) / U), Math.floor((y + h / 2) / U)) === T.ICE;
  }
  /* Попадание пули.
     Ширина «просеки» — 8 NES-px (2 юнита), а ГЛУБИНА — ровно один юнит (4 NES-px),
     как в оригинале: поэтому кирпичная клетка прошивается за 4 выстрела, а защита
     орла толщиной в пол-клетки — за два.
     ВАЖНО: просека центрируется на самой пуле, а не на «чётной» паре юнитов.
     Танк выравнивается по сетке 8 px, то есть вдвое мельче, чем пара юнитов (16 px),
     поэтому при выравнивании по парам половина выстрелов уезжала на 8 px в сторону:
     видно, как пуля задевает кирпич, а ломается соседний. Теперь ломается ровно то,
     во что пуля попала.                                                              */
  bulletHit(b, power) {
    const res = { hit: false, base: false, destroyed: 0 };
    const U = CFG.UNIT, LAST = CFG.UCOLS - 1;
    let x0, x1, y0, y1;
    /* Ширина просеки — четыре юнита (32 px): по два в каждую сторону от центра
       снаряда. Раньше было два юнита, то есть 16 px, а танк шириной 32 px —
       в пробитый проход было не проехать, приходилось смещаться на полклетки
       и простреливать то же место второй раз.
       Танк выровнен по сетке 8 px, поэтому просека ложится ровно на те четыре
       юнита, которые занимает он сам: выстрелил вперёд — и поехал.
       Побочный эффект приятный: у стены снаряд теперь достаёт до крайнего юнита
       сам (танк у левого края даёт юниты 0-3), и отдельный костыль, которым
       раньше дотягивали просеку до края на 35-м уровне, больше не нужен. */
    const span = c => {
      const m = Math.round(c / U);
      return [Math.max(0, m - 2), Math.min(LAST, m + 1)];
    };
    if (b.dir === 0 || b.dir === 2) {
      const edge = b.dir === 0 ? b.y : b.y + b.h - 1;
      y0 = y1 = Math.floor(edge / U);            // глубина — ровно один юнит (4 px NES)
      [x0, x1] = span(b.x + b.w / 2);
    } else {
      const edge = b.dir === 3 ? b.x : b.x + b.w - 1;
      x0 = x1 = Math.floor(edge / U);
      [y0, y1] = span(b.y + b.h / 2);
    }
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
      const t = this.at(tx, ty);
      if (t === T.BASE) { res.hit = true; res.base = true; res.baseIndex = this.baseAt(tx, ty); }
      else if (t === T.BRICK) { this.set(tx, ty, T.EMPTY); res.hit = true; res.destroyed++; }
      else if (t === T.STEEL) {
        res.hit = true; res.steel = true;
        // Сталь ломается только усиленной пулей и уходит целым куском 2x2 юнита
        if (power >= 2) {
          const sx = tx - (tx % 2), sy = ty - (ty % 2);
          for (let a = 0; a < 2; a++) for (let c = 0; c < 2; c++)
            if (this.at(sx + a, sy + c) === T.STEEL) { this.set(sx + a, sy + c, T.EMPTY); res.destroyed++; }
        }
      }
    }
    if (b.x < 0 || b.y < 0 || b.x + b.w > CFG.FIELD || b.y + b.h > CFG.FIELD) { res.hit = true; res.steel = true; }
    return res;
  }
  // Какой базе принадлежит юнит
  baseAt(x, y) {
    for (let i = 0; i < this.bases.length; i++) {
      const b = this.bases[i];
      if (x >= b.x && x < b.x + 4 && y >= b.y && y < b.y + 4) return i;
    }
    return 0;
  }
  destroyBase(idx) {
    const b = this.bases[idx || 0]; if (!b || b.dead) return;
    b.dead = true;
    this.fillRectUnits(b.x, b.y, 4, 4, T.EMPTY);
  }
  /* --- Отрисовка --- */
  drawBack(ctx, ox, oy) {
    if (this.dirty) this.rebuildCache();
    ctx.drawImage(this.cache, ox, oy);
    // Вода анимируется двумя кадрами, как в оригинале
    this.waterPhase += 0.02;
    const frame = PAT.water[Math.floor(this.waterPhase) % 2];
    for (const [x, y] of this.waterUnits)
      ctx.drawImage(frame, (x % 4) * 8, (y % 4) * 8, 8, 8, ox + x * 8, oy + y * 8, 8, 8);
    for (const b of this.bases) drawEagle(ctx, ox + b.x * 8, oy + b.y * 8, b.dead);
  }
  rebuildCache() {
    const ctx = this.cctx;
    ctx.clearRect(0, 0, CFG.FIELD, CFG.FIELD);
    this.waterUnits = []; this.forestUnits = [];
    for (let y = 0; y < CFG.UCOLS; y++) for (let x = 0; x < CFG.UCOLS; x++) {
      const t = this.g[y * CFG.UCOLS + x];
      if (!t || t === T.BASE) continue;
      const px = x * 8, py = y * 8;
      if (t === T.BRICK) drawBrickUnit(ctx, px, py, x, y);
      else if (t === T.STEEL) ctx.drawImage(PAT.steel, (x % 2) * 8, (y % 2) * 8, 8, 8, px, py, 8, 8);
      else if (t === T.ICE) ctx.drawImage(PAT.ice, (x % 4) * 8, (y % 4) * 8, 8, 8, px, py, 8, 8);
      else if (t === T.WATER) this.waterUnits.push([x, y]);
      else if (t === T.TREE) this.forestUnits.push([x, y]);
    }
    this.dirty = false;
  }
  // Лес рисуется ПОВЕРХ танков — в нём можно спрятаться
  drawFront(ctx, ox, oy) {
    for (const [x, y] of this.forestUnits)
      ctx.drawImage(PAT.forest, (x % 4) * 8, (y % 4) * 8, 8, 8, ox + x * 8, oy + y * 8, 8, 8);
  }
}

/* ============================== 10. ИГРОВЫЕ ОБЪЕКТЫ ============================== */
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];   // 0=вверх 1=вправо 2=вниз 3=влево

/* --- Пуля --- */
class Bullet {
  constructor(owner, x, y, dir, power, style) {
    this.owner = owner; this.x = x; this.y = y; this.w = 8; this.h = 8;
    this.dir = dir; this.power = power; this.style = style || "normal";
    this.speed = owner.isPlayer
      ? (owner.stars >= 1 ? 6 : 4.2)
      : (ENEMY_TYPES[owner.kind] && ENEMY_TYPES[owner.kind].fastBullet ? 6 : 4);
    // Дальность снаряда не ограничена — как в оригинале, он летит, пока во что-нибудь
    // не попадёт. Прежний предел (640 px у игрока) был больше поля (416 px), то есть
    // не работал вовсе, зато улучшение «дальность» из магазина не давало ничего.
    this.dead = false;
    this.trail = [];
  }
  update(g) {
    for (let i = 0; i < 2; i++) {   // подшаг для точной коллизии на высокой скорости
      const st = this.speed / 2;
      this.x += DX[this.dir] * st; this.y += DY[this.dir] * st;
      const r = g.field.bulletHit(this, this.power);
      if (r.base) {
        const bi = r.baseIndex || 0;
        if (!g.field.bases[bi] || !g.field.bases[bi].dead) { g.baseDestroyed(bi, this.owner); this.dead = true; return; }
      }
      if (r.destroyed) { g.stats.blocks += r.destroyed; SAVE.stats.blocks += r.destroyed; }
      if (r.hit) {
        this.dead = true;
        g.addExplosion(this.x - 8, this.y - 8, "small");
        // Звук зависит от препятствия: сталь/край поля звучат глуше и громче
        if (this.owner.isPlayer) (r.steel && !r.destroyed) ? Audio_.hitSteel() : Audio_.hitBrick();
        return;
      }
    }
    this.trail.push({ x: this.x, y: this.y }); if (this.trail.length > 6) this.trail.shift();
  }
  draw(ctx, ox, oy) {
    const x = ox + this.x, y = oy + this.y;
    const S = this.style;
    if (S === "laser") {           // лазер — красный луч
      ctx.fillStyle = "rgba(255,60,60,.5)";
      this.trail.forEach((t, i) => ctx.fillRect(ox + t.x + 2, oy + t.y + 2, 4, 4));
      ctx.fillStyle = "#ff4040"; ctx.fillRect(x + 1, y + 1, 6, 6);
      ctx.fillStyle = "#fff"; ctx.fillRect(x + 3, y + 3, 2, 2);
    } else if (S === "plasma") {   // плазма — зелёная с искрами
      ctx.fillStyle = "#70ff70"; ctx.fillRect(x + 1, y + 1, 6, 6);
      ctx.fillStyle = "#c0ffc0";
      for (let i = 0; i < 3; i++) ctx.fillRect(x + rnd(8) - 2, y + rnd(8) - 2, 2, 2);
    } else if (S === "fire") {     // огненный трассер
      this.trail.forEach((t, i) => {
        ctx.fillStyle = i > 3 ? "#ffd020" : "#e05010";
        ctx.fillRect(ox + t.x + 2, oy + t.y + 2, 4, 4);
      });
      ctx.fillStyle = "#fff060"; ctx.fillRect(x + 1, y + 1, 6, 6);
    } else if (S === "electro") {  // электрический — синие разряды
      ctx.fillStyle = "#40a0ff"; ctx.fillRect(x + 1, y + 1, 6, 6);
      ctx.strokeStyle = "#c0e0ff"; ctx.lineWidth = 1; ctx.beginPath();
      for (let i = 0; i < 3; i++) { ctx.moveTo(x + 4, y + 4); ctx.lineTo(x + 4 + rnd(14) - 7, y + 4 + rnd(14) - 7); }
      ctx.stroke();
    } else if (S === "firework") {
      ctx.fillStyle = ["#ff40ff", "#40ffff", "#ffff40"][Math.floor(now() / 60) % 3];
      ctx.fillRect(x, y, 8, 8); ctx.fillStyle = "#fff"; ctx.fillRect(x + 2, y + 2, 4, 4);
    } else {                        // обычный снаряд
      ctx.fillStyle = "#e8e8e8"; ctx.fillRect(x + 2, y + 2, 4, 4);
      ctx.fillStyle = "#a0a0a0";
      if (this.dir === 0) ctx.fillRect(x + 3, y, 2, 2); if (this.dir === 2) ctx.fillRect(x + 3, y + 6, 2, 2);
      if (this.dir === 3) ctx.fillRect(x, y + 3, 2, 2); if (this.dir === 1) ctx.fillRect(x + 6, y + 3, 2, 2);
    }
  }
}

/* --- Базовый танк --- */
class Tank {
  constructor(g, x, y, dir) {
    this.g = g; this.x = x; this.y = y; this.w = 32; this.h = 32;
    this.dir = dir; this.moving = false; this.speed = 1.0;
    this.bullets = 0; this.maxBullets = 1; this.cooldown = 0; this.reloadTime = 14;
    this.dead = false; this.stars = 0; this.hp = 1; this.armor = 0;
    this.trackPhase = 0; this.spawnTimer = 0; this.shield = 0; this.slide = 0;
    this.isPlayer = false; this.colors = TANK_COLORS.e_basic;
  }
  rect() { return { x: this.x, y: this.y, w: this.w, h: this.h }; }
  // Попытка движения; возвращает true если сдвинулись
  tryMove(dir, dist) {
    const nx = this.x + DX[dir] * dist, ny = this.y + DY[dir] * dist;
    // Скругление к сетке 8px при повороте (как в оригинале)
    let ax = nx, ay = ny;
    if (dir === 0 || dir === 2) ax = Math.round(nx / 8) * 8;
    else ay = Math.round(ny / 8) * 8;
    if (!this.g.field.canMove(ax, ay, this.w, this.h)) return false;
    if (this.g.tankAt(ax, ay, this)) return false;
    this.x = ax; this.y = ay;
    return true;
  }
  move(dir) {
    const turned = this.dir !== dir;
    this.dir = dir; this.moving = true;
    const ok = this.tryMove(dir, this.speed);
    if (ok) this.trackPhase += this.speed * 0.12;
    // Лёд: инерция скольжения
    if (this.g.field.onIce(this.x, this.y, this.w, this.h)) this.slide = 12;
    return ok;
  }
  updateSlide() {
    if (this.slide > 0 && !this.moving) { this.slide--; this.tryMove(this.dir, this.speed * 0.7); }
  }
  /* Выстрел. У игрока нет таймера перезарядки — как в оригинале, следующий
     снаряд можно послать сразу, как только предыдущий во что-нибудь попал.
     Ограничение одно: сколько своих снарядов одновременно в воздухе.
     У врагов таймер остаётся — иначе они превращаются в пулемёты. */
  fire() {
    if (this.bullets >= this.maxBullets) return null;
    if (!this.isPlayer && this.cooldown > 0) return null;
    const cx = this.x + 16 + DX[this.dir] * 14 - 4, cy = this.y + 16 + DY[this.dir] * 14 - 4;
    const b = new Bullet(this, cx, cy, this.dir, this.isPlayer ? (this.stars >= 3 ? 2 : 1) : (this.kind === "boss" ? 2 : 1),
      this.isPlayer ? SAVE.equipped.shot : "normal");
    this.bullets++; this.cooldown = this.reloadTime;
    this.g.bullets.push(b);
    if (this.isPlayer) {
      SAVE.stats.bulletsFired++;
      const s = SAVE.equipped.shot;
      if (s === "laser") Audio_.laser(); else if (s === "plasma") Audio_.plasma(); else Audio_.shoot();
    } else Audio_.shootEnemy();
    return b;
  }
  takeDamage(dmg, from) {
    if (this.shield > 0) return false;
    if (this.armor > 0) { this.armor--; Audio_.hitWall(); return false; }
    this.hp -= dmg;
    if (this.hp <= 0) { this.dead = true; return true; }
    Audio_.hitWall();
    return false;
  }
  draw(ctx, ox, oy) {
    if (this.spawnTimer > 0) { this.drawSpawn(ctx, ox, oy); return; }
    drawTank(ctx, ox + this.x, oy + this.y, this.dir, this.colors, {
      art: this.isPlayer ? "p" + clamp(this.stars, 0, 3) : this.kind,
      trackPhase: Math.floor(this.trackPhase) % 2, stars: this.isPlayer ? this.stars : 0,
      shield: this.shield > 0, armor: this.armor, skin: this.isPlayer ? SAVE.equipped.skin : null,
      skinData: this.isPlayer ? this.skinData : null
    });
  }
  // Анимация появления (вращающаяся звезда)
  drawSpawn(ctx, ox, oy) {
    const p = Math.floor(this.spawnTimer / 4) % 4;
    const art = SPAWN_ART[[0, 1, 2, 1][p]];
    const col = p % 2 ? "#f8f8f8" : "#5da0f0";
    drawArt(ctx, ox + this.x, oy + this.y, art, () => col, 2);
    /* Купленная «вспышка на старте»: расходящееся кольцо поверх звезды.
       Товар был в магазине с самого начала, но нигде не проверялся — деньги
       списывались, а на экране ничего не менялось. */
    if (this.isPlayer && SAVE.owned.effect.includes("spawnfx")) {
      const k = 1 - this.spawnTimer / 60, r = 6 + k * 26;
      ctx.strokeStyle = "rgba(240,192,32," + (1 - k).toFixed(2) + ")";
      ctx.lineWidth = 2;
      ctx.strokeRect(ox + this.x + 16 - r, oy + this.y + 16 - r, r * 2, r * 2);
    }
  }
}

/* --- Игрок --- */
class Player extends Tank {
  constructor(g, idx, x, y) {
    super(g, x, y, 0);
    this.isPlayer = true; this.idx = idx;
    this.startX = x; this.startY = y;
    this.lives = g.mode === "survival" ? 1 : 3;
    this.stars = 0; this.spawnTimer = 60; this.shield = 180;
    this.score = 0; this.resetLoadout();
    this.colors = idx === 0 ? TANK_COLORS[SAVE.equipped.color] || TANK_COLORS.yellow : TANK_COLORS.green;
    if (idx === 1) this.colors = TANK_COLORS.green;
    this.skinData = SAVE.equipped.skin === "flag"
      ? (FLAGS.find(f => f.id === SAVE.equipped.flag) || FLAGS[0]).bands
      : (SAVE.equipped.skin === "custom" ? SAVE.equipped.custom : null);
    this.trail = [];
  }
  /* Ходовые характеристики у игрока фиксированные: за монеты можно купить только
     внешний вид. Раньше в магазине продавались скорость, броня, скорость снаряда
     и лишний снаряд — с ними прокачанный танк переставал быть танком из оригинала. */
  resetLoadout() {
    this.baseSpeed = 1.05;
    this.speed = this.baseSpeed;
    this.armorMax = 0; this.armor = 0;
  }
  update(input) {
    if (this.spawnTimer > 0) { this.spawnTimer--; return; }
    if (this.cooldown > 0) this.cooldown--;
    if (this.shield > 0) this.shield--;
    this.moving = false;
    const i = input;
    let d = -1;
    if (i.up) d = 0; else if (i.right) d = 1; else if (i.down) d = 2; else if (i.left) d = 3;
    if (d >= 0) { this.move(d); }
    else this.updateSlide();
    if (i.fire) this.fire();
    // Скорость зависит от «звёзд» прокачки
    this.speed = this.baseSpeed * (1 + this.stars * 0.12);
    this.maxBullets = this.stars >= 2 ? 2 : 1;
    // След от танка (купленный эффект)
    if (this.moving && SAVE.owned.effect.includes("trail") && chance(0.4))
      this.g.particles.push({ x: this.x + 8 + rnd(16), y: this.y + 8 + rnd(16), vx: 0, vy: 0, life: 20, c: "#808080", s: 3 });
  }
  powerUp(type) {
    if (type === "star") { this.stars = Math.min(3, this.stars + 1); Audio_.bonus(); }
    else if (type === "tank") { this.lives++; Audio_.bonus(); }
    else if (type === "shield") { this.shield = 300; Audio_.bonus(); }   // 5 секунд неуязвимости
    else if (type === "shovel") { this.g.fortifyBase(this.baseIndex || 0); Audio_.bonus(); }
    else if (type === "coin") { addCoins(25, "бонус-монета"); }
    SAVE.stats.bonusesTaken[type] = (SAVE.stats.bonusesTaken[type] || 0) + 1;
  }
  respawn() {
    this.x = this.startX; this.y = this.startY; this.dir = 0;
    this.dead = false; this.hp = 1; this.spawnTimer = 60; this.shield = 180;
    this.stars = Math.max(0, this.stars - 1);
    this.armor = this.armorMax; this.bullets = 0;
  }
}

/* --- Враг --- */
const ENEMY_TYPES = {
  // Оригинальные 4 типа врагов Battle City + босс нашего расширения
  basic: { speed: 0.85, hp: 1, score: 100, coins: 10, colors: "e_basic", fireRate: 0.006 },
  fast: { speed: 1.75, hp: 1, score: 200, coins: 25, colors: "e_fast", fireRate: 0.007 },
  power: { speed: 1.0, hp: 1, score: 300, coins: 40, colors: "e_power", fireRate: 0.013, fastBullet: true },
  armor: { speed: 0.85, hp: 4, score: 400, coins: 60, colors: "e_armor", fireRate: 0.010 },
  boss: { speed: 0.7, hp: 5, score: 1000, coins: 50, colors: "e_boss", fireRate: 0.021 }
};
// Броневой танк в оригинале меняет цвет по мере повреждений
/* Точки появления врагов — верхний ряд поля 13x13: клетки 0, 6 и 12 */
const SPAWN_X = { left: 0, center: 6 * 32, right: 12 * 32 };
const ARMOR_COLORS = ["e_armor_1", "e_armor_2", "e_armor_3", "e_armor"];
class Enemy extends Tank {
  constructor(g, x, y, kind, bonus) {
    super(g, x, y, 2);
    const t = ENEMY_TYPES[kind] || ENEMY_TYPES.basic;
    this.kind = kind; this.speed = t.speed * (1 + g.difficulty * 0.15);
    this.hp = t.hp; this.maxHp = t.hp; this.score = t.score; this.coins = t.coins;
    this.colors = TANK_COLORS[t.colors]; this.fireRate = t.fireRate;
    this.bonus = !!bonus;                 // «красный» танк с бонусом
    this.spawnTimer = 60; this.dirTimer = 0; this.stuckFrames = 0;
    this.reloadTime = kind === "boss" ? 26 : 40;
    this.maxBullets = kind === "boss" ? 2 : 1;
    this.frozen = 0;
    /* Роль назначается при появлении и не меняется: большинство идёт ломать
       орла, остальные охотятся на игрока. Если бы все шли к базе, они
       выстраивались бы в одну колонну по кратчайшему маршруту. */
    this.role = chance(CFG.AI_BASE_SHARE) ? "base" : "hunt";
    this.wantDir = -1;                    // направление по маршруту к базе (-1 = идём не по нему)
  }
  update() {
    if (this.spawnTimer > 0) { this.spawnTimer--; return; }
    if (this.cooldown > 0) this.cooldown--;
    if (this.frozen > 0) { this.frozen--; return; }
    this.moving = true;
    if (this.dirTimer-- <= 0) this.chooseDir();
    if (this.move(this.dir)) this.stuckFrames = 0;
    else {
      this.dirTimer = 0;                           // упёрлись — меняем направление
      /* Впереди кирпич — пробиваем, но только если ломимся к базе по маршруту.
         Если стрелять по любой стене, в которую уткнулся (а при случайном
         блуждании это происходит постоянно), враги палят почти без пауз и
         разбирают карту вместе с защитой орла за полминуты. */
      if (this.role === "base" && this.dir === this.wantDir && this.wallAhead()) this.fire();
      // chooseDir мог выдать то же самое направление, и танк тёрся о соседа
      // секундами. После 8 неудачных кадров уходим заведомо в другую сторону.
      if (++this.stuckFrames >= 8) {
        this.stuckFrames = 0;
        this.dir = pick([0, 1, 2, 3].filter(d => d !== this.dir));
        this.dirTimer = 20 + rnd(40);
      }
    }
    // Прицельный выстрел: если игрок или орёл прямо по курсу — стреляем сразу
    if (this.linedUp()) this.fire();
    else if (Math.random() < this.fireRate * (1 + this.g.difficulty * 0.4)) this.fire();
  }
  // Клетка 13x13, в которой сейчас центр танка
  cell() { return [Math.floor((this.x + 16) / 32), Math.floor((this.y + 16) / 32)]; }
  // Впереди стена, а не танк (значит, её имеет смысл прострелить)
  wallAhead() {
    const nx = this.x + DX[this.dir] * 8, ny = this.y + DY[this.dir] * 8;
    return !this.g.field.canMove(nx, ny, this.w, this.h) && !this.g.tankAt(nx, ny, this);
  }
  /* Цель прямо по курсу — стреляем прицельно. Дальность ограничена: со снайпингом
     через всё поле враги расстреливали орла с другого конца карты. */
  linedUp() {
    const vert = this.dir === 0 || this.dir === 2, RANGE = 160;
    const targets = this.g.players.filter(p => !p.dead && p.spawnTimer <= 0).map(p => ({ x: p.x, y: p.y }));
    const b = this.g.field.bases[0];
    if (b && !b.dead) targets.push({ x: b.x * CFG.UNIT - 8, y: b.y * CFG.UNIT - 8 });
    for (const t of targets) {
      if (vert) {
        if (Math.abs(t.x - this.x) > 20) continue;
        const d = t.y - this.y;
        if ((this.dir === 0 ? -d : d) > 0 && Math.abs(d) < RANGE) return true;
      } else {
        if (Math.abs(t.y - this.y) > 20) continue;
        const d = t.x - this.x;
        if ((this.dir === 3 ? -d : d) > 0 && Math.abs(d) < RANGE) return true;
      }
    }
    return false;
  }
  /* Выбор направления. Основной режим — идти по карте путей к орлу: смотрим
     четыре соседние клетки и выбираем ту, из которой до базы ближе. Роль
     «hunt» вместо базы преследует ближайшего игрока (тоже по клеткам, но
     напрямую — игрок движется, маршрут к нему считать смысла нет).
     Немного случайности оставлено, иначе враги идут след в след.             */
  chooseDir() {
    this.dirTimer = 25 + rnd(45);
    // Доля чисто случайных ходов: и чтобы толпа не шла одной колонной, и чтобы
    // у игрока было время добежать до базы. Без неё враги сносили орла за 25 с
    // даже при полном бездействии игрока — партия кончалась, не начавшись.
    if (chance(CFG.AI_RANDOM)) { this.dir = rnd(4); this.wantDir = -1; return; }

    if (this.role === "hunt") {
      const p = this.g.nearestPlayer(this);
      if (p) {
        const dx = p.x - this.x, dy = p.y - this.y;
        const opts = [];
        if (Math.abs(dx) > 8) opts.push(dx > 0 ? 1 : 3);
        if (Math.abs(dy) > 8) opts.push(dy > 0 ? 2 : 0);
        // Идём по длинной оси чаще — так преследование выглядит осмысленным
        if (opts.length) {
          this.dir = Math.abs(dx) > Math.abs(dy) ? opts[0] : opts[opts.length - 1];
          this.wantDir = -1; return;
        }
      }
    }

    this.g.rebuildFlow();
    const [cx, cy] = this.cell();
    let best = [], bestD = this.g.flowAt(cx, cy);
    for (let d = 0; d < 4; d++) {
      const v = this.g.flowAt(cx + DX[d], cy + DY[d]);
      if (v < bestD) { bestD = v; best = [d]; }
      else if (v === bestD && v < 1e9) best.push(d);
    }
    if (best.length) { this.dir = this.wantDir = pick(best); return; }
    this.dir = rnd(4);          // из тупика (всё вокруг сталь/вода) — куда попало
  }
  draw(ctx, ox, oy) {
    if (this.spawnTimer > 0) { this.drawSpawn(ctx, ox, oy); return; }
    // Бонусный танк мигает красным
    let base = this.colors;
    if (this.kind === "armor") base = TANK_COLORS[ARMOR_COLORS[clamp(this.hp - 1, 0, 3)]];
    const c = this.bonus && Math.floor(now() / 120) % 2 ? TANK_COLORS.bonusFlash : base;
    drawTank(ctx, ox + this.x, oy + this.y, this.dir, c,
      { art: this.kind, trackPhase: Math.floor(this.trackPhase) % 2 });
    if (this.kind === "armor") { // броневой: цвет по остатку HP, полоска не нужна
      return;
    }
    if (this.kind === "boss") { // полоска HP
      const w = 28 * (this.hp / this.maxHp);
      ctx.fillStyle = "#400"; ctx.fillRect(ox + this.x + 2, oy + this.y - 5, 28, 3);
      ctx.fillStyle = this.hp > this.maxHp / 2 ? "#40d040" : "#e04040";
      ctx.fillRect(ox + this.x + 2, oy + this.y - 5, w, 3);
    }
  }
}
