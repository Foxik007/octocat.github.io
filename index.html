        right: "+" + c.r + " 🪙", cls: SAVE.challenges.done.includes(c.id) ? "grn" : "",
        act: () => { }
      }));
      items.push({ hdr: "ЕЖЕДНЕВНЫЙ ВХОД" });
      items.push({
        label: SAVE.daily.last === today() ? "БОНУС УЖЕ ПОЛУЧЕН СЕГОДНЯ" : "ПОЛУЧИТЬ БОНУС ЗА ВХОД",
        right: "стрик " + SAVE.daily.streak, act: () => {
          const b = dailyBonus();
          if (b) { toast(`+${b.amount} монет! Стрик ${b.streak} дн.`, "#f0c020"); Audio_.coin(); }
          else toast("Бонус уже получен, приходите завтра");
          this.renderList();
        }
      });
      return { title: "ЕЖЕДНЕВНЫЕ ЧЕЛЛЕНДЖИ", items: items.map(x => Object.assign({ act: () => { } }, x)), sub: today() };
    }
    if (kind === "donate") {
      const items = [{ hdr: "ПАКЕТЫ МОНЕТ" }];
      COIN_PACKS.forEach(p => {
        const total = p.coins + Math.round(p.coins * p.bonus);
        items.push({
          label: fmt(total) + " МОНЕТ" + (p.bonus ? ` (+${Math.round(p.bonus * 100)}% бонус)` : ""),
          right: "$" + p.usd.toFixed(2), cls: "gold", act: () => Pay.buyCoins(p)
        });
      });
      items.push({ hdr: "ПРЕМИУМ-ПОДПИСКИ" });
      PREMIUM.forEach(t => items.push({
        label: t.name + " — " + t.desc, right: "$" + t.usd.toFixed(2) + "/мес",
        cls: isPremium(t.id) ? "grn" : "", tag: isPremium(t.id) ? "АКТИВНА" : "", tagCls: "own",
        act: () => Pay.buyPremium(t)
      }));
      items.push({ hdr: "ПРОЧЕЕ" });
      items.push({ label: "QR-КОД ДЛЯ ОПЛАТЫ С ТЕЛЕФОНА", act: () => Pay.qr() });
      items.push({ label: "СТРАНИЦА ДОНАТА: " + CFG.DONATE_URL, act: () => window.open("donate.html", "_blank") });
      return {
        title: "ДОНАТ / BUY COINS",
        items: items.map(x => Object.assign({ act: () => { } }, x)),
        sub: Pay.isLive() ? '<span class="grn">Платежи включены</span>'
          : '<span class="red">ДЕМО-РЕЖИМ: реальные деньги НЕ списываются</span>'
      };
    }
    if (kind === "settings") {
      const st = SAVE.settings;
      const items = [
        { label: "ЗВУК", right: st.sound ? "ВКЛ" : "ВЫКЛ", act: () => { st.sound = Audio_.toggle(); persist(); this.renderList(); } },
        { label: "ПОГОДА И ВРЕМЯ СУТОК", right: st.weather ? "ВКЛ" : "ВЫКЛ", act: () => { st.weather = !st.weather; persist(); this.renderList(); } },
        { label: "ГОЛОСОВОЕ УПРАВЛЕНИЕ", right: Voice.on ? "ВКЛ" : "ВЫКЛ", act: () => { Voice.toggle(); this.renderList(); } },
        { label: "ПОКАЗЫВАТЬ FPS", right: st.showFPS ? "ВКЛ" : "ВЫКЛ", act: () => { st.showFPS = !st.showFPS; persist(); this.renderList(); } },
        { label: "ИМЯ ИГРОКА: " + SAVE.name, act: () => this.renameProfile() },
        { label: "АВАТАР: #" + (SAVE.avatar + 1) + " (из 8)", act: () => { SAVE.avatar = (SAVE.avatar + 1) % 8; persist(); this.renderList(); } },
        { hdr: "УПРАВЛЕНИЕ" },
        { label: "ИГРОК 1: СТРЕЛКИ + ПРОБЕЛ", cls: "gray" },
        { label: "ИГРОК 2: WASD + ENTER", cls: "gray" },
        { label: "ПАУЗА: P ИЛИ ESC", cls: "gray" },
        { label: "ГЕЙМПАДЫ ПОДДЕРЖИВАЮТСЯ (Gamepad API)", cls: "gray" },
        { hdr: "ДАННЫЕ" },
        { label: "ЭКСПОРТ СОХРАНЕНИЯ В БУФЕР", act: () => this.exportSave() },
        { label: "ИМПОРТ СОХРАНЕНИЯ", act: () => this.importSave() }
      ].map(x => Object.assign({ act: () => { } }, x));
      return { title: "НАСТРОЙКИ", items, sub: "Версия 1.0 — офлайн готов" };
    }
    if (kind === "gameover") {
      const g = this.lastGame;
      const items = [
        { label: "ИТОГОВЫЙ СЧЁТ", right: fmt(g.score), cls: "gold" },
        { label: "УРОВЕНЬ", right: g.levelIndex },
        { label: "УНИЧТОЖЕНО ВРАГОВ", right: g.stats.kills },
        { label: "ЗАРАБОТАНО МОНЕТ", right: "+" + g.coinsEarned + " 🪙", cls: "gold" },
        { hdr: "" },
        { label: "ИГРАТЬ СНОВА", act: () => this.startGame({ mode: g.mode, level: g.mode === "1p" || g.mode === "2p" ? g.levelIndex : 1 }) },
        { label: "В МАГАЗИН", act: () => this.openList("shop") },
        { label: "ГЛАВНОЕ МЕНЮ", act: () => this.show("menu") }
      ].map(x => Object.assign({ act: () => { } }, x));
      return { title: g.victory ? "ПОБЕДА!" : "GAME OVER", items, sub: "" };
    }
    return { title: "?", items: [] };
  },
  showGameOver(g) { this.lastGame = g; this.openList("gameover"); this.sel = 5; this.renderList(); },
  /* --- Действия --- */
  startGame(opts) {
    this.show("game");
    new Game(opts);
    Audio_.init(); Audio_.resume();
  },
  saveProgress() {
    const g = Game.cur; if (!g) return;
    SAVE.progress = { mode: g.mode, level: g.levelIndex, score: g.score, lives: g.players.map(p => p.lives), stars: g.players.map(p => p.stars) };
    persist(); toast("Игра сохранена");
  },
  loadProgress() {
    const p = SAVE.progress;
    if (!p) { toast("Нет сохранённой игры", "#d05050"); return; }
    this.startGame({ mode: p.mode, level: p.level });
    setTimeout(() => {
      const g = Game.cur; if (!g) return;
      g.score = p.score || 0;
      g.players.forEach((pl, i) => { pl.lives = p.lives[i] ?? 3; pl.stars = p.stars[i] ?? 0; });
    }, 50);
  },
  renameProfile() {
    const n = prompt("Имя игрока (до 12 символов):", SAVE.name);
    if (n) { SAVE.name = n.slice(0, 12).toUpperCase(); persist(); this.renderList(); }
  },
  resetProgress() {
    if (!confirm("Удалить ВЕСЬ прогресс, монеты и покупки? Действие необратимо.")) return;
    localStorage.removeItem(KEY); SAVE = loadSave(); toast("Прогресс сброшен"); this.show("menu");
  },
  exportSave() {
    const s = btoa(unescape(encodeURIComponent(JSON.stringify(SAVE))));
    navigator.clipboard?.writeText(s);
    this.modal(`<h3>ЭКСПОРТ СОХРАНЕНИЯ</h3><p class="gray">Код скопирован в буфер обмена:</p>
      <textarea style="width:100%;height:120px;background:#000;color:#0f0;font-size:9px">${s}</textarea>
      <div class="btn" onclick="UI.closeModal()">ОК</div>`);
  },
  importSave() {
    const s = prompt("Вставьте код сохранения:");
    if (!s) return;
    try { SAVE = deepMerge(loadSave(), JSON.parse(decodeURIComponent(escape(atob(s.trim()))))); persist(); toast("Сохранение загружено", "#70B050"); this.renderList(); }
    catch (e) { toast("Некорректный код", "#d05050"); }
  },
  chooseFlag() {
    const list = FLAGS.map((f, i) => `${i + 1}. ${f.name}`).join("\n");
    const n = prompt("Выберите флаг:\n" + list, "1");
    const f = FLAGS[(parseInt(n) || 1) - 1];
    if (f) { SAVE.equipped.flag = f.id; persist(); toast("Флаг: " + f.name, "#70B050"); }
  },
  customSkinEditor() {
    // Простой редактор 6x6: строка из 36 символов (# — пиксель)
    const cur = (SAVE.equipped.custom || SKIN_ART.star).join ? SAVE.equipped.custom.join("") : "";
    const s = prompt("Пиксель-арт 6x6: 36 символов, '#' = пиксель, '.' = пусто", cur || "..##...####.######.####..#..#.......");
    if (s && s.length >= 36) {
      const rows = []; for (let i = 0; i < 6; i++) rows.push(s.slice(i * 6, i * 6 + 6));
      SAVE.equipped.custom = rows; persist(); toast("Свой скин сохранён", "#70B050");
    }
  },
  mpCreate(mode) {
    const code = MP.createRoom(mode);
    this.modal(`<h3>КОМНАТА СОЗДАНА</h3><p>Код комнаты: <span class="gold" style="font-size:18px">${code}</span></p>
      <p class="gray">Передайте код другу — он введёт его в пункте «ПОДКЛЮЧИТЬСЯ ПО КОДУ».</p>
      ${MP.connected ? "" : `<div class="warn">Сервер не подключён (CFG.MP_SERVER пуст).<br>
      TODO: поднять WebSocket-сервер (пример в README) и указать адрес.<br>
      Сейчас доступен офлайн-режим против ИИ.</div>`}
      <div class="btn" onclick="UI.closeModal();UI.startGame({mode:'${mode === "pvp" ? "ctf" : "2p"}',level:1})">НАЧАТЬ ЛОКАЛЬНО</div>
      <div class="btn" style="border-color:#888;color:#888" onclick="UI.closeModal()">ЗАКРЫТЬ</div>`);
  },
  mpJoin() {
    const code = prompt("Введите 4-значный код комнаты:");
    if (!code) return;
    MP.joinRoom(code.trim());
    toast(MP.connected ? "Подключение к " + code : "Нет сервера — офлайн-режим", MP.connected ? "#70B050" : "#d05050");
  },
  mpChat() {
    const msg = prompt("Сообщение в чат:");
    if (msg) { MP.sendChat(msg); toast("Вы: " + msg, "#5da0f0"); }
  },
  tournament() {
    this.modal(`<h3>ТУРНИРНЫЙ РЕЖИМ</h3>
      <p>8 игроков, 5 раундов, побеждает набравший максимум очков.</p>
      <div class="warn">TODO: реализовать турнирную сетку и синхронизацию через сервер.<br>
      Клиентская часть (комнаты, коды, чат) уже готова в объекте MP.</div>
      <div class="btn" onclick="UI.closeModal()">ОК</div>`);
  },
  /* --- Модальные окна --- */
  modal(html) { $("#mbox").innerHTML = html; $("#modal").classList.add("on"); },
  closeModal() { $("#modal").classList.remove("on"); },

  /* --- РЕДАКТОР УРОВНЕЙ --- */
  buildEditor() {
    if (!this.editorData) this.editorData = Array.from({ length: 13 }, () => ".".repeat(13).split(""));
    const grid = $("#edgrid");
    if (!grid.dataset.built) {
      grid.innerHTML = "";
      for (let y = 0; y < 13; y++) for (let x = 0; x < 13; x++) {
        const d = document.createElement("div");
        d.dataset.x = x; d.dataset.y = y;
        const paint = () => { this.editorData[y][x] = this.editorTool; this.paintEditor(); };
        d.addEventListener("mousedown", paint);
        d.addEventListener("mouseenter", e => { if (e.buttons === 1) paint(); });
        grid.appendChild(d);
      }
      grid.dataset.built = "1";
      const tools = [["B", "КИРПИЧ", NES.brickLight], ["T", "СТАЛЬ", NES.steel], ["R", "ВОДА", NES.water],
      ["F", "ЛЕС", NES.forestA], ["S", "ЛЁД", NES.snowB], [".", "ЛАСТИК", "#000"]];
      $("#edpal").innerHTML = tools.map(([c, n, col]) =>
        `<div data-t="${c}" class="${c === this.editorTool ? "on" : ""}"><span class="sw" style="background:${col}"></span>${n}</div>`).join("")
        + `<div style="border:0;color:#666;margin-top:6px">S — СОХРАНИТЬ<br>P — ИГРАТЬ<br>C — ОЧИСТИТЬ<br>E — КОД<br>I — ИМПОРТ</div>`;
      $("#edpal").addEventListener("click", e => {
        const t = e.target.closest("[data-t]"); if (!t) return;
        this.editorTool = t.dataset.t;
        $$("#edpal div").forEach(d => d.classList.toggle("on", d === t));
      });
    }
    this.paintEditor();
  },
  paintEditor() {
    const colors = { "B": NES.brickLight, "T": NES.steel, "R": NES.water, "F": NES.forestA, "S": NES.snowB, ".": "#000" };
    $$("#edgrid div").forEach(d => {
      const x = +d.dataset.x, y = +d.dataset.y;
      d.style.background = (x === 6 && y === 12) ? "#886600" : colors[this.editorData[y][x]];
    });
  },
  // Карта редактора -> формат оригинала: 13 строк по 26 символов (тип + hex-маска четвертей)
  editorRows() {
    return this.editorData.map((row, y) => row.map((ch, x) => {
      if (x === 6 && y === 12) return "Ef";        // орёл всегда в центре внизу
      return ch === "." ? ".." : ch + "f";
    }).join(""));
  },
  editorSave() {
    const name = prompt("Название уровня:", "МОЙ УРОВЕНЬ " + (SAVE.customLevels.length + 1));
    if (!name) return;
    SAVE.customLevels.push({ name: name.toUpperCase(), rows: this.editorRows(), date: today() });
    SAVE.stats.editorPublished = (SAVE.stats.editorPublished || 0) + 1;
    persist(); Ach.check(); toast("Уровень сохранён: " + name, "#70B050");
  },
  editorCode() {
    const code = btoa(this.editorRows().join(""));
    navigator.clipboard?.writeText(code);
    this.modal(`<h3>КОД УРОВНЯ</h3><p class="gray">Скопирован в буфер — поделитесь с друзьями:</p>
      <textarea style="width:100%;height:80px;background:#000;color:#0f0;font-size:9px">${code}</textarea>
      <div class="btn" onclick="UI.closeModal()">ОК</div>`);
  },
  editorImport() {
    const code = prompt("Вставьте код уровня:");
    if (!code) return;
    try {
      const s = atob(code.trim());
      if (s.length < 338) throw 0;
      this.editorData = [];
      for (let i = 0; i < 13; i++) {
        const line = s.slice(i * 26, i * 26 + 26), row = [];
        for (let x = 0; x < 13; x++) { const t = line[x * 2]; row.push(t === "." || t === "E" ? "." : t); }
        this.editorData.push(row);
      }
      this.paintEditor(); toast("Уровень загружен", "#70B050");
    } catch (e) { toast("Некорректный код", "#d05050"); }
  },

  /* --- Обработка клавиш во всех экранах --- */
  onKey(e) {
    const k = e.code;
    // Модальное окно
    if ($("#modal").classList.contains("on")) { if (k === "Escape" || k === "Enter") this.closeModal(); return; }
    if (this.screen === "game") {
      const g = Game.cur;
      if (!g) { if (k === "Escape") this.back(); return; }
      if (k === "KeyP") g.togglePause();
      if (k === "Escape") { if (g.state === "pause") { this.saveProgress(); this.back(); } else g.togglePause(); }
      if (k === "F2") this.saveProgress();
      return;
    }
    if (this.screen === "editor") {
      if (k === "Escape") this.show("menu");
      if (k === "KeyS") this.editorSave();
      if (k === "KeyP") this.startGame({ mode: "custom", level: 1, rows: this.editorRows() });
      if (k === "KeyC") { this.editorData = Array.from({ length: 13 }, () => ".".repeat(13).split("")); this.paintEditor(); }
      if (k === "KeyE") this.editorCode();
      if (k === "KeyI") this.editorImport();
      return;
    }
    const items = this.screen === "menu" ? this.menuItems : (this.list ? this.list.items : []);
    const nav = d => {
      let i = this.sel;
      for (let n = 0; n < items.length; n++) {
        i = (i + d + items.length) % items.length;
        if (!items[i].hdr) break;
      }
      this.sel = i;
      Audio_.tone(440, 0.03, "square", 0.15);
      this.screen === "menu" ? this.buildMenu() : this.renderList();
    };
    if (k === "ArrowDown") nav(1);
    else if (k === "ArrowUp") nav(-1);
    else if (k === "ArrowLeft") { const it = items[this.sel]; if (it && it.left) it.left(); }
    else if (k === "ArrowRight") { const it = items[this.sel]; if (it && it.rightK) it.rightK(); }
    else if (k === "Enter" || k === "Space") {
      const it = items[this.sel];
      if (it && it.act) { Audio_.tone(880, 0.05, "square", 0.2); it.act(); }
    }
    else if (k === "Tab" && this.screen === "list" && this.list.tabs) {
      this.tab = (this.tab + (e.shiftKey ? -1 : 1) + this.list.tabs.length) % this.list.tabs.length;
      this.sel = 0; this.renderList();
    }
    else if (k === "Escape") { this.screen === "list" ? this.show("menu") : null; }
  }
};

/* ============================== 19. ГЛАВНЫЙ ЦИКЛ (60 FPS) ============================== */
const Loop = {
  ctx: null, last: 0, acc: 0, step: 1000 / CFG.FPS, fps: 60, frames: 0, fpsTime: 0,
  start() {
    this.ctx = $("#game").getContext("2d", { alpha: false });
    this.ctx.imageSmoothingEnabled = false;
    this.last = performance.now();
    requestAnimationFrame(t => this.tick(t));
  },
  tick(t) {
    requestAnimationFrame(t2 => this.tick(t2));
    let dt = t - this.last; this.last = t;
    if (dt > 250) dt = 250;                 // защита от «прыжка» после сворачивания вкладки
    this.acc += dt;
    let steps = 0;
    while (this.acc >= this.step && steps < 5) {
      if (Game.cur) Game.cur.update();
      this.acc -= this.step; steps++;
    }
    // Счётчик FPS
    this.frames++; this.fpsTime += dt;
    if (this.fpsTime >= 1000) { this.fps = this.frames; this.frames = 0; this.fpsTime = 0; }
    // Отрисовка
    const ctx = this.ctx;
    if (Game.cur) Game.cur.draw(ctx);
    else { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, CFG.CW, CFG.CH); }
  }
};

/* ============================== 20. ЗАПУСК ============================== */
const isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
function fitStage() {
  const s = Math.max(1, Math.min(window.innerWidth / CFG.CW, window.innerHeight / CFG.CH));
  const scale = window.innerWidth < 700 ? s : Math.max(1, Math.floor(s * 2) / 2);   // на десктопе — кратный масштаб
  $("#stage").style.transform = `translate(-50%,-50%) scale(${scale})`;
}
window.addEventListener("resize", fitStage);
window.addEventListener("orientationchange", () => setTimeout(fitStage, 200));

function boot() {
  fitStage();
  buildPatterns();   // предрендер текстур местности
  Input.init();
  Audio_.enabled = SAVE.settings.sound !== false;
  Loop.start();
  UI.show("menu");
  // Ежедневный бонус за вход
  const b = dailyBonus();
  if (b) setTimeout(() => toast(`ЕЖЕДНЕВНЫЙ БОНУС +${b.amount} 🪙 (стрик ${b.streak} дн.)`, "#f0c020"), 700);
  Ach.check();
  // Онлайн — не блокирует запуск; при отсутствии сети остаёмся офлайн
  Online.init().catch(() => { });
  // Автосохранение прогресса каждые 30 секунд
  setInterval(() => { if (Game.cur && Game.cur.state === "play") UI.saveProgress && SAVE.progress !== undefined && (SAVE.progress = { mode: Game.cur.mode, level: Game.cur.levelIndex, score: Game.cur.score, lives: Game.cur.players.map(p => p.lives), stars: Game.cur.players.map(p => p.stars) }, persist()); }, 30000);
  // Предупреждение о потере данных при закрытии во время игры
  window.addEventListener("beforeunload", () => { if (Game.cur) UI.saveProgress(); });
  console.log("%cBATTLE CITY 1990 — расширенная версия загружена", "color:#C09848;font-weight:bold");
  console.log("Онлайн: " + Online.mode + " | Платежи: " + (Pay.isLive() ? "live" : "демо"));
}
document.addEventListener("DOMContentLoaded", boot);
</script>
