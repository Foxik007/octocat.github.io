/* --- Взрыв (6 фаз) --- */
class Explosion {
  constructor(x, y, big, colorful) {
    this.x = x; this.y = y; this.big = big; this.frame = 0; this.dead = false;
    this.frames = big ? BOOM_BIG : BOOM_SMALL;
    this.scales = big ? BOOM_BIG_S : BOOM_SMALL_S;
    this.tint = colorful ? pick(["#ff40ff", "#40ffff", "#ffff40", "#40ff40", "#ff8040"]) : null;
  }
  update() { this.frame += 0.25; if (this.frame >= this.frames.length) this.dead = true; }
  draw(ctx, ox, oy) {
    const f = clamp(Math.floor(this.frame), 0, this.frames.length - 1);
    const art = BOOM_ART[this.frames[f]], s = this.scales[f];
    // Кадр всегда 16 «пикселей», поэтому при масштабе 4 он вылезает за клетку —
    // центрируем его на танке, а не на левом верхнем углу.
    const off = (16 * s - 32) / 2;
    const pal = { W: "#f8f8f8", L: this.tint || "#f0c020", M: this.tint || "#e05010" };
    drawArt(ctx, ox + this.x - off, oy + this.y - off, art, ch => pal[ch], s);
  }
}

/* ============================== 11. УПРАВЛЕНИЕ (клавиатура / геймпад / сенсор / голос) ============================== */
const Input = {
  keys: {},
  p1: { up: 0, down: 0, left: 0, right: 0, fire: 0 },
  p2: { up: 0, down: 0, left: 0, right: 0, fire: 0 },
  touch: { up: 0, down: 0, left: 0, right: 0, fire: 0, active: false },
  voice: { dir: -1, fire: false, until: 0 },
  init() {
    window.addEventListener("keydown", e => {
      this.keys[e.code] = 1;
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", "Enter", "Tab"].includes(e.code)) e.preventDefault();
      Audio_.init(); Audio_.resume();
      UI.onKey(e);
    });
    window.addEventListener("keyup", e => { this.keys[e.code] = 0; });
    window.addEventListener("blur", () => { this.keys = {}; });
    this.initTouch();
  },
  poll() {
    const k = this.keys;
    // Игрок 1: стрелки + Пробел
    this.p1.up = k["ArrowUp"] || 0; this.p1.down = k["ArrowDown"] || 0;
    this.p1.left = k["ArrowLeft"] || 0; this.p1.right = k["ArrowRight"] || 0;
    this.p1.fire = k["Space"] || 0;
    // Игрок 2: WASD + Enter
    this.p2.up = k["KeyW"] || 0; this.p2.down = k["KeyS"] || 0;
    this.p2.left = k["KeyA"] || 0; this.p2.right = k["KeyD"] || 0;
    this.p2.fire = k["Enter"] || 0;
    // Сенсор и голос подмешиваются к игроку 1
    if (this.touch.active) {
      this.p1.up |= this.touch.up; this.p1.down |= this.touch.down;
      this.p1.left |= this.touch.left; this.p1.right |= this.touch.right; this.p1.fire |= this.touch.fire;
    }
    if (this.voice.until > now()) {
      if (this.voice.dir === 0) this.p1.up = 1; if (this.voice.dir === 1) this.p1.right = 1;
      if (this.voice.dir === 2) this.p1.down = 1; if (this.voice.dir === 3) this.p1.left = 1;
      if (this.voice.fire) { this.p1.fire = 1; this.voice.fire = false; }
    }
    this.pollGamepad();
  },
  // Gamepad API
  pollGamepad() {
    if (!navigator.getGamepads) return;
    const pads = navigator.getGamepads();
    for (let i = 0; i < Math.min(2, pads.length); i++) {
      const gp = pads[i]; if (!gp) continue;
      const t = i === 0 ? this.p1 : this.p2;
      const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
      if (ay < -0.4 || gp.buttons[12]?.pressed) t.up = 1;
      if (ay > 0.4 || gp.buttons[13]?.pressed) t.down = 1;
      if (ax < -0.4 || gp.buttons[14]?.pressed) t.left = 1;
      if (ax > 0.4 || gp.buttons[15]?.pressed) t.right = 1;
      if (gp.buttons[0]?.pressed || gp.buttons[2]?.pressed || gp.buttons[7]?.pressed) t.fire = 1;
      if (gp.buttons[9]?.pressed && Game.cur) Game.cur.togglePause();
    }
  },
  // Джойстик на экране. Размеры теперь зависят от экрана, поэтому центр и вылет
  // ручки вычисляем по реальным размерам элемента, а не по жёстким 40 px.
  initTouch() {
    const base = $("#stickBase"), knob = $("#stickKnob"), fire = $("#btnFire"), pause = $("#btnPause");
    let id = null, cx = 0, cy = 0, R = 60;
    const centerKnob = () => { knob.style.left = "30%"; knob.style.top = "30%"; };
    const set = (dx, dy) => {
      const d = Math.hypot(dx, dy);
      this.touch.up = this.touch.down = this.touch.left = this.touch.right = 0;
      if (d > R * 0.22) {                       // мёртвая зона в четверть радиуса
        if (Math.abs(dx) > Math.abs(dy)) this.touch[dx > 0 ? "right" : "left"] = 1;
        else this.touch[dy > 0 ? "down" : "up"] = 1;
      }
      const m = Math.min(R * 0.55, d), a = Math.atan2(dy, dx);
      const kw = knob.offsetWidth || R * 0.8;
      knob.style.left = (R - kw / 2 + Math.cos(a) * m) + "px";
      knob.style.top = (R - kw / 2 + Math.sin(a) * m) + "px";
    };
    const grab = t => {
      const r = base.getBoundingClientRect();
      cx = r.left + r.width / 2; cy = r.top + r.height / 2; R = r.width / 2;
      this.touch.active = true; set(t.clientX - cx, t.clientY - cy);
    };
    base.addEventListener("touchstart", e => {
      e.preventDefault(); const t = e.changedTouches[0]; id = t.identifier; grab(t);
      Audio_.init(); Audio_.resume();
    }, { passive: false });
    base.addEventListener("touchmove", e => {
      e.preventDefault();
      for (const t of e.changedTouches) if (t.identifier === id) set(t.clientX - cx, t.clientY - cy);
    }, { passive: false });
    const end = e => {
      for (const t of e.changedTouches) if (t.identifier === id) {
        id = null; this.touch.up = this.touch.down = this.touch.left = this.touch.right = 0;
        centerKnob();
      }
    };
    base.addEventListener("touchend", end); base.addEventListener("touchcancel", end);
    const fdown = e => { e.preventDefault(); this.touch.active = true; this.touch.fire = 1; Audio_.init(); Audio_.resume(); };
    const fup = e => { e.preventDefault(); this.touch.fire = 0; };
    fire.addEventListener("touchstart", fdown, { passive: false });
    fire.addEventListener("touchend", fup); fire.addEventListener("touchcancel", fup);
    fire.addEventListener("mousedown", fdown); fire.addEventListener("mouseup", fup);
    pause.addEventListener("click", e => {
      e.preventDefault();
      if (Game.cur) Game.cur.togglePause();
      else if (UI.screen !== "menu") UI.show("menu");
    });
    centerKnob();
  }
};

/* --- Голосовое управление (Web Speech API) --- */
const Voice = {
  rec: null, on: false,
  toggle() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { toast("Голосовое управление не поддерживается браузером", "#d05050"); return false; }
    if (this.on) { try { this.rec.stop(); } catch (e) { } this.on = false; toast("Голос выключен"); return false; }
    this.rec = new SR(); this.rec.lang = "ru-RU"; this.rec.continuous = true; this.rec.interimResults = true;
    this.rec.onresult = e => {
      const txt = e.results[e.results.length - 1][0].transcript.toLowerCase().trim();
      const v = Input.voice; v.until = now() + 900;
      if (/вперёд|вперед|верх|вверх/.test(txt)) v.dir = 0;
      else if (/назад|вниз/.test(txt)) v.dir = 2;
      else if (/влево|лево/.test(txt)) v.dir = 3;
      else if (/вправо|право/.test(txt)) v.dir = 1;
      else if (/стой|стоп/.test(txt)) { v.dir = -1; v.until = 0; }
      if (/стреляй|огонь|пли/.test(txt)) v.fire = true;
    };
    this.rec.onerror = () => { };
    this.rec.onend = () => { if (this.on) try { this.rec.start(); } catch (e) { } };
    try { this.rec.start(); this.on = true; toast("Голос включён: «вперёд», «назад», «стреляй»", "#70B050"); }
    catch (e) { toast("Не удалось запустить микрофон", "#d05050"); }
    return this.on;
  }
};

/* ============================== 13. ЯДРО ИГРЫ ============================== */
class Game {
  static cur = null;
  constructor(opts) {
    this.mode = opts.mode || "1p";            // 1p | 2p | endless | survival | ctf | boss | custom
    this.levelIndex = opts.level || 1;
    this.customRows = opts.rows || null;      // карта из редактора
    this.twoPlayers = (this.mode === "2p" || this.mode === "ctf" || this.mode === "pvp" || opts.two);
    this.pvp = (this.mode === "pvp");        // дуэль: у каждого своя база, огонь по своим включён
    this.field = new Field();
    this.players = []; this.enemies = []; this.bullets = [];
    this.explosions = []; this.powerups = []; this.particles = [];
    this.state = "intro"; this.timer = 0; this.frame = 0;
    this.score = 0; this.wave = 1; this.difficulty = 0;
    this.startTime = now(); this.levelStartTime = now();
    this.coinsEarned = 0; this.lostLifeThisLevel = false;
    this.stats = { kills: 0, blocks: 0, byType: { basic: 0, fast: 0, power: 0, boss: 0 } };
    this.paused = false;
    this.flags = null;
    this.net = opts.net || null;             // {role:"host"|"guest"} — сетевая партия
    this.winner = 0;
    this.shovelTimer = 0;
    this.startLevel(this.levelIndex);
    SAVE.stats.games++; persist();
    Log.info("партия: режим " + this.mode + ", уровень " + this.levelIndex);
    Game.cur = this;
  }
  /* --- Инициализация уровня --- */
  startLevel(n) {
    this.levelIndex = n;
    const rows = this.customRows || LEVELS[(n - 1) % LEVELS.length];
    this.field.recording = !!(this.net && this.net.role === "host");
    this.field.load(rows, { twoBases: this.pvp });
    this.difficulty = Math.min(2, (n - 1) / 20 + (this.wave - 1) * 0.2);
    // Игроки
    const keepLives = this.players.map(p => p.lives), keepScore = this.players.map(p => p.score);
    this.players = [new Player(this, 0, 128, 384)];
    if (this.twoPlayers) this.players.push(new Player(this, 1, 256, this.pvp ? 0 : 384));
    if (this.pvp) { const p2 = this.players[1]; p2.dir = 2; p2.baseIndex = 1; p2.lives = 3; }
    if (this.players[0]) this.players[0].baseIndex = 0;
    this.players.forEach((p, i) => {
      if (keepLives[i] !== undefined) { p.lives = keepLives[i]; p.score = keepScore[i]; }
    });
    // Очередь врагов (в дуэли PvP их нет — только два игрока)
    this.enemyQueue = this.pvp ? [] : this.buildQueue(n);
    this.enemiesLeft = this.enemyQueue.length;
    this.enemies = []; this.bullets = []; this.powerups = []; this.explosions = []; this.particles = [];
    this.spawnPoint = 0; this.spawnTimer = 60;
    // Первый уровень партии открывается стартовой темой оригинала (4.3 с)
    const firstStage = !this.startedOnce;
    this.startedOnce = true;
    this.state = "intro"; this.timer = firstStage ? 285 : 130;
    this.levelStartTime = now(); this.lostLifeThisLevel = false;
    this.shovelTimer = 0;
    // Режим «Захват флага»
    if (this.mode === "ctf") {
      this.flags = [
        { x: 32, y: 32, owner: 1, taken: null, home: { x: 32, y: 32 } },     // флаг игрока 2 (слева сверху)
        { x: 352, y: 32, owner: 0, taken: null, home: { x: 352, y: 32 } }   // флаг игрока 1 (справа сверху)
      ];
      this.ctfScore = [0, 0];
    }
    firstStage ? Audio_.stageStart() : Audio_.start();
  }
  // Состав волны врагов — из оригинальной игры (20 танков на уровень)
  buildQueue(n) {
    const q = [];
    const spec = ORIGINAL_BOTS[(n - 1) % ORIGINAL_BOTS.length] || ["18*basic", "2*fast"];
    // Распаковываем группы вида "18*basic" и равномерно перемешиваем типы по волне
    const groups = spec.map(s => { const [c, k] = s.split("*"); return { kind: k, left: +c }; });
    const total = groups.reduce((a, g) => a + g.left, 0);
    for (let i = 0; i < total; i++) {
      // берём тип, у которого «долг» по расписанию наибольший
      let best = null, bestScore = -1;
      for (const g of groups) {
        if (!g.left) continue;
        const sc = g.left / (total - i);
        if (sc > bestScore) { bestScore = sc; best = g; }
      }
      best.left--;
      // Оригинал ронял бонус с 4-го, 11-го и 18-го танка — три штуки на 20 врагов,
      // и то часть их падала в воду. Делаем каждый четвёртый: пять за уровень.
      q.push({ kind: best.kind, bonus: (i + 1) % 4 === 0 });
    }
    // В бесконечном режиме и на поздних волнах усиливаем состав
    if (this.mode === "endless" || this.mode === "survival") {
      for (let i = 0; i < q.length; i++)
        if (chance(Math.min(0.5, this.wave * 0.06)) && q[i].kind === "basic") q[i].kind = pick(["fast", "power", "armor"]);
    }
    if (n % 5 === 0 || this.mode === "boss") q.push({ kind: "boss", bonus: true });
    if (this.mode === "ctf") return q.slice(0, 6);
    return q;
  }
  /* --- Вспомогательные --- */
  /* Занята ли клетка чужим корпусом.
     ВАЖНО: танк в анимации появления тоже считается препятствием. Раньше он
     пропускался, поэтому сосед спокойно въезжал в него, а через секунду оба
     оказывались в одной точке и намертво блокировали друг друга. */
  tankAt(x, y, self) {
    const r = { x: x + 2, y: y + 2, w: 28, h: 28 };
    for (const t of this.allTanks()) {
      if (t === self || t.dead) continue;
      if (hit(r, { x: t.x + 2, y: t.y + 2, w: 28, h: 28 })) return t;
    }
    return null;
  }
  // Сдвиг танка на dx,dy, если там нет стены и это внутри поля
  nudgeTank(t, dx, dy) {
    const nx = clamp(t.x + dx, 0, CFG.FIELD - t.w), ny = clamp(t.y + dy, 0, CFG.FIELD - t.h);
    if (nx === t.x && ny === t.y) return false;
    if (!this.field.canMove(nx, ny, t.w, t.h)) return false;
    t.x = nx; t.y = ny;
    return true;
  }
  /* Расталкивание слипшихся танков.
     Два пересекающихся корпуса взаимно блокируют tryMove со всех четырёх сторон —
     танки залипают друг в друге до конца уровня. Пересечение всё же случается:
     появление на занятой точке, инерция на льду, приём сетевого снимка, respawn
     игрока под вражеским танком. Раз в кадр разводим такие пары на 1 px по оси
     наименьшего перекрытия — за полсекунды они расходятся, рывка не видно. */
  unstickTanks() {
    const list = this.allTanks().filter(t => !t.dead);
    for (let i = 0; i < list.length; i++) {
      for (let j = i + 1; j < list.length; j++) {
        const a = list[i], b = list[j];
        const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
        const oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
        if (ox <= 4 || oy <= 4) continue;          // те же 2 px зазора, что и в tankAt
        // По какой оси выбираться ближе, ту и берём; вторая ось — запасной вариант
        const axes = ox <= oy ? [[1, 0], [0, 1]] : [[0, 1], [1, 0]];
        for (const [kx, ky] of axes) {
          const s = kx ? (a.x <= b.x ? -1 : 1) : (a.y <= b.y ? -1 : 1);
          const ma = this.nudgeTank(a, kx * s, ky * s);
          const mb = this.nudgeTank(b, -kx * s, -ky * s);
          // Один упёрся в стену — второго отводим на двойной шаг, иначе не разойдутся
          if (ma !== mb) this.nudgeTank(ma ? a : b, kx * s * (ma ? 1 : -1), ky * s * (ma ? 1 : -1));
          if (ma || mb) break;                     // разошлись — вторая ось не нужна
        }
      }
    }
  }
  allTanks() { return this.players.concat(this.enemies); }
  alivePlayers() { return this.players.filter(p => !p.dead && p.spawnTimer <= 0); }
  nearestPlayer(from) {
    let best = null, bd = 1e9;
    for (const p of this.players) {
      if (p.dead) continue;
      const d = Math.hypot(p.x - from.x, p.y - from.y);
      if (d < bd) { bd = d; best = p; }
    }
    return best;
  }
  baseTarget() { return { x: this.field.baseX * CFG.UNIT, y: this.field.baseY * CFG.UNIT }; }
  /* --- Карта путей до базы -------------------------------------------------
     Раньше враг выбирал направление «на глаз»: сравнивал свои координаты с
     координатами цели и шёл по одной из двух осей. На карте со стенами это
     упирается в первую же преграду — танк тыкался в неё и уходил случайно
     бродить, до базы доходил только тот, кому повезло с коридором.
     Теперь по сетке 13x13 считается расстояние до орла (алгоритм Дейкстры):
     свободная клетка стоит 1, кирпичная — 8 (её надо прострелить, это долго),
     сталь и вода непроходимы. Враг просто идёт в соседнюю клетку с меньшим
     расстоянием, то есть по кратчайшему маршруту, и сам сворачивает в обход.
     Пересчёт — не чаще раза в 20 кадров и только если карта изменилась.      */
  rebuildFlow(force) {
    const N = 13, INF = 1e9;
    if (!force && this.flow && this.flowRev === this.field.rev) return;
    if (!force && this.flowWait > 0) { this.flowWait--; return; }
    this.flowRev = this.field.rev; this.flowWait = 20;
    const cost = new Int32Array(N * N);
    for (let cy = 0; cy < N; cy++) for (let cx = 0; cx < N; cx++) {
      let brick = false, solid = false;
      for (let uy = cy * 4; uy < cy * 4 + 4 && !solid; uy++)
        for (let ux = cx * 4; ux < cx * 4 + 4; ux++) {
          const t = this.field.at(ux, uy);
          if (t === T.STEEL || t === T.WATER) { solid = true; break; }
          if (t === T.BRICK) brick = true;
        }
      cost[cy * N + cx] = solid ? -1 : (brick ? 8 : 1);
    }
    const dist = new Float64Array(N * N).fill(INF);
    const done = new Uint8Array(N * N);
    const b = this.field.bases[0];
    const start = Math.floor(b.y / 4) * N + Math.floor(b.x / 4);
    dist[start] = 0; cost[start] = 1;                 // клетка орла — цель, а не стена
    for (let it = 0; it < N * N; it++) {
      let u = -1, best = INF;
      for (let i = 0; i < N * N; i++) if (!done[i] && dist[i] < best) { best = dist[i]; u = i; }
      if (u < 0) break;
      done[u] = 1;
      const ux = u % N, uy = (u / N) | 0;
      for (const [dx, dy] of [[0, -1], [1, 0], [0, 1], [-1, 0]]) {
        const nx = ux + dx, ny = uy + dy;
        if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
        const v = ny * N + nx;
        if (done[v] || cost[v] < 0) continue;
        const nd = dist[u] + cost[v];
        if (nd < dist[v]) dist[v] = nd;
      }
    }
    this.flow = dist;
  }
  // Расстояние клетки до базы (INF, если хода нет)
  flowAt(cx, cy) {
    if (!this.flow || cx < 0 || cy < 0 || cx > 12 || cy > 12) return 1e9;
    return this.flow[cy * 13 + cx];
  }
  addExplosion(x, y, size) {
    this.explosions.push(new Explosion(x, y, size === "big", SAVE.owned.effect.includes("boom")));
    Audio_.explode(size === "big");
    if (this.net && this.net.role === "host") MP.explOut.push([x | 0, y | 0, size === "big" ? 1 : 0]);
  }
  fortifyBase(idx) { this.field.fortify(T.STEEL, idx || 0); this.shovelTimer = 20 * 60; this.shovelBase = idx || 0; }
  baseDestroyed(idx, by) {
    idx = idx || 0;
    Log.warn("база разрушена (уровень " + this.levelIndex + ", волна " + this.wave + ")");
    const b = this.field.bases[idx];
    if (!b || b.dead) return;
    this.field.destroyBase(idx);
    this.addExplosion(b.x * CFG.UNIT, b.y * CFG.UNIT, "big");
    if (this.pvp) {
      // Пала база одного из игроков — победил другой
      this.winner = idx === 0 ? 1 : 0;
      this.gameOver(true);
    } else this.gameOver(false);
  }
  togglePause() {
    if (this.state !== "play" && this.state !== "pause") return;
    this.paused = !this.paused;
    this.state = this.paused ? "pause" : "play";
    Audio_.engine(false);
    if (this.paused) Audio_.pauseSfx();
  }
  // Какой источник ввода у игрока с индексом i
  inputFor(i) {
    if (this.net) return (i === 0) ? Input.p1 : MP.remoteInput;   // хост: свой ввод + ввод гостя
    return i === 0 ? Input.p1 : Input.p2;                          // локальная игра
  }
  /* --- Апдейт гостя: своя симуляция не считается, мир берётся из снимков хоста.
     Локально предсказывается только движение собственного танка, иначе управление
     ощущалось бы с задержкой пинга. --- */
  updateGuest() {
    Input.poll();
    MP.sendInput(Input.p1);
    while (MP.snapQ.length) applySnapshot(this, MP.snapQ.shift());
    const me = this.players[MP.index];
    if (me && !me.dead && me.lives >= 0 && this.state === "play" && me.spawnTimer <= 0) {
      // Предсказываем только перемещение: выстрелы создаёт хост
      me.update({ up: Input.p1.up, down: Input.p1.down, left: Input.p1.left, right: Input.p1.right, fire: 0 });
    }
    // Плавное подтягивание к серверным координатам
    const lerp = (t, k) => {
      if (t.netX === undefined) return;
      t.x += (t.netX - t.x) * k; t.y += (t.netY - t.y) * k;
      if (Math.abs(t.netX - t.x) < 0.4) t.x = t.netX;
      if (Math.abs(t.netY - t.y) < 0.4) t.y = t.netY;
    };
    this.players.forEach((p, i) => lerp(p, i === MP.index ? 0.12 : 0.4));
    this.enemies.forEach(e => lerp(e, 0.4));
    // Визуальная часть живёт своей жизнью
    this.explosions.forEach(e => e.update());
    this.explosions = this.explosions.filter(e => !e.dead);
    this.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
    this.particles = this.particles.filter(p => p.life > 0);
    this.powerups.forEach(p => p.update());
    Audio_.engine(Audio_.enabled && this.state === "play", !!(me && me.moving));
    if (this.state === "intro" && this.timer > 0) this.timer--;
  }
  /* --- Главный апдейт --- */
  update() {
    this.frame++;
    if (this.net && this.net.role === "guest") return this.updateGuest();
    // Хост рассылает снимок мира 20 раз в секунду — во ВСЕХ состояниях, включая
    // заставку, паузу и конец партии, иначе гость не увидит финал.
    if (this.net && this.net.role === "host" && this.frame % 3 === 0 && MP.connected) MP.send(buildSnapshot(this));
    if (this.state === "intro") { if (--this.timer <= 0) this.state = "play"; return; }
    if (this.state === "pause") return;
    if (this.state === "clear" || this.state === "over") { this.timer--; return; }
    Input.poll();
    // Игроки. В сетевой партии второй танк ведёт удалённый игрок.
    this.players.forEach((p, i) => {
      if (p.dead || p.lives < 0) return;
      p.update(this.inputFor(i));
    });
    // Мотор гудит постоянно во время боя и меняет тон при движении (как в оригинале)
    const anyMoving = this.players.some(p => !p.dead && p.lives >= 0 && p.moving);
    Audio_.engine(Audio_.enabled && this.state === "play", anyMoving);
    // Враги
    for (const e of this.enemies) if (!e.dead) e.update();
    // Пули
    for (const b of this.bullets) if (!b.dead) b.update(this);
    this.resolveBullets();
    // Бонусы
    for (const pu of this.powerups) {
      pu.update();
      for (const p of this.players) {
        if (p.dead || p.spawnTimer > 0 || pu.dead) continue;
        if (hit(pu, p.rect())) { p.powerUp(pu.type); pu.dead = true; this.score += 500; }
      }
    }
    this.unstickTanks();
    // Прочее
    this.explosions.forEach(e => e.update());
    this.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
    if (this.shovelTimer > 0 && --this.shovelTimer === 0) {
      const bi = this.shovelBase || 0;
      if (this.field.bases[bi] && !this.field.bases[bi].dead) this.field.fortify(T.BRICK, bi);
    }
    if (this.mode === "ctf") this.updateCTF();
    // Уборка мёртвых
    this.bullets = this.bullets.filter(b => !b.dead);
    this.explosions = this.explosions.filter(e => !e.dead);
    this.powerups = this.powerups.filter(p => !p.dead);
    this.particles = this.particles.filter(p => p.life > 0);
    this.enemies = this.enemies.filter(e => !e.dead);
    // Спавн врагов
    this.spawnEnemies();
    // Условие завершения уровня
    if (this.mode !== "ctf" && !this.pvp && this.enemyQueue.length === 0 && this.enemies.length === 0 && this.state === "play")
      this.levelComplete();
    // Проверка жизней игроков
    if (this.state === "play") {
      if (this.pvp) {
        const dead = this.players.findIndex(p => p.lives < 0);
        if (dead >= 0) { this.winner = dead === 0 ? 1 : 0; this.gameOver(true); }
      } else if (this.players.every(p => p.lives < 0)) this.gameOver(false);
    }
  }
  /* Столкновения пуль с танками и другими пулями */
  resolveBullets() {
    for (const b of this.bullets) {
      if (b.dead) continue;
      // Пуля против пули
      for (const b2 of this.bullets) {
        if (b2 === b || b2.dead || b2.owner.isPlayer === b.owner.isPlayer) continue;
        if (hit(b, b2)) { b.dead = b2.dead = true; b.owner.bullets--; b2.owner.bullets--; break; }
      }
      if (b.dead) continue;
      for (const t of this.allTanks()) {
        if (t === b.owner || t.dead || t.spawnTimer > 0) continue;
        // В кооперативе игроки не могут убить друг друга; в PvP и CTF — могут
        if (t.isPlayer === b.owner.isPlayer && this.mode !== "ctf" && !this.pvp) continue;
        if (t.isPlayer === b.owner.isPlayer && t === b.owner) continue;
        if (!hit(b, { x: t.x + 2, y: t.y + 2, w: 28, h: 28 })) continue;
        b.dead = true; b.owner.bullets--;
        const killed = t.takeDamage(1, b.owner);
        if (b.style === "firework") this.fireworkBurst(b.x, b.y);
        if (killed) {
          if (t.isPlayer) this.playerKilled(t);
          else this.enemyKilled(t, b.owner);
        } else this.addExplosion(t.x, t.y, "small");
        break;
      }
    }
    // Синхронизация счётчика пуль (страховка)
    for (const t of this.allTanks()) {
      const c = this.bullets.filter(b => b.owner === t && !b.dead).length;
      t.bullets = c;
    }
  }
  fireworkBurst(x, y) {
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 3;
      this.particles.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 20 + rnd(15),
        c: pick(["#ff40ff", "#40ffff", "#ffff40", "#ff8040", "#80ff80"]), s: 3
      });
    }
  }
  enemyKilled(e, killer) {
    this.addExplosion(e.x, e.y, e.kind === "boss" ? "big" : "normal");
    this.score += e.score;
    if (killer && killer.isPlayer) killer.score += e.score;
    this.stats.kills++; this.stats.byType[e.kind]++;
    SAVE.stats.kills++;
    SAVE.stats["kills" + e.kind[0].toUpperCase() + e.kind.slice(1)] =
      (SAVE.stats["kills" + e.kind[0].toUpperCase() + e.kind.slice(1)] || 0) + 1;
    // Монеты за врага (с премиум-множителем)
    const c = e.coins;
    SAVE.coins += c; this.coinsEarned += c;
    // Бонус выпадает из «красного» танка
    if (e.bonus) this.dropPowerUp();
    else if (chance(0.08)) this.dropPowerUp();          // редкий бонус с обычного танка
    if (this.mode === "survival" && chance(0.25)) this.dropPowerUp();
    this.enemiesLeft--;
  }
  dropPowerUp() {
    const type = pick(POWERUP_TYPES);
    /* Кладём бонус только туда, куда танк реально доедет. Раньше клетка бралась
       случайно, без проверки, и бонус регулярно ложился в воду, сталь или кусты
       за водой — до него было не добраться, и он молча истекал. */
    const free = [];
    for (let cy = 1; cy < 12; cy++) for (let cx = 1; cx < 12; cx++)
      if (this.field.canMove(cx * 32, cy * 32, 32, 32)) free.push([cx * 32, cy * 32]);
    const [x, y] = free.length ? pick(free) : [32 + rnd(11) * 32, 32 + rnd(10) * 32];
    this.powerups.push(new PowerUp(x, y, type));
    Audio_.bonusAppear();
  }
  playerKilled(p) {
    this.addExplosion(p.x, p.y, "big");   // 510 мс, как в оригинале
    p.lives--; this.lostLifeThisLevel = true;
    SAVE.stats.deaths++;
    if (p.lives >= 0) setTimeout(() => { if (Game.cur === this) p.respawn(); }, 800);
    else p.dead = true;
  }
  spawnEnemies() {
    if (this.state !== "play" || !this.enemyQueue.length) return;
    if (this.enemies.length >= CFG.MAX_ENEMIES_ON_SCREEN + Math.floor(this.difficulty)) return;
    if (--this.spawnTimer > 0) return;
    this.spawnTimer = Math.max(60, 190 - this.levelIndex * 3 - this.wave * 5);
    /* Три точки появления в верхнем ряду, как в оригинале: левый край, центр и
       правый край поля 13x13 (клетки 0, 6 и 12). Идём по кругу, но занятую точку
       пропускаем и берём следующую свободную — иначе очередь упиралась в один
       вход и все танки выезжали оттуда же. */
    const pts = [SPAWN_X.left, SPAWN_X.center, SPAWN_X.right];
    let x = -1;
    for (let i = 0; i < pts.length; i++) {
      const c = pts[(this.spawnPoint + i) % pts.length];
      if (!this.tankAt(c, 0, null) && this.field.canMove(c, 0, 32, 32)) {
        x = c; this.spawnPoint = (this.spawnPoint + i + 1) % pts.length; break;
      }
    }
    if (x < 0) { this.spawnTimer = 30; return; }   // все три входа заняты — ждём
    const spec = this.enemyQueue.shift();
    this.enemies.push(new Enemy(this, x, 0, spec.kind, spec.bonus));
  }
  /* --- Режим «Захват флага» --- */
  updateCTF() {
    for (const p of this.players) {
      if (p.dead || p.spawnTimer > 0) continue;
      for (const f of this.flags) {
        if (f.taken === p) { f.x = p.x; f.y = p.y; continue; }
        if (f.taken) continue;
        if (f.owner !== p.idx && hit({ x: f.x, y: f.y, w: 24, h: 24 }, p.rect())) { f.taken = p; Audio_.bonus(); }
      }
      // Доставка на базу (нижняя часть своей половины)
      const carried = this.flags.find(f => f.taken === p);
      if (carried && p.y > 340 && Math.abs(p.x - p.startX) < 60) {
        this.ctfScore[p.idx]++; carried.taken = null;
        carried.x = carried.home.x; carried.y = carried.home.y;
        Audio_.win(); toast(`ИГРОК ${p.idx + 1} ЗАХВАТИЛ ФЛАГ! ${this.ctfScore[0]}:${this.ctfScore[1]}`, "#f0c020");
        if (this.ctfScore[p.idx] >= 3) this.gameOver(true);
      }
    }
  }
  /* --- Завершение уровня --- */
  levelComplete() {
    Log.info("уровень " + this.levelIndex + " пройден, счёт " + this.score);
    this.state = "clear"; this.timer = 100;
    Audio_.engine(false); Audio_.win();
    const dur = now() - this.levelStartTime;
    // Награды
    const lvlCoins = 100;
    SAVE.coins += lvlCoins; this.coinsEarned += lvlCoins;
    let baseBonus = 0;
    if (!this.field.baseDead) {
      baseBonus = 50;
      SAVE.coins += baseBonus; this.coinsEarned += baseBonus;
      SAVE.stats.basesSaved = (SAVE.stats.basesSaved || 0) + 1;
    }
    SAVE.stats.levels++;
    if (this.twoPlayers) SAVE.stats.coopLevels++;
    if (!this.lostLifeThisLevel) SAVE.stats.perfectLevels++;
    if (dur < 60000) SAVE.stats.fastLevels++;
    if (this.mode === "endless") SAVE.stats.endlessWaves = (SAVE.stats.endlessWaves || 0) + 1;
    if (this.mode === "survival") SAVE.stats.survivalWaves = (SAVE.stats.survivalWaves || 0) + 1;
    if (this.mode === "1p" || this.mode === "2p") SAVE.maxLevel = Math.max(SAVE.maxLevel, this.levelIndex);
    SAVE.stats.playTime += dur;
    this.lastLevelStats = { dur, lvlCoins, baseBonus };
    persist(); Ach.check();
    setTimeout(() => { if (Game.cur === this) this.nextLevel(); }, 2600);
  }
  nextLevel() {
    if (this.mode === "endless" || this.mode === "survival") {
      this.wave++;
      this.startLevel(((this.levelIndex) % CFG.TOTAL_LEVELS) + 1);
    } else if (this.mode === "boss") {
      this.wave++; this.startLevel(((this.levelIndex + 4) % CFG.TOTAL_LEVELS) + 1);
    } else if (this.levelIndex >= CFG.TOTAL_LEVELS) {
      this.gameOver(true);
    } else {
      this.customRows = null;
      this.startLevel(this.levelIndex + 1);
    }
  }
  /* --- Конец игры --- */
  gameOver(victory) {
    if (this.state === "over") return;
    this.state = "over"; this.timer = 220; this.victory = victory;
    Audio_.engine(false); victory ? Audio_.win() : Audio_.lose();
    const total = this.score + this.players.reduce((a, p) => a + p.score, 0) * 0;
    SAVE.stats.playTime += now() - this.levelStartTime;
    SAVE.stats.totalScore += this.score;
    SAVE.stats.bestScore = Math.max(SAVE.stats.bestScore, this.score);
    victory ? SAVE.stats.wins++ : SAVE.stats.losses++;
    LB.submit(SAVE.name, this.score, this.levelIndex);
    persist(); Ach.check();
    setTimeout(() => { if (Game.cur === this) { Game.cur = null; UI.showGameOver(this); } }, 3000);
  }
  /* ============================== ОТРИСОВКА ============================== */
  draw(ctx) {
    const ox = CFG.OX, oy = CFG.OY;
    // Фон
    ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, CFG.CW, CFG.CH);
    ctx.fillStyle = "#000"; ctx.fillRect(ox, oy, CFG.FIELD, CFG.FIELD);
    if (this.state === "intro") { this.drawIntro(ctx); this.drawHUD(ctx); return; }
    this.field.drawBack(ctx, ox, oy);
    // Бонусы под танками
    this.powerups.forEach(p => p.draw(ctx, ox, oy));
    // Флаги CTF
    if (this.flags) this.flags.forEach((f, i) => {
      ctx.fillStyle = i === 0 ? "#70B050" : "#C09848";
      ctx.fillRect(ox + f.x + 8, oy + f.y + 2, 3, 22);
      ctx.fillRect(ox + f.x + 11, oy + f.y + 3, 14, 10);
    });
    // Танки
    this.enemies.forEach(e => e.draw(ctx, ox, oy));
    this.players.forEach(p => { if (!p.dead && p.lives >= 0) p.draw(ctx, ox, oy); });
    // Пули и эффекты

    this.field.drawFront(ctx, ox, oy);   // кусты поверх
    this.particles.forEach(p => { ctx.fillStyle = p.c; ctx.fillRect(ox + p.x, oy + p.y, p.s, p.s); });
    this.explosions.forEach(e => e.draw(ctx, ox, oy));
    this.drawHUD(ctx);
    if (this.state === "pause") {
      ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(ox, oy, CFG.FIELD, CFG.FIELD);
      textC(ctx, "PAUSE", ox + 208, oy + 190, 4, "#f8f8f8");
      textC(ctx, "ESC - MENU   P - CONTINUE", ox + 208, oy + 230, 1, "#c0c0c0");
    }
    if (this.state === "clear") this.drawLevelClear(ctx);
    if (this.state === "over") {
      const y = oy + 200;
      ctx.fillStyle = "rgba(0,0,0,.75)"; ctx.fillRect(ox, oy, CFG.FIELD, CFG.FIELD);
      const title = this.pvp ? ("PLAYER " + ((this.winner || 0) + 1) + " WINS") : (this.victory ? "VICTORY" : "GAME OVER");
      textC(ctx, title, ox + 208, y, this.pvp ? 3 : 4, this.victory ? "#70B050" : "#d05050");
      textC(ctx, "SCORE " + this.score, ox + 208, y + 46, 2, "#f0c020");
    }
  }
  drawIntro(ctx) {
    const ox = CFG.OX, oy = CFG.OY;
    ctx.fillStyle = "#8c8c8c"; ctx.fillRect(ox, oy, CFG.FIELD, CFG.FIELD);
    const name = this.mode === "endless" ? "ENDLESS WAVE " + this.wave :
      this.mode === "survival" ? "SURVIVAL WAVE " + this.wave :
        this.mode === "pvp" ? "PLAYER VS PLAYER" :
        this.mode === "ctf" ? "CAPTURE THE FLAG" :
          this.mode === "custom" ? "CUSTOM LEVEL" : "STAGE " + this.levelIndex;
    textC(ctx, name, ox + 208, oy + 196, 3, "#000");
  }
  drawLevelClear(ctx) {
    const ox = CFG.OX, oy = CFG.OY;
    ctx.fillStyle = "rgba(0,0,0,.8)"; ctx.fillRect(ox, oy, CFG.FIELD, CFG.FIELD);
    textC(ctx, "STAGE CLEAR", ox + 208, oy + 90, 3, "#f0c020");
    const s = this.stats.byType;
    let y = oy + 150;
    const line = (a, b, c) => { text(ctx, a, ox + 60, y, 1, "#c0c0c0"); text(ctx, b, ox + 250, y, 1, c || "#fff"); y += 22; };
    line("BASIC x" + s.basic, s.basic * 100 + " PTS");
    line("FAST  x" + s.fast, s.fast * 200 + " PTS");
    line("POWER x" + s.power, s.power * 300 + " PTS");
    line("BOSS  x" + s.boss, s.boss * 1000 + " PTS");
    y += 10;
    line("TOTAL SCORE", "" + this.score, "#f0c020");
    line("COINS EARNED", "+" + this.coinsEarned, "#f0c020");
  }
  drawHUD(ctx) {
    if (CFG.portrait) return this.drawHUDPortrait(ctx);
    const x = 448;
    ctx.fillStyle = PAL.bg; ctx.fillRect(440, 0, 104, CFG.CH);
    // В дуэли врагов нет — показываем счёт баз вместо иконок
    if (this.pvp) {
      text(ctx, "DUEL", x, 20, 1, "#000");
      this.field.bases.forEach((b, k) => {
        text(ctx, "BASE " + (k + 1), x, 40 + k * 26, 1, "#000");
        text(ctx, b.dead ? "DOWN" : "OK", x + 46, 40 + k * 26, 1, b.dead ? "#d05050" : "#70B050");
      });
    }
    // Оставшиеся враги — иконки
    let n = this.pvp ? 0 : this.enemyQueue.length + this.enemies.length, i = 0;
    for (let r = 0; r < 10 && i < n; r++) for (let c = 0; c < 4 && i < n; c++, i++) {
      ctx.fillStyle = "#000"; ctx.fillRect(x + c * 12, 20 + r * 12, 8, 8);
      ctx.fillStyle = "#404040"; ctx.fillRect(x + c * 12 + 1, 21 + r * 12, 6, 6);
      ctx.fillStyle = "#000"; ctx.fillRect(x + c * 12 + 3, 20 + r * 12, 2, 3);
    }
    let y = 150;
    this.players.forEach((p, k) => {
      text(ctx, "IP" + (k ? "I" : ""), x, y, 1, "#000");
      drawTank(ctx, x + 2, y + 12, 0, p.colors, { trackPhase: 0 });
      text(ctx, String(Math.max(0, p.lives)), x + 40, y + 22, 2, "#000");
      y += 56;
    });
    text(ctx, "STAGE", x, y + 6, 1, "#000");
    text(ctx, String(this.levelIndex), x, y + 20, 2, "#000");
    y += 50;
    text(ctx, "SCORE", x, y, 1, "#000");
    text(ctx, String(this.score), x, y + 12, 1, "#fff");
    text(ctx, "COINS", x, y + 30, 1, "#000");
    text(ctx, String(SAVE.coins), x, y + 42, 1, "#f0c020");
    if (this.mode === "ctf") text(ctx, "CTF " + this.ctfScore[0] + ":" + this.ctfScore[1], x, y + 62, 1, "#000");
    if (this.net) {
      text(ctx, this.net.role === "host" ? "HOST" : "GUEST", x, CFG.CH - 40, 1, "#000");
      text(ctx, "PING " + (MP.ping | 0), x, CFG.CH - 28, 1, MP.ping > 150 ? "#d05050" : "#000");
    }
  }
  /* Портретная панель: узкая полоса под полем — на телефоне так поле шире
     на треть, чем с боковой панелью. */
  drawHUDPortrait(ctx) {
    const top = CFG.FIELD;
    ctx.fillStyle = PAL.bg; ctx.fillRect(0, top, CFG.CW, CFG.CH - top);
    // Ряд иконок оставшихся врагов
    const n = this.pvp ? 0 : this.enemyQueue.length + this.enemies.length;
    for (let i = 0; i < Math.min(n, 20); i++) {
      const ix = 6 + i * 10;
      ctx.fillStyle = "#000"; ctx.fillRect(ix, top + 6, 8, 8);
      ctx.fillStyle = "#404040"; ctx.fillRect(ix + 1, top + 7, 6, 6);
      ctx.fillStyle = "#000"; ctx.fillRect(ix + 3, top + 6, 2, 3);
    }
    if (n > 20) text(ctx, "+" + (n - 20), 6 + 20 * 10, top + 7, 1, "#000");
    if (this.pvp) {
      let bx = 6;
      this.field.bases.forEach((b, k) => {
        bx = text(ctx, "BASE" + (k + 1), bx, top + 7, 1, "#000") + 4;
        bx = text(ctx, b.dead ? "DOWN" : "OK", bx, top + 7, 1, b.dead ? "#d05050" : "#0a5010") + 12;
      });
    }
    text(ctx, "ST " + this.levelIndex, CFG.CW - 60, top + 7, 1, "#000");
    // Жизни игроков и счёт
    let x = 6;
    this.players.forEach((p, k) => {
      x = text(ctx, (k ? "2P" : "1P"), x, top + 24, 1, "#000") + 2;
      ctx.fillStyle = p.colors[0]; ctx.fillRect(x, top + 24, 7, 7);
      x = text(ctx, String(Math.max(0, p.lives)), x + 10, top + 24, 1, "#000") + 10;
    });
    text(ctx, "SCORE " + this.score, x + 4, top + 24, 1, "#000");
    // Монеты: подпись чёрным по серому (как в оригинальной панели), значок — золотой
    ctx.fillStyle = "#f0c020"; ctx.fillRect(6, top + 40, 7, 7);
    ctx.fillStyle = "#a07800"; ctx.fillRect(8, top + 42, 3, 3);
    text(ctx, String(SAVE.coins), 18, top + 40, 1, "#000");
    if (this.mode === "ctf") text(ctx, "CTF " + this.ctfScore[0] + ":" + this.ctfScore[1], 150, top + 40, 1, "#000");
    if (this.net) {
      text(ctx, (this.net.role === "host" ? "HOST " : "GUEST ") + (MP.ping | 0) + "MS",
        CFG.CW - 100, top + 40, 1, MP.ping > 150 ? "#d05050" : "#000");
    }
  }
}

/* ============================== 14. РЕЙТИНГ И ОБЛАКО ============================== */
/* Локальный топ-10 + глобальный рейтинг (Firebase/Supabase). Без сети — офлайн-режим. */
const LB = {
  submit(name, score, level) {
    if (score <= 0) return;
    SAVE.records.push({ name, score, level, date: today(), ts: now() });
    SAVE.records.sort((a, b) => b.score - a.score);
    SAVE.records = SAVE.records.slice(0, 10);
    persist();
    Cloud.submitScore(name, score, level);
  },
  local() { return SAVE.records; },
  isTop10(name) { return SAVE.records.slice(0, 10).some(r => r.name === name); },
  // Фильтрация по периоду: day | week | all
  byPeriod(list, period) {
    const t = now();
    const lim = period === "day" ? 864e5 : period === "week" ? 6048e5 : Infinity;
    return list.filter(r => (t - (r.ts || 0)) <= lim).sort((a, b) => b.score - a.score).slice(0, 20);
  }
};

/* --- ОБЛАКО: локальная база на вашем же сервере --------------------------
   Никаких сторонних сервисов: профиль, рекорды и статистика всех игроков лежат
   в db.json рядом с server.js и синхронизируются по тому же WebSocket, что и
   мультиплеер. Нет сети — игра полностью работает офлайн на localStorage,
   а накопленное отправится при следующем подключении.

   Разрешение конфликтов — по номеру ревизии: он растёт только вперёд, поэтому
   второе устройство не затрёт более свежий профиль. (Раньше здесь бралcя максимум
   монет — из-за этого любая покупка «откатывалась» назад.)                      */
const Cloud = {
  online: false, authed: false, isNew: false, err: "", forcePull: false,
  top: { day: null, week: null, all: null }, playersList: null, globalStats: null,
  pushTimer: null, retryTimer: null, pending: false,

  // Идентификатор и секрет устройства-владельца профиля
  ensureId() {
    if (!SAVE.cloud) SAVE.cloud = { id: "", token: "", rev: 0 };
    const c = SAVE.cloud;
    if (!c.id) {
      const rnd = () => Math.random().toString(36).slice(2, 12);
      c.id = "p" + rnd() + Date.now().toString(36);
      c.token = rnd() + rnd() + rnd();
      c.rev = 0;
      persist();
    }
    return c;
  },
  get mode() { return this.authed ? "online" : "offline"; },
  status() {
    if (!CFG.MP_SERVER) return "сервер не задан (CFG.MP_SERVER)";
    if (this.err) return this.err;
    if (this.authed) return "подключено, ревизия " + (SAVE.cloud ? SAVE.cloud.rev : 0);
    return this.online ? "соединение…" : "нет связи, играем офлайн";
  },

  init() {
    if (!CFG.MP_SERVER) return;
    this.ensureId();
    this.connect();
    // Мягкое переподключение: сеть могла пропасть или сервер перезапуститься
    if (!this.retryTimer) this.retryTimer = setInterval(() => {
      if (!MP.connected) { this.authed = false; this.connect(); }
      else if (!this.authed) this.auth();
    }, 15000);
  },
  connect() { MP.connect(ok => { this.online = !!ok; if (ok) this.auth(); }); },
  auth() {
    const c = this.ensureId();
    MP.send({ t: "auth", id: c.id, token: c.token, name: SAVE.name, rev: c.rev | 0 });
  },

  /* --- Пришёл профиль с сервера --- */
  onProfile(m) {
    this.authed = true; this.err = ""; this.isNew = !!m.isNew;
    const c = this.ensureId();
    const srvRev = m.rev | 0, myRev = c.rev | 0;
    if ((srvRev > myRev || this.forcePull) && m.profile) {
      this.adopt(m.profile);                       // на другом устройстве играли позже
      c.rev = srvRev; this.forcePull = false; persist();
      toast("Профиль загружен из облака", "#70B050");
    } else if (myRev > srvRev || m.isNew) {
      this.pushNow();                              // наш прогресс новее — отдаём серверу
    }
    UI.cloudRefresh();
  },
  // Принять серверный профиль как свой
  adopt(p) {
    SAVE.name = p.name || SAVE.name;
    SAVE.avatar = p.avatar | 0;
    SAVE.coins = p.coins | 0;
    SAVE.maxLevel = Math.max(1, p.maxLevel | 0);
    if (p.owned) for (const k in SAVE.owned) if (Array.isArray(p.owned[k])) SAVE.owned[k] = p.owned[k];
    if (p.equipped) Object.assign(SAVE.equipped, p.equipped);
    if (p.stats) Object.assign(SAVE.stats, p.stats);
    if (p.achievements) SAVE.achievements = p.achievements;
    if (Array.isArray(p.records)) SAVE.records = p.records;
    if (p.daily) SAVE.daily = p.daily;
    persist();
  },
  profilePayload() {
    return {
      name: SAVE.name, avatar: SAVE.avatar, coins: SAVE.coins, maxLevel: SAVE.maxLevel,
      owned: SAVE.owned, equipped: SAVE.equipped,
      stats: SAVE.stats, achievements: SAVE.achievements, records: SAVE.records, daily: SAVE.daily
    };
  },
  /* --- Отправка профиля (с задержкой, чтобы не слать на каждую монету) --- */
  pushSoon() {
    if (!CFG.MP_SERVER) return;
    this.pending = true;
    clearTimeout(this.pushTimer);
    this.pushTimer = setTimeout(() => this.pushNow(), 3000);
  },
  pushNow() {
    clearTimeout(this.pushTimer); this.pushTimer = null;
    if (!this.authed || !MP.connected) return;     // не вышло — отправим при следующем соединении
    const c = this.ensureId();
    c.rev = (c.rev | 0) + 1;
    MP.send({ t: "push", id: c.id, token: c.token, rev: c.rev, profile: this.profilePayload() });
    this.pending = false;
    persist();
  },
  onPushed(m) {
    const c = this.ensureId();
    if (m.stale) {
      // На сервере более свежая версия профиля (играли с другого устройства).
      // Забираем её, а НЕ навязываем свою устаревшую: иначе прогресс терялся бы.
      c.rev = m.rev | 0; persist();
      this.forcePull = true;
      this.auth();
    }
    UI.cloudRefresh();
  },

  /* --- Рекорды и статистика игроков --- */
  submitScore(name, score, level) {
    if (!this.authed) return;
    const c = this.ensureId();
    MP.send({ t: "score", id: c.id, name, score, level });
  },
  requestTop(period) { if (this.authed) MP.send({ t: "top", period }); },
  requestPlayers() { if (this.authed) MP.send({ t: "players" }); },
  requestGlobal() { if (this.authed) MP.send({ t: "global" }); },
  handle(m) {
    if (m.t === "profile") this.onProfile(m);
    else if (m.t === "pushed") this.onPushed(m);
    else if (m.t === "top") { this.top[m.period] = m.list || []; UI.cloudRefresh(); }
    else if (m.t === "players") { this.playersList = m.list || []; UI.cloudRefresh(); }
    else if (m.t === "global") { this.globalStats = m.data; UI.cloudRefresh(); }
    else return false;
    return true;
  },
  // Перенос профиля на другое устройство
  transferCode() { const c = this.ensureId(); return btoa(c.id + ":" + c.token); },
  useTransferCode(code) {
    try {
      const [id, token] = atob(String(code).trim()).split(":");
      if (!id || !token) throw 0;
      SAVE.cloud = { id, token, rev: 0 };
      persist();
      this.authed = false; this.auth();
      toast("Входим в перенесённый профиль…", "#70B050");
      return true;
    } catch (e) { toast("Некорректный код переноса", "#d05050"); return false; }
  }
};

/* ============================== 15. МУЛЬТИПЛЕЕР (WebSocket) ==============================
   Схема: авторитетный хост. Хост считает всю игру и 20 раз в секунду шлёт снимок мира;
   гость шлёт только свой ввод и рисует принятое состояние, предсказывая движение
   собственного танка (иначе управление ощущалось бы с задержкой пинга).
   Так обе стороны всегда на ОДНОЙ карте и видят ОДИНАКОВЫЕ танки.
   Раньше здесь была заглушка: каждое устройство запускало свою локальную игру.

   Протокол (сервер только пересылает сообщения внутри комнаты):
     -> {t:"create", room, mode, name} / {t:"join", room, name}
     <- {t:"welcome", room, index, mode, players}
     <- {t:"peer", players}                       кто-то вошёл/вышел
     -> {t:"begin", room, mode, level}            хост объявляет старт партии
     -> {t:"in", room, k}                         гость: битовая маска ввода
     -> {t:"snap", room, ...}                     хост: снимок мира
     -> {t:"chat", room, from, msg} / {t:"ping"|"pong", room, ts}
   ======================================================================================= */
const MP = {
  ws: null, room: null, role: null, index: 0, mode: "coop",
  connected: false, inGame: false, players: [], chat: loadChat(), ping: 0,
  remoteInput: { up: 0, down: 0, left: 0, right: 0, fire: 0 },   // ввод гостя (у хоста)
  snapQ: [], lastSentInput: -1, sfxOut: [], explOut: [], onReady: null,

  /* --- Соединение --- */
  connect(cb) {
    if (!CFG.MP_SERVER) { toast("Сервер мультиплеера не задан (CFG.MP_SERVER)", "#d05050"); cb && cb(false); return; }
    if (this.connected) { cb && cb(true); return; }
    try {
      this.ws = new WebSocket(CFG.MP_SERVER);
      this.ws.onopen = () => { this.connected = true; cb && cb(true); };
      this.ws.onclose = () => {
        this.connected = false; this.inGame = false;
        if (Game.cur && Game.cur.net) { toast("Связь потеряна — партия остановлена", "#d05050"); UI.back(); }
      };
      this.ws.onerror = () => { if (!this.connected) { toast("Не удалось подключиться к серверу", "#d05050"); cb && cb(false); } };
      this.ws.onmessage = e => { try { this.onMessage(JSON.parse(e.data)); } catch (err) { } };
    } catch (err) { toast("Ошибка соединения: " + err.message, "#d05050"); cb && cb(false); }
  },
  send(o) { if (this.connected && this.ws.readyState === 1) { o.room = this.room; this.ws.send(JSON.stringify(o)); } },
  createRoom(mode, cb) {
    const code = String(1000 + rnd(9000));
    this.room = code; this.role = "host"; this.index = 0; this.mode = mode;
    this.connect(ok => { if (ok) this.send({ t: "create", mode, name: SAVE.name }); cb && cb(ok, code); });
    return code;
  },
  joinRoom(code, cb) {
    this.room = String(code).trim(); this.role = "guest"; this.index = 1;
    this.connect(ok => { if (ok) this.send({ t: "join", name: SAVE.name }); cb && cb(ok); });
  },
  leave() {
    if (this.ws) { try { this.send({ t: "bye" }); this.ws.close(); } catch (e) { } }
    this.ws = null; this.room = null; this.connected = false; this.inGame = false; this.snapQ.length = 0;
    if (this._pingTimer) { clearInterval(this._pingTimer); this._pingTimer = null; }
  },
  isHost() { return this.role === "host"; },

  /* --- Приём сообщений --- */
  onMessage(m) {
    switch (m.t) {
      case "welcome":
        this.index = m.index; this.mode = m.mode || this.mode; this.players = m.players || [];
        toast(`Комната ${m.room}: вы игрок ${m.index + 1}`, "#70B050");
        break;
      case "peer":
        this.players = m.players || [];
        toast("Игроков в комнате: " + this.players.length, "#70B050");
        UI.mpRefresh();
        // Хост начинает партию, как только подключился второй игрок
        if (this.isHost() && this.players.length >= 2 && !this.inGame) this.startMatch();
        break;
      case "begin":
        this.inGame = true; this.mode = m.mode;
        UI.startGame({ mode: m.mode === "pvp" ? "pvp" : "2p", level: m.level, net: { role: "guest" } });
        break;
      case "in":                                   // ввод гостя (принимает хост)
        this.applyInputMask(m.k);
        break;
      case "snap":                                 // снимок мира (принимает гость)
        this.snapQ.push(m);
        if (this.snapQ.length > 30) this.snapQ.splice(0, this.snapQ.length - 30);  // защита от лавины
        break;
      case "chat":
        this.pushChat(m.from, m.msg, false); toast(m.from + ": " + m.msg, "#5da0f0");
        if (UI.screen === "list" && UI.listKind === "chat") UI.renderList();
        break;
      case "ping": this.send({ t: "pong", ts: m.ts }); break;
      case "pong": this.ping = Math.max(0, now() - m.ts); break;
      case "err":
        Cloud.err = m.msg || "Ошибка сервера";
        toast(m.msg || "Ошибка сервера", "#d05050"); UI.cloudRefresh(); break;
      case "profile": case "pushed": case "top": case "players": case "global":
        Cloud.handle(m); break;
      case "rooms": this.rooms = m.rooms || []; UI.mpRefresh(); break;
      case "left":
        toast("Соперник вышел", "#d05050");
        if (Game.cur && Game.cur.net) { Game.cur.gameOver(this.isHost()); }
        this.inGame = false;
        break;
    }
  },
  startMatch() {
    const level = 1;
    this.inGame = true;
    this.send({ t: "begin", mode: this.mode, level });
    UI.startGame({ mode: this.mode === "pvp" ? "pvp" : "2p", level, net: { role: "host" } });
  },

  /* --- Ввод гостя упаковывается в один байт --- */
  inputMask(i) { return (i.up ? 1 : 0) | (i.down ? 2 : 0) | (i.left ? 4 : 0) | (i.right ? 8 : 0) | (i.fire ? 16 : 0); },
  applyInputMask(k) {
    const r = this.remoteInput;
    r.up = k & 1; r.down = k & 2; r.left = k & 4; r.right = k & 8; r.fire = k & 16;
  },
  sendInput(i) {
    const k = this.inputMask(i);
    if (k === this.lastSentInput) return;          // шлём только при изменении
    this.lastSentInput = k;
    this.send({ t: "in", k });
  },
  sendChat(msg) { this.send({ t: "chat", from: SAVE.name, msg }); this.pushChat(SAVE.name, msg, true); },
  /* Переписка складывается в localStorage и переживает перезапуск: раньше
     сообщения показывались всплывающей плашкой на две секунды и пропадали
     насовсем — прочитать, что писали, было уже негде. */
  pushChat(from, msg, mine) {
    this.chat.push({ from: String(from || "?").slice(0, 24), msg: String(msg).slice(0, 300), t: Date.now(), mine: !!mine });
    if (this.chat.length > CHAT_MAX) this.chat.splice(0, this.chat.length - CHAT_MAX);
    saveChat(this.chat);
  },
  clearChat() { this.chat.length = 0; saveChat(this.chat); },
  requestRooms() { this.send({ t: "rooms" }); },
  pingLoop() {
    if (this._pingTimer) return;
    this._pingTimer = setInterval(() => { if (this.connected && this.room) this.send({ t: "ping", ts: now() }); }, 2000);
  }
};

/* Хост запоминает воспроизведённые звуки и передаёт их гостю: иначе у второго
   игрока была бы «немая» картинка чужих выстрелов и попаданий. */
["shoot", "shootEnemy", "hitBrick", "hitSteel", "bonusAppear", "bonus", "tick", "coin"].forEach(n => {
  const orig = Audio_[n].bind(Audio_);
  Audio_[n] = function () { if (MP.inGame && MP.isHost()) MP.sfxOut.push(n); return orig(); };
});

/* --- Сборка и применение снимка мира --------------------------------------
   Координаты округляются до целых пикселей: снимок 20 раз в секунду занимает
   меньше килобайта, чего достаточно даже для мобильного интернета.          */
const KINDS = ["basic", "fast", "power", "armor", "boss"];
const SHOTS = ["normal", "laser", "plasma", "fire", "electro", "firework"];
// Сжатие местности методом повторов: 2704 юнита ужимаются до пары сотен чисел
function encodeField(f) {
  const out = []; let v = f.g[0], c = 0;
  for (let i = 0; i < f.g.length; i++) {
    if (f.g[i] === v) c++; else { out.push(v, c); v = f.g[i]; c = 1; }
  }
  out.push(v, c); return out;
}
function decodeField(f, rle) {
  let i = 0;
  for (let k = 0; k < rle.length; k += 2)
    for (let j = 0; j < rle[k + 1] && i < f.g.length; j++) f.g[i++] = rle[k];
  f.dirty = true;
}
function buildSnapshot(g) {
  const s = { t: "snap", f: g.frame, st: g.state, lv: g.levelIndex, sc: g.score, w: g.winner };
  s.p = g.players.map(p => [p.x | 0, p.y | 0, p.dir, p.lives, p.stars, p.shield | 0, p.spawnTimer | 0, p.dead ? 1 : 0, p.armor | 0]);
  s.e = g.enemies.map(e => [e.x | 0, e.y | 0, e.dir, KINDS.indexOf(e.kind), e.hp, e.bonus ? 1 : 0, e.spawnTimer | 0]);
  s.b = g.bullets.map(b => [b.x | 0, b.y | 0, b.dir, SHOTS.indexOf(b.style), b.owner && b.owner.isPlayer ? 1 : 0]);
  s.u = g.powerups.map(p => [p.x | 0, p.y | 0, POWERUP_TYPES.indexOf(p.type)]);
  s.bs = g.field.bases.map(b => b.dead ? 1 : 0);
  s.q = g.enemyQueue.length;
  s.d = g.field.changes.splice(0, g.field.changes.length);   // изменения местности с прошлого снимка
  s.a = MP.sfxOut.splice(0, MP.sfxOut.length);               // звуки, чтобы гость слышал то же самое
  s.x = MP.explOut.splice(0, MP.explOut.length);             // взрывы
  // Опорный кадр местности раз в 3 секунды — самолечение при любой рассинхронизации
  if (g.frame % 180 === 0) s.full = encodeField(g.field);
  return s;
}
function applySnapshot(g, s) {
  // Смена уровня — гость перезагружает карту
  if (s.lv !== g.levelIndex) { g.startLevel(s.lv); }
  g.state = s.st; g.score = s.sc; g.winner = s.w;
  // Местность: сначала опорный кадр (если пришёл), затем точечные изменения
  if (s.full) decodeField(g.field, s.full);
  if (s.d && s.d.length) {
    for (let i = 0; i < s.d.length; i += 3) g.field.set(s.d[i], s.d[i + 1], s.d[i + 2]);
    g.field.changes.length = 0;
  }
  (s.bs || []).forEach((dead, i) => { if (dead && g.field.bases[i] && !g.field.bases[i].dead) g.field.destroyBase(i); });
  // Игроки: свой танк корректируем мягко (работает предсказание), чужой — ведём к цели
  (s.p || []).forEach((a, i) => {
    const p = g.players[i]; if (!p) return;
    const mine = (i === MP.index);
    if (mine) {
      const err = Math.hypot(p.x - a[0], p.y - a[1]);
      if (err > 24) { p.x = a[0]; p.y = a[1]; }        // сильно разошлись — ставим жёстко
      else { p.netX = a[0]; p.netY = a[1]; }
    } else { p.netX = a[0]; p.netY = a[1]; p.dir = a[2]; }
    p.lives = a[3]; p.stars = a[4]; p.shield = a[5]; p.spawnTimer = a[6];
    p.dead = !!a[7]; p.armor = a[8];
  });
  // Враги
  const ne = s.e || [];
  while (g.enemies.length > ne.length) g.enemies.pop();
  ne.forEach((a, i) => {
    let e = g.enemies[i];
    if (!e) { e = new Enemy(g, a[0], a[1], KINDS[a[3]] || "basic", !!a[5]); g.enemies.push(e); e.x = a[0]; e.y = a[1]; }
    e.netX = a[0]; e.netY = a[1]; e.dir = a[2]; e.hp = a[4]; e.bonus = !!a[5]; e.spawnTimer = a[6];
  });
  // Пули и бонусы пересоздаём целиком — они короткоживущие
  g.bullets = (s.b || []).map(a => {
    const b = new Bullet({ isPlayer: !!a[4], stars: 0, bullets: 0, kind: "basic" }, a[0], a[1], a[2], 1, SHOTS[a[3]] || "normal");
    return b;
  });
  g.powerups = (s.u || []).map(a => new PowerUp(a[0], a[1], POWERUP_TYPES[a[2]] || "star"));
  g.enemyQueue.length = Math.max(0, s.q | 0);
  // Звуки и взрывы, как у хоста
  (s.a || []).forEach(n => { const f = Audio_[n]; if (typeof f === "function") f.call(Audio_); });
  (s.x || []).forEach(e => g.addExplosion(e[0], e[1], e[2] ? "big" : "normal"));
}

/* ============================== ЖУРНАЛ СОБЫТИЙ ==============================
   Пишем, что происходило: старт партии, взятие уровня, потеря базы, покупки,
   связь с сервером и любые ошибки. Раньше единственным следом были всплывающие
   плашки — если что-то ломалось, разобраться постфактум было нечем.
   Журнал переживает перезапуск и выгружается в файл из «НАСТРОЙКИ → ЖУРНАЛ». */
const LOG_KEY = "battlecity_log_v1", LOG_MAX = 400;
const Log = {
  lines: (() => { try { const a = JSON.parse(localStorage.getItem(LOG_KEY)); return Array.isArray(a) ? a : []; }
                  catch (e) { return []; } })(),
  _save() { try { localStorage.setItem(LOG_KEY, JSON.stringify(this.lines.slice(-LOG_MAX))); } catch (e) { } },
  push(lvl, msg) {
    const rec = { t: Date.now(), l: lvl, m: String(msg).slice(0, 200) };
    this.lines.push(rec);
    if (this.lines.length > LOG_MAX) this.lines.splice(0, this.lines.length - LOG_MAX);
    this._save();
    const tag = "[BC " + lvl + "]";
    (lvl === "ERR" ? console.error : lvl === "WARN" ? console.warn : console.log)(tag, msg);
    if (typeof UI !== "undefined" && UI.screen === "list" && UI.listKind === "log") UI.renderList();
  },
  info(m) { this.push("INFO", m); },
  warn(m) { this.push("WARN", m); },
  error(m) { this.push("ERR", m); },
  clear() { this.lines.length = 0; this._save(); },
  text() {
    return this.lines.map(r => {
      const d = new Date(r.t);
      return "[" + d.toLocaleDateString() + " " + ("0" + d.getHours()).slice(-2) + ":" +
        ("0" + d.getMinutes()).slice(-2) + ":" + ("0" + d.getSeconds()).slice(-2) + "] " + r.l + "  " + r.m;
    }).join("\n");
  }
};
window.addEventListener("error", e => Log.error(e.message + " @" + (e.lineno || "?")));
window.addEventListener("unhandledrejection", e => Log.error("promise: " + (e.reason && e.reason.message || e.reason)));

/* ============================== 17. ЕЖЕДНЕВНЫЙ БОНУС ЗА ВХОД ============================== */
function dailyBonus() {
  const d = today();
  if (SAVE.daily.last === d) return null;
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  SAVE.daily.streak = (SAVE.daily.last === y) ? SAVE.daily.streak + 1 : 1;
  SAVE.daily.last = d;
  const amount = 50 + (SAVE.daily.streak - 1) * 10;   // +50 за вход, +10 за каждый день стрика
  SAVE.coins += amount; persist(); Ach.check();
  return { amount, streak: SAVE.daily.streak };
}

const UI = {
  screen: "menu",       // menu | list | editor | game
  stack: [],
  sel: 0, tab: 0,
  levelSel: 1,
  list: null,
  editorData: null, editorTool: "B",

  /* --- Переключение экранов --- */
  menuSel: 0,                    // где стоял курсор, когда уходили из главного меню
  show(name) {
    this.stopCardAnim();                 // холсты магазина живут только на своём экране
    // Запоминаем строку меню, из которой уходим, и возвращаем курсор на неё при
    // возврате. Раньше курсор был общий на все экраны: «назад» из достижений
    // ставило его туда, где он остался в списке достижений, то есть в начало.
    if (this.screen === "menu" && name !== "menu") this.menuSel = this.sel;
    $$(".overlay").forEach(o => o.classList.remove("on"));
    this.screen = name;
    if (name === "menu") { this.sel = this.menuSel; $("#scr-menu").classList.add("on"); this.drawLogo(); this.buildMenu(); }
    else if (name === "list") { $("#scr-list").classList.add("on"); this.renderList(); }
    else if (name === "editor") { $("#scr-editor").classList.add("on"); this.buildEditor(); }
    // name === "game" — оверлеи скрыты, виден холст
    // Кнопка «назад/пауза» нужна на телефоне всегда, джойстик и огонь — только в бою
    $("#touch").classList.toggle("on", isTouch);
    $("#touch").classList.toggle("ingame", name === "game");
    $("#btnPause").textContent = name === "game" ? "II" : (name === "menu" ? "" : "\u2190");
    $("#btnPause").style.display = (name === "menu" && !Game.cur) ? "none" : "flex";
    fitStage();
  },
  back() {
    if (Game.cur) { Game.cur = null; Audio_.engine(false); }
    this.show("menu");
  },
  /* --- Логотип BATTLE CITY --- */
  drawLogo() {
    const c = $("#logo"), ctx = c.getContext("2d");
    ctx.clearRect(0, 0, c.width, c.height);
    textC(ctx, "BATTLE", c.width / 2, 2, 6, "#C09848");
    textC(ctx, "CITY", c.width / 2, 50, 6, "#C09848");
    // Гусеничная полоска-декор под названием
    ctx.fillStyle = "#707070";
    for (let x = 40; x < c.width - 40; x += 8) ctx.fillRect(x, 98, 5, 4);
  },
  /* --- Главное меню --- */
  buildMenu() {
    if (isTouch) $("#menuHint").innerHTML = "ТАП — выбрать &nbsp; ПОВТОРНЫЙ ТАП — запустить";
    const items = [
      { label: "1 PLAYER", act: () => this.startGame({ mode: "1p", level: this.levelSel }) },
      { label: "2 PLAYERS", act: () => this.startGame({ mode: "2p", level: this.levelSel }) },
      {
        label: "УРОВЕНЬ ", right: "< " + this.levelSel + " >",
        act: () => this.startGame({ mode: "1p", level: this.levelSel }),
        left: () => { this.levelSel = this.levelSel <= 1 ? CFG.TOTAL_LEVELS : this.levelSel - 1; this.buildMenu(); },
        rightK: () => { this.levelSel = this.levelSel >= CFG.TOTAL_LEVELS ? 1 : this.levelSel + 1; this.buildMenu(); }
      },
      { label: "РЕЖИМЫ", act: () => this.openList("modes") },
