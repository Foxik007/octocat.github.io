      { label: "РЕЙТИНГ", act: () => this.openList("lb") },
      { label: "ДОСТИЖЕНИЯ", right: Ach.count() + "/" + ACHIEVEMENTS.length, act: () => this.openList("ach") },
      { label: "СТАТИСТИКА", act: () => this.openList("stats") },
      { label: "СОЗДАТЬ СВОЙ УРОВЕНЬ", act: () => this.show("editor") },
      { label: "МУЛЬТИПЛЕЕР", right: MP.connected ? "ONLINE" : "OFFLINE", act: () => this.openList("mp") },
      { label: "ЧТО НОВОГО", right: "рев. " + CHANGELOG[0].v, act: () => this.openList("news") },
      { label: "НАСТРОЙКИ", act: () => this.openList("settings") },
      { label: "ПРОДОЛЖИТЬ СОХРАНЁННУЮ ИГРУ", right: SAVE.progress ? "есть" : "нет", act: () => this.loadProgress() }
    ];
    this.menuItems = items;
    this.sel = clamp(this.sel, 0, items.length - 1);
    const box = $("#menuList");
    box.innerHTML = items.map((it, i) =>
      `<div class="row ${i === this.sel ? "sel" : ""}"><span class="cur ${i === this.sel ? "blink" : ""}"></span>
       <span class="name">${it.label}</span><span class="price">${it.right || ""}</span></div>`).join("");
    const s = box.querySelector(".row.sel"); if (s) s.scrollIntoView({ block: "nearest" });
    this.bindClicks(box, items, () => this.buildMenu());
  },
  // Клик/тап по строке: выделяет её и выполняет действие (управление без клавиатуры)
  /* --- Магазин: сетка карточек с анимированным превью ---------------------
     Раньше товары были обычными строками текста: цвет, скин и эффект выстрела
     покупались вслепую, увидеть их можно было только после покупки. Теперь у
     каждой карточки свой холст, который перерисовывается по кадрам. */
  renderCards(L) {
    $("#listBody").innerHTML = '<div class="cards">' + L.items.map((it, i) => {
      const cls = [it.eq ? "eq" : it.own ? "own" : "", it.lock ? "lock" : "", i === this.sel ? "sel" : ""]
        .filter(Boolean).join(" ");
      return `<div class="card row ${cls}">
        <canvas width="48" height="48" data-i="${i}"></canvas>
        <div class="cname">${esc(it.label)}</div>
        <div class="cfoot">
          ${it.tag ? `<span class="ctag ${it.tagCls || ""}">${esc(it.tag)}</span>` : ""}
          ${it.right ? `<span class="cprice">${esc(it.right)}</span>` : ""}
        </div></div>`;
    }).join("") + "</div>";
    const cards = $("#listBody").querySelectorAll(".card");
    // сколько карточек помещается в ряд — для навигации стрелками вверх/вниз
    this.cardCols = 1;
    if (cards.length) {
      const top = cards[0].offsetTop;
      this.cardCols = Math.max(1, [...cards].filter(c => c.offsetTop === top).length);
    }
    const sel = $("#listBody").querySelector(".card.sel");
    if (sel) sel.scrollIntoView({ block: "nearest" });
    this.bindClicks($("#listBody"), L.items, () => this.renderList());
    this.startCardAnim([...cards].map(c => c.querySelector("canvas")), L.items);
  },
  startCardAnim(canvases, items) {
    this.stopCardAnim();
    const ctxs = canvases.map(c => c.getContext("2d"));
    ctxs.forEach(c => c.imageSmoothingEnabled = false);
    const tick = () => {
      const t = now();
      for (let i = 0; i < ctxs.length; i++) {
        const pv = items[i] && items[i].preview;
        if (pv) this.drawPreview(ctxs[i], 48, 48, pv, t);
      }
      this._cardAnim = requestAnimationFrame(tick);
    };
    tick();
  },
  stopCardAnim() { if (this._cardAnim) { cancelAnimationFrame(this._cardAnim); this._cardAnim = 0; } },
  /* Отрисовка одного превью. kind: color | skin | shot | effect */
  drawPreview(ctx, W, H, pv, t) {
    ctx.fillStyle = "#0a0a0a"; ctx.fillRect(0, 0, W, H);
    const phase = Math.floor(t / 110) % 2;
    const cx = (W - 32) / 2;
    if (pv.kind === "color" || pv.kind === "skin") {
      const colId = pv.kind === "color" ? pv.id : SAVE.equipped.color;
      const skin = pv.kind === "skin" ? pv.id : SAVE.equipped.skin;
      // Смотрит вверх и не крутится: на повороте эмблема ложилась боком и
      // разглядеть, что покупаешь, было нельзя.
      drawTank(ctx, cx, (H - 32) / 2, 0, TANK_COLORS[colId] || TANK_COLORS.yellow, {
        art: "p1", trackPhase: phase, skin,
        skinData: skin === "flag" ? ((FLAGS.find(f => f.id === SAVE.equipped.flag) || FLAGS[0]).bands)
          : (skin === "custom" ? SAVE.equipped.custom : null)
      });
    } else if (pv.kind === "shot") {
      drawTank(ctx, cx, H - 34, 0, TANK_COLORS[SAVE.equipped.color] || TANK_COLORS.yellow,
        { art: "p1", trackPhase: phase });
      // снаряд летит вверх и повторяется
      const travel = (t / 4) % (H - 6);
      const by = H - 30 - travel;
      const fake = { x: 0, y: 0, dir: 0, style: pv.id, trail: [] };
      for (let k = 1; k <= 6; k++) fake.trail.push({ x: 0, y: k * 3 });
      if (by > -8) Bullet.prototype.draw.call(fake, ctx, W / 2 - 4, by);
    } else if (pv.kind === "effect") {
      const col = TANK_COLORS[SAVE.equipped.color] || TANK_COLORS.yellow;
      if (pv.id === "trail") {
        // танк стоит на месте, дым уходит назад — так эффект виден целиком
        for (let k = 0; k < 7; k++) {
          const off = ((t / 26) + k * 4) % 22;
          ctx.fillStyle = "rgba(160,160,160," + (0.45 * (1 - off / 22)).toFixed(2) + ")";
          ctx.fillRect(W / 2 - 4 + (k % 3) * 3, H / 2 + 8 + off, 3, 3);
        }
        drawTank(ctx, cx, (H - 32) / 2 - 6, 0, col, { art: "p1", trackPhase: phase });
      } else if (pv.id === "spawnfx") {
        const f = Math.floor(t / 90) % 4, k = (t % 900) / 900, r = 6 + k * 20;
        drawArt(ctx, cx, (H - 32) / 2, SPAWN_ART[[0, 1, 2, 1][f]], () => f % 2 ? "#f8f8f8" : "#5da0f0", 2);
        ctx.strokeStyle = "rgba(240,192,32," + (1 - k).toFixed(2) + ")"; ctx.lineWidth = 2;
        ctx.strokeRect(W / 2 - r, H / 2 - r, r * 2, r * 2);
      } else {
        const f = Math.floor(t / 110) % BOOM_ART.length;
        const tint = ["#ff40ff", "#40ffff", "#ffff40", "#40ff40", "#ff8040"][Math.floor(t / 550) % 5];
        const pal = { W: "#f8f8f8", L: tint, M: tint };
        drawArt(ctx, cx, (H - 32) / 2, BOOM_ART[f], ch => pal[ch], 2);
      }
    }
  },
  bindClicks(box, items, rerender) {
    box.querySelectorAll(".row").forEach((row, i) => {
      row.addEventListener("click", () => {
        Audio_.init(); Audio_.resume();
        if (this.sel !== i) { this.sel = i; rerender(); return; }   // первый тап — выбор
        const it = items[i];
        if (it && it.act) { Audio_.tone(880, 0.05, "square", 0.2); it.act(); }  // повторный — действие
      });
    });
  },
  /* --- Универсальный списочный экран --- */
  openList(kind, tab) {
    this.listKind = kind; this.tab = tab || 0;
    this.show("list");           // сначала переход — он запомнит позицию в меню
    this.sel = 0; this.renderList();
  },
  renderList() {
    const L = this.buildListData(this.listKind);
    this.list = L;
    $("#listTitle").textContent = L.title;
    $("#listSub").innerHTML = L.sub || "";
    $("#listTabs").innerHTML = (L.tabs || []).map((t, i) =>
      `<span class="tab ${i === this.tab ? "on" : ""}">${t}</span>`).join("");
    this.sel = clamp(this.sel, 0, Math.max(0, L.items.length - 1));
    if (L.cards) this.renderCards(L);
    else $("#listBody").innerHTML = L.items.map((it, i) => {
      if (it.hdr !== undefined) return it.hdr
        ? `<div class="row"><span class="cur"></span><span class="name gold">— ${it.hdr} —</span></div>`
        : `<div class="row"><span class="cur"></span><span class="name"></span></div>`;
      return `<div class="row ${i === this.sel ? "sel" : ""}">
        <span class="cur ${i === this.sel ? "blink" : ""}"></span>
        <span class="name ${it.cls || ""}">${it.raw ? it.label : esc(it.label)}</span>
        ${it.tag ? `<span class="tag ${it.tagCls || ""}">${it.tag}</span>` : ""}
        ${it.right !== undefined && it.right !== "" ? `<span class="price">${it.right}</span>` : ""}</div>`;
    }).join("") || `<div class="row gray">ПУСТО</div>`;
    $("#listHint").innerHTML = L.hint || (isTouch
      ? "ТАП — выбрать &nbsp; ПОВТОРНЫЙ ТАП — подтвердить &nbsp; ВКЛАДКИ — сверху"
      : "&uarr;&darr; выбор &nbsp; ENTER действие &nbsp; TAB вкладка &nbsp; ESC назад");
    if (!L.cards) {
      const s = $("#listBody").querySelector(".row.sel"); if (s) s.scrollIntoView({ block: "nearest" });
      this.bindClicks($("#listBody"), L.items, () => this.renderList());
    }
    // Переключение вкладок тапом
    $("#listTabs").querySelectorAll(".tab").forEach((t, i) =>
      t.addEventListener("click", () => { this.tab = i; this.sel = 0; this.renderList(); }));
  },
  /* --- Построение содержимого экранов --- */
  buildListData(kind) {
    const coins = `<span class="gold">🪙 ${fmt(SAVE.coins)}</span>`;
    if (kind === "shop") {
      // Только внешний вид: улучшений, влияющих на бой, в магазине нет.
      const cats = ["color", "skin", "shot", "effect"];
      const names = ["ЦВЕТА", "СКИНЫ", "ВЫСТРЕЛЫ", "ЭФФЕКТЫ"];
      const cat = cats[this.tab];
      const items = SHOP[cat].map(it => {
        const own = isOwned(cat, it), lock = isLocked(it);
        const eq = SAVE.equipped[cat] === it.id;
        return {
          label: it.name,
          tag: eq ? "НАДЕТО" : own ? "КУПЛЕНО" : lock ? "ЗАКРЫТО" : "",
          tagCls: eq ? "eq" : own ? "own" : lock ? "lock" : "",
          right: own ? "" : (it.price < 0 ? "ПОДПИСКА" : it.price + " 🪙"),
          cls: lock && !own ? "gray" : "",
          own, eq, lock, preview: { kind: cat, id: it.id },
          act: () => {
            if (!own) { if (buy(cat, it)) { SAVE.equipped[cat] = it.id; persist(); } }
            else { SAVE.equipped[cat] = it.id; persist(); toast("НАДЕТО: " + it.name, "#5da0f0"); }
            if (it.id === "flag") this.chooseFlag();
            if (it.id === "custom") this.customSkinEditor();
            this.renderList();
          }
        };
      });
      return {
        title: "МАГАЗИН", tabs: names, items, cards: true,
        sub: `Баланс: <span class="gold">${coins}</span> 🪙 &nbsp; Уровень: ${SAVE.maxLevel}`,
        hint: isTouch ? "ТАП — выбрать &nbsp; ПОВТОРНЫЙ ТАП — надеть/купить &nbsp; ВКЛАДКИ — сверху"
          : "&larr;&rarr;&uarr;&darr; — выбор &nbsp; ENTER — надеть/купить &nbsp; TAB — вкладка &nbsp; ESC — назад"
      };
    }
    if (kind === "lb") {
      const tabs = ["ЗА ДЕНЬ", "ЗА НЕДЕЛЮ", "ВСЁ ВРЕМЯ", "ИГРОКИ", "ОБЩЕЕ"];
      const online = Cloud.authed;
      const sub = online
        ? `<span class="grn">Облако: ${Cloud.status()}</span>`
        : `<span class="gray">Офлайн: показан локальный топ-10. ${CFG.MP_SERVER ? "Нет связи с сервером." : "Задайте CFG.MP_SERVER и запустите server.js."}</span>`;

      if (this.tab === 3) {                      // ---- таблица игроков ----
        if (online && !Cloud.playersList) Cloud.requestPlayers();
        const list = Cloud.playersList || [];
        const items = list.map((p, i) => ({
          label: `${pad(i + 1, 2)}. ${p.name}`,
          right: `${fmt(p.best)} очк · ур.${p.maxLevel} · ${p.kills} фрагов · ${p.items} вещей`,
          cls: i === 0 ? "gold" : "", act: () => this.playerCard(p)
        }));
        if (!items.length) items.push({ label: online ? "ЗАГРУЖАЕМ…" : "НЕТ СВЯЗИ С СЕРВЕРОМ", cls: "gray", act: () => { } });
        items.push({ label: "ОБНОВИТЬ", act: () => { Cloud.requestPlayers(); toast("Обновляем…"); } });
        return { title: "РЕЙТИНГ · ИГРОКИ", tabs, items, sub };
      }
      if (this.tab === 4) {                      // ---- общая сводка ----
        if (online && !Cloud.globalStats) Cloud.requestGlobal();
        const g = Cloud.globalStats;
        const items = g ? [
          { label: "ИГРОКОВ В БАЗЕ", right: fmt(g.players) },
          { label: "СЫГРАНО ПАРТИЙ", right: fmt(g.games) },
          { label: "УНИЧТОЖЕНО ВРАГОВ", right: fmt(g.kills) },
          { label: "РАЗРУШЕНО БЛОКОВ", right: fmt(g.blocks) },
          { label: "ПРОЙДЕНО УРОВНЕЙ", right: fmt(g.levels) },
          { label: "МОНЕТ У ВСЕХ ИГРОКОВ", right: fmt(g.coins) + " 🪙", cls: "gold" },
          { label: "ЗАПИСЕЙ В ТАБЛИЦЕ РЕКОРДОВ", right: fmt(g.scores) },
          { label: "ОБЩЕЕ ВРЕМЯ В ИГРЕ", right: timeStr(g.time) },
          { label: "ОБНОВИТЬ", act: () => { Cloud.requestGlobal(); toast("Обновляем…"); } }
        ] : [{ label: online ? "ЗАГРУЖАЕМ…" : "НЕТ СВЯЗИ С СЕРВЕРОМ", cls: "gray" }];
        return { title: "РЕЙТИНГ · ОБЩЕЕ", tabs, items: items.map(x => Object.assign({ act: () => { } }, x)), sub };
      }
      // ---- топ по очкам ----
      const period = ["day", "week", "all"][this.tab];
      let rows;
      if (online) {
        if (!Cloud.top[period]) { Cloud.requestTop(period); rows = null; }
        else rows = Cloud.top[period];
      } else rows = LB.byPeriod(SAVE.records, period);
      const items = (rows || []).map((r, i) => ({
        label: `${pad(i + 1, 2)}. ${r.name}`,
        right: fmt(r.score) + " (ур." + r.level + ")",
        cls: i === 0 ? "gold" : (r.name === SAVE.name ? "grn" : ""), act: () => { }
      }));
      if (!items.length) items.push({ label: rows === null ? "ЗАГРУЖАЕМ…" : "РЕКОРДОВ ПОКА НЕТ — СЫГРАЙТЕ ИГРУ", cls: "gray", act: () => { } });
      items.push({ label: "ИЗМЕНИТЬ ИМЯ ИГРОКА (" + SAVE.name + ")", act: () => this.renameProfile() });
      if (online) items.push({ label: "ОБНОВИТЬ", act: () => { Cloud.top[period] = null; Cloud.requestTop(period); this.renderList(); } });
      return { title: "LEADERBOARD / РЕЙТИНГ", tabs, items, sub };
    }
    if (kind === "ach") {
      const items = ACHIEVEMENTS.map(a => {
        const got = !!SAVE.achievements[a.id];
        return {
          label: (got ? "★ " : "☆ ") + a.n + " — " + a.d, right: "+" + a.r + " 🪙",
          cls: got ? "grn" : "gray", tag: got ? "ПОЛУЧЕНО" : "", tagCls: "own", act: () => { }
        };
      });
      return { title: "ДОСТИЖЕНИЯ", items, sub: `Открыто ${Ach.count()} из ${ACHIEVEMENTS.length}` };
    }
    if (kind === "stats") {
      const s = SAVE.stats;
      const winRate = s.games ? Math.round(s.wins / s.games * 100) : 0;
      const favBonus = Object.entries(s.bonusesTaken || {}).sort((a, b) => b[1] - a[1])[0];
      const items = [
        { label: "ИГР СЫГРАНО", right: s.games }, { label: "ПОБЕД / ПОРАЖЕНИЙ", right: s.wins + " / " + s.losses },
        { label: "ПРОЦЕНТ ПОБЕД", right: winRate + "%" },
        { hdr: "УНИЧТОЖЕНО ВРАГОВ" },
        { label: "ВСЕГО", right: s.kills }, { label: "ОБЫЧНЫХ (жёлтые)", right: s.killsBasic || 0 },
        { label: "БЫСТРЫХ (серебряные)", right: s.killsFast || 0 }, { label: "МОЩНЫХ (золотые)", right: s.killsPower || 0 },
        { label: "БРОНЕВЫХ", right: s.killsArmor || 0 },
        { label: "БОССОВ", right: s.killsBoss || 0 },
        { hdr: "ПРОЧЕЕ" },
        { label: "РАЗРУШЕНО БЛОКОВ", right: s.blocks }, { label: "ПРОЙДЕНО УРОВНЕЙ", right: s.levels },
        { label: "УРОВНЕЙ В КООПЕРАТИВЕ", right: s.coopLevels }, { label: "ВЫСТРЕЛОВ", right: s.bulletsFired },
        { label: "ПОТЕРЯНО ТАНКОВ", right: s.deaths }, { label: "ОБЩЕЕ ВРЕМЯ В ИГРЕ", right: timeStr(s.playTime) },
        { label: "ЛУЧШИЙ СЧЁТ", right: fmt(s.bestScore) }, { label: "СУММАРНЫЙ СЧЁТ", right: fmt(s.totalScore) },
        { label: "ЛЮБИМЫЙ БОНУС", right: favBonus ? favBonus[0] + " x" + favBonus[1] : "—" },
        { label: "МОНЕТ НАКОПЛЕНО", right: fmt(SAVE.coins) + " 🪙" },
        { hdr: "ДЕЙСТВИЯ" },
        { label: "СБРОСИТЬ ВЕСЬ ПРОГРЕСС", cls: "red", act: () => this.resetProgress() }
      ].map(x => Object.assign({ act: () => { } }, x));
      return { title: "СТАТИСТИКА", items, sub: `Игрок: ${SAVE.name}` };
    }
    if (kind === "modes") {
      const items = [
        { label: "КАМПАНИЯ — 1 ИГРОК", right: "35 уровней", act: () => this.startGame({ mode: "1p", level: this.levelSel }) },
        { label: "КАМПАНИЯ — 2 ИГРОКА (локально)", act: () => this.startGame({ mode: "2p", level: this.levelSel }) },
        { label: "БЕСКОНЕЧНЫЙ РЕЖИМ", right: "волны", act: () => this.startGame({ mode: "endless", level: 1 }) },
        { label: "ВЫЖИВАНИЕ", right: "1 жизнь", act: () => this.startGame({ mode: "survival", level: this.levelSel }) },
        { label: "БОСС-БИТВА", right: "супер-танк", act: () => this.startGame({ mode: "boss", level: 5 }) },
        { label: "PvP — ДВЕ БАЗЫ (2 игрока, дуэль)", right: "локально", act: () => this.startGame({ mode: "pvp", level: this.levelSel }) },
        { label: "ЗАХВАТ ФЛАГА (2 игрока)", act: () => this.startGame({ mode: "ctf", level: 3 }) },
        { label: "ТУРНИР (8 игроков, 5 раундов)", right: "TODO", cls: "gray", act: () => this.tournament() },
        { hdr: "СВОИ УРОВНИ" },
        ...SAVE.customLevels.map((l, i) => ({
          label: "▶ " + l.name, right: "играть",
          act: () => this.startGame({ mode: "custom", level: 1, rows: l.rows })
        }))
      ].map(x => Object.assign({ act: () => { } }, x));
      return { title: "РЕЖИМЫ ИГРЫ", items, sub: "Выберите режим и нажмите ENTER" };
    }
    if (kind === "mp") {
      const st = MP.connected ? (MP.inGame ? "в партии" : "в комнате " + MP.room) : "не подключён";
      const items = [
        { hdr: "ОНЛАЙН" },
        {
          label: "СОЗДАТЬ КОМНАТУ — КООПЕРАТИВ (одна база на двоих)",
          right: "хост", act: () => this.mpCreate("coop")
        },
        {
          label: "СОЗДАТЬ КОМНАТУ — PvP (две базы, друг против друга)",
          right: "хост", act: () => this.mpCreate("pvp")
        },
        { label: "ПОДКЛЮЧИТЬСЯ ПО 4-ЗНАЧНОМУ КОДУ", act: () => this.mpJoin() },
        { label: "СПИСОК АКТИВНЫХ КОМНАТ", act: () => this.mpRooms() },
        { label: "ЧАТ", right: MP.chat.length ? MP.chat.length + " сообщ." : "пусто", act: () => this.openList("chat") },
        { label: "ОТКЛЮЧИТЬСЯ", cls: MP.connected ? "red" : "gray", act: () => { MP.leave(); this.renderList(); } },
        { hdr: "ЛОКАЛЬНО (на одной клавиатуре)" },
        {
          label: "КООПЕРАТИВ — ВДВОЁМ ЗАЩИЩАЕМ БАЗУ", right: "стрелки / WASD",
          act: () => this.startGame({ mode: "2p", level: this.levelSel })
        },
        {
          label: "PvP — ДВЕ БАЗЫ, ДРУГ ПРОТИВ ДРУГА", right: "дуэль",
          act: () => this.startGame({ mode: "pvp", level: this.levelSel })
        },
        { label: "ОДИН ПРОТИВ ИИ (без сети)", act: () => this.startGame({ mode: "1p", level: this.levelSel }) }
      ];
      if (MP.rooms && MP.rooms.length) {
        items.push({ hdr: "НАЙДЕННЫЕ КОМНАТЫ" });
        MP.rooms.forEach(r => items.push({
          label: `КОМНАТА ${r.code} — ${r.mode === "pvp" ? "PvP" : "кооп"}`,
          right: r.players + "/2", act: () => this.mpJoin(r.code)
        }));
      }
      return {
        title: "МУЛЬТИПЛЕЕР", items: items.map(x => Object.assign({ act: () => { } }, x)),
        sub: CFG.MP_SERVER
          ? `Сервер: ${CFG.MP_SERVER} — <span class="${MP.connected ? "grn" : "red"}">${st}</span>` +
            (MP.ping ? ` &nbsp; пинг ${MP.ping} мс` : "")
          : '<span class="red">CFG.MP_SERVER не задан — доступна только локальная игра</span>'
      };
    }
    if (kind === "chat") {
      /* История переписки: слева время, дальше имя и текст. Свои сообщения
         золотые, чужие белые, дни разделены заголовком с датой. */
      const items = [];
      const list = MP.chat.slice(-120);
      if (!list.length) items.push({ label: "СООБЩЕНИЙ ПОКА НЕТ", cls: "gray" });
      let lastDay = "";
      for (const m of list) {
        const d = new Date(m.t || 0);
        const day = isNaN(d) ? "" : d.toLocaleDateString();
        if (day && day !== lastDay) { items.push({ hdr: day }); lastDay = day; }
        const hh = ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
        items.push({ label: m.from + ": " + m.msg, right: hh, cls: m.mine ? "gold" : "" });
      }
      items.push({ hdr: "" });
      items.push({ label: "НАПИСАТЬ СООБЩЕНИЕ", act: () => this.mpChat() });
      items.push({ label: "СОХРАНИТЬ ПЕРЕПИСКУ В ФАЙЛ", act: () => this.exportChat() });
      items.push({
        label: "ОЧИСТИТЬ ПЕРЕПИСКУ", cls: "gray",
        act: () => { if (confirm("Удалить всю переписку?")) { MP.clearChat(); this.renderList(); } }
      });
      return {
        title: "ЧАТ", items: items.map(x => Object.assign({ act: () => { } }, x)),
        sub: MP.chat.length + " сообщений &nbsp; " +
          (MP.connected ? '<span class="grn">на связи</span>' : '<span class="red">офлайн — сообщения не уйдут</span>')
      };
    }
    if (kind === "news") {
      const items = [];
      for (const rel of CHANGELOG) {
        items.push({ hdr: "РЕВИЗИЯ " + rel.v + " — " + rel.d });
        for (const line of rel.items) items.push({ label: "• " + line, cls: "gray" });
      }
      return {
        title: "ЧТО НОВОГО", items: items.map(x => Object.assign({ act: () => { } }, x)),
        sub: "Текущая ревизия: <span class=\"gold\">" + CHANGELOG[0].v + "</span>"
      };
    }
    if (kind === "log") {
      const items = [];
      const last = Log.lines.slice(-150);
      if (!last.length) items.push({ label: "ЖУРНАЛ ПУСТ", cls: "gray" });
      for (const r of last) {
        const d = new Date(r.t);
        items.push({
          label: r.m, cls: r.l === "ERR" ? "red" : r.l === "WARN" ? "gold" : "gray",
          right: ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2) + ":" +
                 ("0" + d.getSeconds()).slice(-2)
        });
      }
      items.push({ hdr: "" });
      items.push({ label: "СОХРАНИТЬ ЖУРНАЛ В ФАЙЛ", act: () => this.exportLog() });
      items.push({ label: "ОЧИСТИТЬ ЖУРНАЛ", cls: "gray", act: () => { Log.clear(); this.renderList(); } });
      const errs = Log.lines.filter(r => r.l === "ERR").length;
      return {
        title: "ЖУРНАЛ СОБЫТИЙ", items: items.map(x => Object.assign({ act: () => { } }, x)),
        sub: Log.lines.length + " записей" + (errs ? ' &nbsp; <span class="red">ошибок: ' + errs + "</span>" : "")
      };
    }
    if (kind === "settings") {
      const st = SAVE.settings;
      const items = [
        { label: "ЗВУК", right: st.sound ? "ВКЛ" : "ВЫКЛ", act: () => { st.sound = Audio_.toggle(); persist(); this.renderList(); } },
        { label: "ГОЛОСОВОЕ УПРАВЛЕНИЕ", right: Voice.on ? "ВКЛ" : "ВЫКЛ", act: () => { Voice.toggle(); this.renderList(); } },
        { label: "ИМЯ ИГРОКА: " + SAVE.name, act: () => this.renameProfile() },
        { label: "ЧТО НОВОГО", right: "рев. " + CHANGELOG[0].v, act: () => this.openList("news") },
        {
          label: "ЖУРНАЛ СОБЫТИЙ", right: Log.lines.length + " зап.",
          cls: Log.lines.some(r => r.l === "ERR") ? "red" : "", act: () => this.openList("log")
        },
      ].map(x => Object.assign({ act: () => { } }, x));
      return { title: "НАСТРОЙКИ", items, sub: "Ревизия " + CHANGELOG[0].v + " — " + CHANGELOG[0].d };
    }
    if (kind === "gameover") {
      const g = this.lastGame;
      const items = [
        { label: "ИТОГОВЫЙ СЧЁТ", right: fmt(g.score), cls: "gold" },
        { label: "УРОВЕНЬ", right: g.levelIndex },
        { label: "УНИЧТОЖЕНО ВРАГОВ", right: g.stats.kills },
        { label: "ЗАРАБОТАНО МОНЕТ", right: "+" + g.coinsEarned + " 🪙", cls: "gold" },
        { hdr: "" },
        { label: "ИГРАТЬ СНОВА", act: () => this.startGame({ mode: g.mode, level: g.mode === "1p" || g.mode === "2p" ? g.levelIndex : 1 }) },
        { label: "В МАГАЗИН", act: () => this.openList("shop") },
        { label: "ГЛАВНОЕ МЕНЮ", act: () => this.show("menu") }
      ].map(x => Object.assign({ act: () => { } }, x));
      return { title: g.victory ? "ПОБЕДА!" : "GAME OVER", items, sub: "" };
    }
    return { title: "?", items: [] };
  },
  // Перерисовать открытый экран при ответе сервера
  cloudRefresh() { if (this.screen === "list" && (this.listKind === "lb" || this.listKind === "settings")) this.renderList(); },
  playerCard(p) {
    this.modal(`<h3>${p.name}</h3>
      <p>Лучший счёт: <span class="gold">${fmt(p.best)}</span></p>
      <p>Пройдено уровней: ${p.levels} &nbsp; Максимальный уровень: ${p.maxLevel}</p>
      <p>Уничтожено врагов: ${p.kills} &nbsp; Партий: ${p.games}</p>
      <p>Монет: <span class="gold">${fmt(p.coins)} 🪙</span> &nbsp; Куплено вещей: ${p.items}</p>
      <p>Достижений: ${p.ach} &nbsp; Время в игре: ${timeStr(p.time)}</p>
      <div class="btn" onclick="UI.closeModal()">ЗАКРЫТЬ</div>`);
  },
  cloudTransfer() {
    const code = Cloud.transferCode();
    navigator.clipboard?.writeText(code);
    this.modal(`<h3>ПЕРЕНОС ПРОФИЛЯ</h3>
      <p class="gray">Код скопирован. На другом устройстве: Настройки → «ВОЙТИ ПО КОДУ ПЕРЕНОСА».</p>
      <textarea style="width:100%;height:60px;background:#000;color:#0f0;font-size:10px">${code}</textarea>
      <div class="warn">Кто знает код — тот получит доступ к профилю. Не публикуйте его.</div>
      <div class="btn" onclick="UI.closeModal()">ОК</div>`);
  },
  showGameOver(g) { this.lastGame = g; this.openList("gameover"); this.sel = 5; this.renderList(); },
  /* --- Действия --- */
  startGame(opts) {
    this.show("game");
    new Game(opts);
    Audio_.init(); Audio_.resume();
  },
  saveProgress() {
    const g = Game.cur; if (!g) return;
    SAVE.progress = { mode: g.mode, level: g.levelIndex, score: g.score, lives: g.players.map(p => p.lives), stars: g.players.map(p => p.stars) };

  loadProgress() {
    const p = SAVE.progress;
    if (!p) { toast("Нет сохранённой игры", "#d05050"); return; }
    this.startGame({ mode: p.mode, level: p.level });
    setTimeout(() => {
      const g = Game.cur; if (!g) return;
      g.score = p.score || 0;
      g.players.forEach((pl, i) => { pl.lives = p.lives[i] ?? 3; pl.stars = p.stars[i] ?? 0; });
    }, 50);

  renameProfile() {
    const n = prompt("Имя игрока (до 12 символов):", SAVE.name);
    if (n) { SAVE.name = n.slice(0, 12).toUpperCase(); persist(); this.renderList(); }
  },
  resetProgress() {
    if (!confirm("Удалить ВЕСЬ прогресс, монеты и покупки? Действие необратимо.")) return;

  /* Выгрузка переписки обычным текстовым файлом — «сохранить и посмотреть» */
  exportChat() {
    if (!MP.chat.length) { toast("Переписка пуста"); return; }
    const lines = MP.chat.map(m => {
      const d = new Date(m.t || 0);
      const stamp = isNaN(d) ? "" : d.toLocaleDateString() + " " +
        ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
      return "[" + stamp + "] " + m.from + ": " + m.msg;
    });
    const text = "BATTLE CITY — чат\n" + "=".repeat(30) + "\n" + lines.join("\n") + "\n";
    navigator.clipboard?.writeText(text);
    const url = URL.createObjectURL(new Blob([text], { type: "text/plain;charset=utf-8" }));
    const a = document.createElement("a");
    a.href = url; a.download = "battle-city-chat.txt";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast("Переписка сохранена в файл и скопирована в буфер", "#70B050");

  exportLog() {

    navigator.clipboard?.writeText(text);
    const url = URL.createObjectURL(new Blob([text], { type: "text/plain;charset=utf-8" }));

  exportSave() {

  importSave() {

  /* Выбор флага. Был текстовый prompt со списком «1. РОССИЯ, 2. США…», где надо

    $("#flagBox").querySelectorAll(".card").forEach(el => {

  /* Редактор своего скина 8x8. Был текстовым: prompt на 36 символов, где надо
     было вслепую набрать строку из решёток. Теперь сетка, по которой рисуют
     мышью или пальцем, с живым превью танка рядом. */
  customSkinEditor() {
    const grid = (SAVE.equipped.custom && SAVE.equipped.custom.length === 8)
      ? SAVE.equipped.custom.map(r => r.padEnd(8, ".").slice(0, 8).split(""))
      : SKIN_ART.star.map(r => r.split(""));
    this.modal(`<h3>СВОЙ РИСУНОК</h3>
      <p class="gray">Рисуйте мышью или пальцем — превью справа обновляется сразу.</p>
      <div style="display:flex;gap:14px;align-items:center;justify-content:center;margin:8px 0">
        <div id="skGrid" style="display:grid;grid-template-columns:repeat(8,22px);gap:1px;background:#333;padding:1px"></div>
        <canvas id="skPrev" width="48" height="48"
                style="image-rendering:pixelated;width:96px;height:96px;background:#000;border:1px solid #333"></canvas>
      </div>
      <div class="btn" onclick="UI.saveCustomSkin()">СОХРАНИТЬ</div>
      <div class="btn" style="border-color:#888;color:#888" onclick="UI.closeModal()">ОТМЕНА</div>`);
    this._skin = grid;
    const box = $("#skGrid"), pv = $("#skPrev").getContext("2d");
    pv.imageSmoothingEnabled = false;
    let paint = 0;
    const redraw = () => {
      box.querySelectorAll("i").forEach((cell, i) => {
        cell.style.background = grid[(i / 8) | 0][i % 8] === "#" ? "#f8f8f8" : "#111";
      });
      pv.fillStyle = "#0a0a0a"; pv.fillRect(0, 0, 48, 48);
      drawTank(pv, 8, 8, 0, TANK_COLORS[SAVE.equipped.color] || TANK_COLORS.yellow,
        { art: "p1", trackPhase: 0, skin: "custom", skinData: grid.map(r => r.join("")) });
    };
    box.innerHTML = Array.from({ length: 64 }, () =>
      '<i style="display:block;width:22px;height:22px;cursor:crosshair"></i>').join("");
    box.querySelectorAll("i").forEach((cell, i) => {
      const r = (i / 8) | 0, c = i % 8;
      const put = () => { grid[r][c] = paint === 1 ? "#" : "."; redraw(); };
      cell.addEventListener("mousedown", e => {
        e.preventDefault(); paint = grid[r][c] === "#" ? 2 : 1; put();
      });
      cell.addEventListener("mouseenter", () => { if (paint) put(); });
      cell.addEventListener("touchstart", e => { e.preventDefault(); paint = grid[r][c] === "#" ? 2 : 1; put(); }, { passive: false });
    });
    window.addEventListener("mouseup", () => { paint = 0; }, { once: false });
    redraw();
  },
  saveCustomSkin() {
    SAVE.equipped.custom = this._skin.map(r => r.join(""));
    SAVE.equipped.skin = "custom";
    persist(); this.closeModal(); this.renderList();

  // Перерисовать экран мультиплеера, если он открыт (вызывается при событиях сети)

  tournament() {
    this.modal(`<h3>ТУРНИРНЫЙ РЕЖИМ</h3>
      <p>8 игроков, 5 раундов, побеждает набравший максимум очков.</p>
      <div class="warn">TODO: реализовать турнирную сетку и синхронизацию через сервер.<br>
      Клиентская часть (комнаты, коды, чат) уже готова в объекте MP.</div>
      <div class="btn" onclick="UI.closeModal()">ОК</div>`);
  },
  /* --- Модальные окна --- */
  modal(html) { $("#mbox").innerHTML = html; $("#modal").classList.add("on"); },
  closeModal() { $("#modal").classList.remove("on"); },

  /* --- РЕДАКТОР УРОВНЕЙ --- */
  buildEditor() {
    if (!this.editorData) this.editorData = Array.from({ length: 13 }, () => ".".repeat(13).split(""));
    const grid = $("#edgrid");
    if (!grid.dataset.built) {
      grid.innerHTML = "";
      for (let y = 0; y < 13; y++) for (let x = 0; x < 13; x++) {
        const d = document.createElement("div");
        d.dataset.x = x; d.dataset.y = y;
        const paint = () => { this.editorData[y][x] = this.editorTool; this.paintEditor(); };
        d.addEventListener("mousedown", paint);
        d.addEventListener("mouseenter", e => { if (e.buttons === 1) paint(); });
        d.addEventListener("touchstart", e => { e.preventDefault(); paint(); }, { passive: false });
        grid.appendChild(d);
      }
      // Рисование пальцем с протяжкой: определяем клетку под пальцем
      grid.addEventListener("touchmove", e => {
        e.preventDefault();
        const t = e.touches[0]; if (!t) return;
        const el = document.elementFromPoint(t.clientX, t.clientY);
        if (el && el.parentNode === grid && el.dataset.x !== undefined) {
          this.editorData[+el.dataset.y][+el.dataset.x] = this.editorTool;
          this.paintEditor();
        }
      }, { passive: false });
      grid.dataset.built = "1";
      const tools = [["B", "КИРПИЧ", NES.brickLight], ["T", "СТАЛЬ", NES.steel], ["R", "ВОДА", NES.water],
      ["F", "ЛЕС", NES.forestA], ["S", "ЛЁД", NES.snowB], [".", "ЛАСТИК", "#000"]];
      $("#edpal").innerHTML = tools.map(([c, n, col]) =>
        `<div data-t="${c}" class="${c === this.editorTool ? "on" : ""}"><span class="sw" style="background:${col}"></span>${n}</div>`).join("")
        + `<div style="border:0;color:#666;margin-top:6px">S — СОХРАНИТЬ<br>P — ИГРАТЬ<br>C — ОЧИСТИТЬ<br>E — КОД<br>I — ИМПОРТ</div>`;
      $("#edpal").addEventListener("click", e => {
        const t = e.target.closest("[data-t]"); if (!t) return;
        this.editorTool = t.dataset.t;
        $$("#edpal div").forEach(d => d.classList.toggle("on", d === t));
      });
    }
    this.paintEditor();
  },
  paintEditor() {
    const colors = { "B": NES.brickLight, "T": NES.steel, "R": NES.water, "F": NES.forestA, "S": NES.snowB, ".": "#000" };
    $$("#edgrid div").forEach(d => {
      const x = +d.dataset.x, y = +d.dataset.y;
      d.style.background = (x === 6 && y === 12) ? "#886600" : colors[this.editorData[y][x]];
    });
  },
  // Карта редактора -> формат оригинала: 13 строк по 26 символов (тип + hex-маска четвертей)
  editorRows() {
    return this.editorData.map((row, y) => row.map((ch, x) => {
      if (x === 6 && y === 12) return "Ef";        // орёл всегда в центре внизу
      return ch === "." ? ".." : ch + "f";
    }).join(""));
  },
  editorSave() {
    const name = prompt("Название уровня:", "МОЙ УРОВЕНЬ " + (SAVE.customLevels.length + 1));
    if (!name) return;
    SAVE.customLevels.push({ name: name.toUpperCase(), rows: this.editorRows(), date: today() });
    SAVE.stats.editorPublished = (SAVE.stats.editorPublished || 0) + 1;
    persist(); Ach.check(); toast("Уровень сохранён: " + name, "#70B050");
  },
  editorCode() {
    const code = btoa(this.editorRows().join(""));
    navigator.clipboard?.writeText(code);
    this.modal(`<h3>КОД УРОВНЯ</h3><p class="gray">Скопирован в буфер — поделитесь с друзьями:</p>
      <textarea style="width:100%;height:80px;background:#000;color:#0f0;font-size:9px">${code}</textarea>
      <div class="btn" onclick="UI.closeModal()">ОК</div>`);
  },
  editorImport() {
    const code = prompt("Вставьте код уровня:");
    if (!code) return;
    try {
      const s = atob(code.trim());
      if (s.length < 338) throw 0;
      this.editorData = [];
      for (let i = 0; i < 13; i++) {
        const line = s.slice(i * 26, i * 26 + 26), row = [];
        for (let x = 0; x < 13; x++) { const t = line[x * 2]; row.push(t === "." || t === "E" ? "." : t); }
        this.editorData.push(row);
      }
      this.paintEditor(); toast("Уровень загружен", "#70B050");
    } catch (e) { toast("Некорректный код", "#d05050"); }
  },

  /* --- Обработка клавиш во всех экранах --- */
  onKey(e) {
    const k = e.code;
    // Модальное окно
    if ($("#modal").classList.contains("on")) { if (k === "Escape" || k === "Enter") this.closeModal(); return; }
    if (this.screen === "game") {
      const g = Game.cur;
      if (!g) { if (k === "Escape") this.back(); return; }
      if (k === "KeyP") g.togglePause();
      if (k === "Escape") { if (g.state === "pause") { this.saveProgress(); this.back(); } else g.togglePause(); }
      if (k === "F2") this.saveProgress();
      return;
    }
    if (this.screen === "editor") {
      if (k === "Escape") this.show("menu");
      if (k === "KeyS") this.editorSave();
      if (k === "KeyP") this.startGame({ mode: "custom", level: 1, rows: this.editorRows() });
      if (k === "KeyC") { this.editorData = Array.from({ length: 13 }, () => ".".repeat(13).split("")); this.paintEditor(); }
      if (k === "KeyE") this.editorCode();
      if (k === "KeyI") this.editorImport();
      return;
    }
    const items = this.screen === "menu" ? this.menuItems : (this.list ? this.list.items : []);
    const nav = d => {
      let i = this.sel;
      for (let n = 0; n < items.length; n++) {
        i = (i + d + items.length) % items.length;
        if (items[i].hdr === undefined) break;
      }
      this.sel = i;
      Audio_.tone(440, 0.03, "square", 0.15);
      this.screen === "menu" ? this.buildMenu() : this.renderList();
    };
    // В магазине карточки лежат сеткой: вверх/вниз — на ряд, влево/вправо — на шаг
    const grid = this.screen === "list" && this.list && this.list.cards;
    if (k === "ArrowDown") nav(grid ? (this.cardCols || 1) : 1);
    else if (k === "ArrowUp") nav(grid ? -(this.cardCols || 1) : -1);
    else if (grid && k === "ArrowLeft") nav(-1);
    else if (grid && k === "ArrowRight") nav(1);
    else if (k === "ArrowLeft") { const it = items[this.sel]; if (it && it.left) it.left(); }
    else if (k === "ArrowRight") { const it = items[this.sel]; if (it && it.rightK) it.rightK(); }
    else if (k === "Enter" || k === "Space") {
      const it = items[this.sel];
      if (it && it.act) { Audio_.tone(880, 0.05, "square", 0.2); it.act(); }
    }
    else if (k === "Tab" && this.screen === "list" && this.list.tabs) {
      this.tab = (this.tab + (e.shiftKey ? -1 : 1) + this.list.tabs.length) % this.list.tabs.length;
      this.sel = 0; this.renderList();
    }
    else if (k === "Escape") { this.screen === "list" ? this.show("menu") : null; }
  }
};

/* ============================== 19. ГЛАВНЫЙ ЦИКЛ (60 FPS) ============================== */
const Loop = {
  ctx: null, last: 0, acc: 0, step: 1000 / CFG.FPS,
  start() {
    this.ctx = $("#game").getContext("2d", { alpha: false });
    this.ctx.imageSmoothingEnabled = false;
    this.last = performance.now();
    requestAnimationFrame(t => this.tick(t));
  },
  tick(t) {
    requestAnimationFrame(t2 => this.tick(t2));
    let dt = t - this.last; this.last = t;
    if (dt > 250) dt = 250;                 // защита от «прыжка» после сворачивания вкладки
    this.acc += dt;
    let steps = 0;
    while (this.acc >= this.step && steps < 5) {
      if (Game.cur) Game.cur.update();
      this.acc -= this.step; steps++;
    }
    // Отрисовка
    const ctx = this.ctx;
    if (Game.cur) Game.cur.draw(ctx);
    else { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, CFG.CW, CFG.CH); }
  }
};

/* ============================== 20. ЗАПУСК ============================== */
const isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
/* Две раскладки: обычная (поле + панель справа) и портретная для телефона
   (поле во всю ширину, панель узкой полосой снизу). Без этого на телефоне
   треть ширины занимала боковая панель, и поле выходило мелким. */
const LAYOUT = {
  wide: { CW: 544, CH: 448, OX: 16, OY: 16 },
  tall: { CW: 416, CH: 484, OX: 0, OY: 0 }
};
function applyLayout(portrait) {
  const L = portrait ? LAYOUT.tall : LAYOUT.wide;
  if (CFG.CW === L.CW && CFG.CH === L.CH) return;
  CFG.CW = L.CW; CFG.CH = L.CH; CFG.OX = L.OX; CFG.OY = L.OY; CFG.portrait = portrait;
  const st = $("#stage"), c = $("#game");
  st.style.width = L.CW + "px"; st.style.height = L.CH + "px";
  c.width = L.CW; c.height = L.CH;
  if (Loop.ctx) Loop.ctx.imageSmoothingEnabled = false;
  if (Game.cur) Game.cur.field.dirty = true;
}
function fitStage() {
  const vv = window.visualViewport;
  const vw = Math.round(vv ? vv.width : window.innerWidth);
  const vh = Math.round(vv ? vv.height : window.innerHeight);
  const portrait = vh > vw;
  applyLayout(isTouch && portrait);          // на телефоне в портрете — вертикальная раскладка
  const st = $("#stage");
  // На телефоне в портретной ориентации нижнюю часть экрана отдаём под джойстик,
  // а поле прижимаем к верху
  const reserve = (isTouch && portrait) ? Math.min(320, Math.max(190, Math.round(vh * 0.33))) : 0;
  // ВАЖНО: масштаб должен уметь опускаться ниже 1, иначе поле шириной 544 px
  // не помещается в экран телефона и обрезается по краям
  let scale = Math.min(vw / CFG.CW, (vh - reserve) / CFG.CH);
  if (!isTouch) scale = Math.max(0.25, Math.floor(scale * 4) / 4);  // на десктопе — кратно 0.25 для чёткости
  scale = Math.max(0.25, scale);
  st.style.transform = `translate(-50%,-50%) scale(${scale})`;
  st.style.top = (isTouch && portrait) ? Math.round(CFG.CH * scale / 2 + 8) + "px" : "50%";
  // На сенсорных устройствах интерфейс всегда крупнее, иначе меню не прочитать
  st.classList.toggle("big-ui", isTouch || scale < 0.92);
}
window.addEventListener("resize", fitStage);
window.addEventListener("orientationchange", () => setTimeout(fitStage, 250));
// Мобильные браузеры меняют высоту при появлении адресной строки
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", fitStage);
  window.visualViewport.addEventListener("scroll", fitStage);
}

function boot() {
  fitStage();
  buildPatterns();   // предрендер текстур местности
  Input.init();
  Audio_.enabled = SAVE.settings.sound !== false;
  Loop.start();
  UI.show("menu");
  // Ежедневный бонус за вход
  const b = dailyBonus();
  if (b) setTimeout(() => toast(`ЕЖЕДНЕВНЫЙ БОНУС +${b.amount} 🪙 (стрик ${b.streak} дн.)`, "#f0c020"), 700);
  Ach.check();
  // Онлайн — не блокирует запуск; при отсутствии сети остаёмся офлайн
  Cloud.init();            // локальная БД на вашем сервере, без сторонних сервисов
  // Автосохранение прогресса каждые 30 секунд
  setInterval(() => { if (Game.cur && Game.cur.state === "play") UI.saveProgress && SAVE.progress !== undefined && (SAVE.progress = { mode: Game.cur.mode, level: Game.cur.levelIndex, score: Game.cur.score, lives: Game.cur.players.map(p => p.lives), stars: Game.cur.players.map(p => p.stars) }, persist()); }, 30000);
  // Предупреждение о потере данных при закрытии во время игры
  window.addEventListener("beforeunload", () => { if (Game.cur) UI.saveProgress(); });
  console.log("%cBATTLE CITY 1990 — расширенная версия загружена", "color:#C09848;font-weight:bold");
  console.log("Облако: " + Cloud.status() + "");
}
document.addEventListener("DOMContentLoaded", boot);
</script>
</body>
</html>
