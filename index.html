/* --- Цвета оригинала (палитра NES) --- */
const NES = {
  brickShade: "#636363", brickDark: "#6B0800", brickLight: "#9C4A00",
  steel: "#ADADAD", steelLight: "#FFFFFF", steelShade: "#636363",
  water: "#4242FF", waterLight: "#B5EFEF",
  forestA: "#8CD600", forestB: "#005208", forestC: "#084A00",
  snowA: "#FFFFFF", snowB: "#ADADAD", snowC: "#636363",
  eagle: "#636363", eagleRed: "#6B0800", eagleBroken: "#9C4A00"
};
/* --- Предрендер повторяющихся текстур (ускоряет отрисовку и даёт точный рисунок) --- */
const PAT = {};
function makePattern(w, h, draw) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d")); return c;
}
function buildPatterns() {
  if (PAT.built) return;
  PAT.built = true;
  const P = 2;   // 1 «пиксель» оригинала = 2 px у нас
  // Сталь: 8x8 пикселей оригинала -> 16 px
  PAT.steel = makePattern(16, 16, x => {
    x.fillStyle = NES.steel; x.fillRect(0, 0, 16, 16);
    x.fillStyle = NES.steelLight; x.fillRect(4, 4, 8, 8);
    x.fillStyle = NES.steelShade;
    STEEL_SHADE.forEach((row, r) => row.split("").forEach((ch, c) => { if (ch === "#") x.fillRect(c * P, r * P, P, P); }));
  });
  // Вода: 2 кадра анимации, блок 16 пикселей оригинала -> 32 px (4 части по 16)
  const RIVER = [
    [[5, 0], [0, 2], [1, 3], [4, 3], [3, 4], [5, 4], [1, 6], [2, 7], [6, 7]],
    [[7, 0], [1, 1], [2, 2], [3, 3], [6, 3], [7, 4], [3, 5], [2, 6], [4, 6], [0, 7]]
  ];
  PAT.water = [0, 1].map(sh => makePattern(32, 32, x => {
    for (const [dx, dy] of [[0, 0], [16, 0], [0, 16], [16, 16]]) {
      x.fillStyle = NES.water; x.fillRect(dx, dy, 16, 16);
      x.fillStyle = NES.waterLight;
      for (const [px, py] of RIVER[sh]) x.fillRect(dx + px * P, dy + py * P, P, P);
    }
  }));
  // Лёд (снег)
  PAT.ice = makePattern(32, 32, x => {
    for (const [dx, dy] of [[0, 0], [16, 0], [0, 16], [16, 16]]) {
      x.fillStyle = NES.snowB; x.fillRect(dx, dy, 16, 16);
      const p = (px, py, col) => { x.fillStyle = col; x.fillRect(dx + px * P, dy + py * P, P, P); };
      p(0, 0, NES.snowC); p(3, 0, NES.snowA); p(4, 0, NES.snowC); p(0, 3, NES.snowA); p(0, 4, NES.snowC);
      for (let t = 0; t < 8; t++) p(t, 7 - t, NES.snowA);
      for (let t = 0; t < 7; t++) p(1 + t, 7 - t, NES.snowC);
      for (let t = 0; t < 4; t++) p(4 + t, 7 - t, NES.snowA);
      for (let t = 0; t < 3; t++) p(5 + t, 7 - t, NES.snowC);
    }
  });
  // Лес (кусты)
  const FOREST = ["dbbbcbad", "bbcacaca", "bbbccaaa", "cbbaabca", "bbacaaac", "bcbaaaaa", "aaaaacaa", "daacaaad"];
  const FSCHEME = { a: NES.forestA, b: NES.forestB, c: NES.forestC };
  PAT.forest = makePattern(32, 32, x => {
    for (const [dx, dy] of [[0, 0], [16, 0], [0, 16], [16, 16]])
      FOREST.forEach((row, r) => row.split("").forEach((ch, c) => {
        if (ch === "d") return;
        x.fillStyle = FSCHEME[ch]; x.fillRect(dx + c * P, dy + r * P, P, P);
      }));
  });
  // Орёл и разбитый орёл (16x16 пикселей оригинала -> 32 px)
  PAT.eagle = makePattern(32, 32, x => {
    EAGLE_ART.forEach((row, r) => row.split("").forEach((ch, c) => {
      if (ch === ".") return;
      x.fillStyle = ch === "R" ? NES.eagleRed : NES.eagle;
      x.fillRect(c * P, r * P, P, P);
    }));
  });
  PAT.eagleBroken = makePattern(32, 32, x => {
    EAGLE_BROKEN_ART.forEach((row, r) => row.split("").forEach((ch, c) => {
      if (ch === ".") return;
      x.fillStyle = ch === "B" ? NES.eagleBroken : NES.eagle;
      x.fillRect(c * P, r * P, P, P);
    }));
  });
}
buildPatterns();   // текстуры готовим сразу, чтобы отрисовка не зависела от порядка запуска

// Орёл-база
function drawEagle(ctx, x, y, destroyed) {
  ctx.fillStyle = "#000"; ctx.fillRect(x, y, 32, 32);
  ctx.drawImage(destroyed ? PAT.eagleBroken : PAT.eagle, x, y);
}
// Кирпичный «юнит» 8x8 px — рисунок зависит от чётности клетки (как в оригинале)
function drawBrickUnit(ctx, px, py, ux, uy) {
  const shape = ((ux + uy) % 2 === 0);
  ctx.fillStyle = NES.brickShade; ctx.fillRect(px, py, 8, 8);
  ctx.fillStyle = NES.brickDark; ctx.fillRect(px + (shape ? 0 : 2), py, shape ? 8 : 6, 6);
  ctx.fillStyle = NES.brickLight; ctx.fillRect(px + (shape ? 0 : 4), py + 2, shape ? 8 : 4, 4);
}

/* ================================ ПОЛЕ БОЯ ================================ */
class Field {
  constructor() {
    this.g = new Uint8Array(CFG.UCOLS * CFG.UCOLS);
    this.baseX = 24; this.baseY = 48;      // левый-верхний юнит орла (4x4 юнита = 32 px)
    this.baseDead = false;
    this.waterPhase = 0;
    this.cache = document.createElement("canvas");
    this.cache.width = CFG.FIELD; this.cache.height = CFG.FIELD;
    this.cctx = this.cache.getContext("2d");
    this.dirty = true; this.waterUnits = []; this.forestUnits = [];
  }
  at(x, y) { return (x < 0 || y < 0 || x >= CFG.UCOLS || y >= CFG.UCOLS) ? T.STEEL : this.g[y * CFG.UCOLS + x]; }
  set(x, y, v) {
    if (x < 0 || y < 0 || x >= CFG.UCOLS || y >= CFG.UCOLS) return;
    const i = y * CFG.UCOLS + x;
    if (this.g[i] !== v) { this.g[i] = v; this.dirty = true; }
  }
  fillRectUnits(ux, uy, w, h, v) { for (let b = 0; b < h; b++) for (let a = 0; a < w; a++) this.set(ux + a, uy + b, v); }
  /* Загрузка карты.
     Новый формат (оригинал): 13 строк по 26 символов, клетка = тип + hex-маска четвертей.
     Старый формат (уровни из редактора v1): 13 строк по 13 символов, по символу на клетку. */
  load(rows) {
    this.g.fill(T.EMPTY); this.baseDead = false; this.dirty = true;
    const isNew = rows[0] && rows[0].length >= 26;
    for (let cy = 0; cy < 13; cy++) {
      const line = rows[cy] || "";
      for (let cx = 0; cx < 13; cx++) {
        let type, mask;
        if (isNew) {
          const t = line[cx * 2], h = line[cx * 2 + 1];
          if (!t || t === ".") continue;
          type = CHAR2TILE[t]; mask = parseInt(h, 16);
          if (isNaN(mask)) mask = 15;
        } else {
          const ch = line[cx];
          if (!ch || ch === ".") continue;
          type = ch === "S" ? T.STEEL : (ch === "W" ? T.WATER : (ch === "T" ? T.TREE : (ch === "I" ? T.ICE : CHAR2TILE[ch])));
          mask = 15;
        }
        if (type === undefined || type === T.EMPTY) continue;
        const ux = cx * 4, uy = cy * 4;
        if (type === T.BRICK || type === T.STEEL) {
          // Маска четвертей: 1=лево-верх, 2=право-верх, 4=лево-низ, 8=право-низ
          if (mask & 1) this.fillRectUnits(ux, uy, 2, 2, type);
          if (mask & 2) this.fillRectUnits(ux + 2, uy, 2, 2, type);
          if (mask & 4) this.fillRectUnits(ux, uy + 2, 2, 2, type);
          if (mask & 8) this.fillRectUnits(ux + 2, uy + 2, 2, 2, type);
        } else {
          this.fillRectUnits(ux, uy, 4, 4, type);   // вода/лес/лёд/орёл — всегда вся клетка
          if (type === T.BASE) { this.baseX = ux; this.baseY = uy; }
        }
      }
    }
    // Точки появления танков всегда свободны
    [[0, 0], [6, 0], [12, 0], [4, 12], [8, 12]].forEach(([cx, cy]) => this.fillRectUnits(cx * 4, cy * 4, 4, 4, T.EMPTY));
    this.fillRectUnits(this.baseX, this.baseY, 4, 4, T.BASE);
  }
  // Юниты кирпичной «коробки» вокруг орла (как в оригинале: U-образная стенка)
  shieldUnits() {
    const bx = this.baseX, by = this.baseY, list = [];
    for (let x = bx - 2; x < bx + 6; x++) { list.push([x, by - 2]); list.push([x, by - 1]); }
    for (let y = by; y < by + 4; y++) {
      list.push([bx - 2, y]); list.push([bx - 1, y]);
      list.push([bx + 4, y]); list.push([bx + 5, y]);
    }
    return list;
  }
  fortify(tile) { for (const [x, y] of this.shieldUnits()) if (this.at(x, y) !== T.BASE) this.set(x, y, tile); }
  isSolidForTank(t) { return t === T.BRICK || t === T.STEEL || t === T.WATER || t === T.BASE; }
  canMove(x, y, w, h) {
    if (x < 0 || y < 0 || x + w > CFG.FIELD || y + h > CFG.FIELD) return false;
    const U = CFG.UNIT;
    const x0 = Math.floor(x / U), y0 = Math.floor(y / U);
    const x1 = Math.floor((x + w - 1) / U), y1 = Math.floor((y + h - 1) / U);
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++)
      if (this.isSolidForTank(this.at(tx, ty))) return false;
    return true;
  }
  onIce(x, y, w, h) {
    const U = CFG.UNIT;
    return this.at(Math.floor((x + w / 2) / U), Math.floor((y + h / 2) / U)) === T.ICE;
  }
  /* Попадание пули.
     Ширина «просеки» — 8 NES-px (2 юнита), а ГЛУБИНА — ровно один юнит (4 NES-px),
     как в оригинале: поэтому кирпичная клетка прошивается за 4 выстрела, а защита
     орла толщиной в пол-клетки — за два. Раньше пуля задевала сразу два ряда и
     сносила защиту базы одним снарядом.                                            */
  bulletHit(b, power) {
    const res = { hit: false, base: false, destroyed: 0 };
    const U = CFG.UNIT;
    let x0, x1, y0, y1;
    // Просека выравнивается по сетке четвертей клетки (пара юнитов), как в оригинале
    const pair = c => { const u = Math.floor(c / U); return u - (u % 2); };
    if (b.dir === 0 || b.dir === 2) {
      const edge = b.dir === 0 ? b.y : b.y + b.h - 1;
      y0 = y1 = Math.floor(edge / U);            // глубина — ровно один юнит (4 px NES)
      x0 = pair(b.x + b.w / 2); x1 = x0 + 1;     // ширина — два юнита (8 px NES)
    } else {
      const edge = b.dir === 3 ? b.x : b.x + b.w - 1;
      x0 = x1 = Math.floor(edge / U);
      y0 = pair(b.y + b.h / 2); y1 = y0 + 1;
    }
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
      const t = this.at(tx, ty);
      if (t === T.BASE) { res.hit = true; res.base = true; }
      else if (t === T.BRICK) { this.set(tx, ty, T.EMPTY); res.hit = true; res.destroyed++; }
      else if (t === T.STEEL) {
        res.hit = true; res.steel = true;
        // Сталь ломается только усиленной пулей и уходит целым куском 2x2 юнита
        if (power >= 2) {
          const sx = tx - (tx % 2), sy = ty - (ty % 2);
          for (let a = 0; a < 2; a++) for (let c = 0; c < 2; c++)
            if (this.at(sx + a, sy + c) === T.STEEL) { this.set(sx + a, sy + c, T.EMPTY); res.destroyed++; }
        }
      }
    }
    if (b.x < 0 || b.y < 0 || b.x + b.w > CFG.FIELD || b.y + b.h > CFG.FIELD) { res.hit = true; res.steel = true; }
    return res;
  }
  destroyBase() {
    this.baseDead = true;
    this.fillRectUnits(this.baseX, this.baseY, 4, 4, T.EMPTY);
  }
  /* --- Отрисовка --- */
  drawBack(ctx, ox, oy) {
    if (this.dirty) this.rebuildCache();
    ctx.drawImage(this.cache, ox, oy);
    // Вода анимируется двумя кадрами, как в оригинале
    this.waterPhase += 0.02;
    const frame = PAT.water[Math.floor(this.waterPhase) % 2];
    for (const [x, y] of this.waterUnits)
      ctx.drawImage(frame, (x % 4) * 8, (y % 4) * 8, 8, 8, ox + x * 8, oy + y * 8, 8, 8);
    drawEagle(ctx, ox + this.baseX * 8, oy + this.baseY * 8, this.baseDead);
  }
  rebuildCache() {
    const ctx = this.cctx;
    ctx.clearRect(0, 0, CFG.FIELD, CFG.FIELD);
    this.waterUnits = []; this.forestUnits = [];
    for (let y = 0; y < CFG.UCOLS; y++) for (let x = 0; x < CFG.UCOLS; x++) {
      const t = this.g[y * CFG.UCOLS + x];
      if (!t || t === T.BASE) continue;
      const px = x * 8, py = y * 8;
      if (t === T.BRICK) drawBrickUnit(ctx, px, py, x, y);
      else if (t === T.STEEL) ctx.drawImage(PAT.steel, (x % 2) * 8, (y % 2) * 8, 8, 8, px, py, 8, 8);
      else if (t === T.ICE) ctx.drawImage(PAT.ice, (x % 4) * 8, (y % 4) * 8, 8, 8, px, py, 8, 8);
      else if (t === T.WATER) this.waterUnits.push([x, y]);
      else if (t === T.TREE) this.forestUnits.push([x, y]);
    }
    this.dirty = false;
  }
  // Лес рисуется ПОВЕРХ танков — в нём можно спрятаться
  drawFront(ctx, ox, oy) {
    for (const [x, y] of this.forestUnits)
      ctx.drawImage(PAT.forest, (x % 4) * 8, (y % 4) * 8, 8, 8, ox + x * 8, oy + y * 8, 8, 8);
  }
}

/* ============================== 10. ИГРОВЫЕ ОБЪЕКТЫ ============================== */
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];   // 0=вверх 1=вправо 2=вниз 3=влево

/* --- Пуля --- */
class Bullet {
  constructor(owner, x, y, dir, power, style) {
    this.owner = owner; this.x = x; this.y = y; this.w = 8; this.h = 8;
    this.dir = dir; this.power = power; this.style = style || "normal";
    this.speed = owner.isPlayer ? (owner.stars >= 1 ? 6 : 4.2)
      : (ENEMY_TYPES[owner.kind] && ENEMY_TYPES[owner.kind].fastBullet ? 6 : 4);
    this.dead = false; this.traveled = 0;
    this.maxRange = 9999;
    if (owner.isPlayer) this.maxRange = 640 * (1 + (SAVE.upgrades.range || 0) * 0.15);
    this.trail = [];
  }
  update(g) {
    for (let i = 0; i < 2; i++) {   // подшаг для точной коллизии на высокой скорости
      const st = this.speed / 2;
      this.x += DX[this.dir] * st; this.y += DY[this.dir] * st; this.traveled += st;
      if (this.traveled > this.maxRange) { this.dead = true; return; }
      const r = g.field.bulletHit(this, this.power);
      if (r.base && !g.field.baseDead) { g.baseDestroyed(); this.dead = true; return; }
      if (r.destroyed) { g.stats.blocks += r.destroyed; SAVE.stats.blocks += r.destroyed; }
      if (r.hit) {
        this.dead = true;
        g.addExplosion(this.x - 8, this.y - 8, "small");
        // Звук зависит от препятствия: сталь/край поля звучат глуше и громче
        if (this.owner.isPlayer) (r.steel && !r.destroyed) ? Audio_.hitSteel() : Audio_.hitBrick();
        return;
      }
    }
    this.trail.push({ x: this.x, y: this.y }); if (this.trail.length > 6) this.trail.shift();
  }
  draw(ctx, ox, oy) {
    const x = ox + this.x, y = oy + this.y;
    const S = this.style;
    if (S === "laser") {           // лазер — красный луч
      ctx.fillStyle = "rgba(255,60,60,.5)";
      this.trail.forEach((t, i) => ctx.fillRect(ox + t.x + 2, oy + t.y + 2, 4, 4));
      ctx.fillStyle = "#ff4040"; ctx.fillRect(x + 1, y + 1, 6, 6);
      ctx.fillStyle = "#fff"; ctx.fillRect(x + 3, y + 3, 2, 2);
    } else if (S === "plasma") {   // плазма — зелёная с искрами
      ctx.fillStyle = "#70ff70"; ctx.fillRect(x + 1, y + 1, 6, 6);
      ctx.fillStyle = "#c0ffc0";
      for (let i = 0; i < 3; i++) ctx.fillRect(x + rnd(8) - 2, y + rnd(8) - 2, 2, 2);
    } else if (S === "fire") {     // огненный трассер
      this.trail.forEach((t, i) => {
        ctx.fillStyle = i > 3 ? "#ffd020" : "#e05010";
        ctx.fillRect(ox + t.x + 2, oy + t.y + 2, 4, 4);
      });
      ctx.fillStyle = "#fff060"; ctx.fillRect(x + 1, y + 1, 6, 6);
    } else if (S === "electro") {  // электрический — синие разряды
      ctx.fillStyle = "#40a0ff"; ctx.fillRect(x + 1, y + 1, 6, 6);
      ctx.strokeStyle = "#c0e0ff"; ctx.lineWidth = 1; ctx.beginPath();
      for (let i = 0; i < 3; i++) { ctx.moveTo(x + 4, y + 4); ctx.lineTo(x + 4 + rnd(14) - 7, y + 4 + rnd(14) - 7); }
      ctx.stroke();
    } else if (S === "firework") {
      ctx.fillStyle = ["#ff40ff", "#40ffff", "#ffff40"][Math.floor(now() / 60) % 3];
      ctx.fillRect(x, y, 8, 8); ctx.fillStyle = "#fff"; ctx.fillRect(x + 2, y + 2, 4, 4);
    } else {                        // обычный снаряд
      ctx.fillStyle = "#e8e8e8"; ctx.fillRect(x + 2, y + 2, 4, 4);
      ctx.fillStyle = "#a0a0a0";
      if (this.dir === 0) ctx.fillRect(x + 3, y, 2, 2); if (this.dir === 2) ctx.fillRect(x + 3, y + 6, 2, 2);
      if (this.dir === 3) ctx.fillRect(x, y + 3, 2, 2); if (this.dir === 1) ctx.fillRect(x + 6, y + 3, 2, 2);
    }
  }
}

/* --- Базовый танк --- */
class Tank {
  constructor(g, x, y, dir) {
    this.g = g; this.x = x; this.y = y; this.w = 32; this.h = 32;
    this.dir = dir; this.moving = false; this.speed = 1.0;
    this.bullets = 0; this.maxBullets = 1; this.cooldown = 0; this.reloadTime = 22;
    this.dead = false; this.stars = 0; this.hp = 1; this.armor = 0;
    this.trackPhase = 0; this.spawnTimer = 0; this.shield = 0; this.slide = 0;
    this.isPlayer = false; this.colors = TANK_COLORS.e_basic;
  }
  rect() { return { x: this.x, y: this.y, w: this.w, h: this.h }; }
  // Попытка движения; возвращает true если сдвинулись
  tryMove(dir, dist) {
    const nx = this.x + DX[dir] * dist, ny = this.y + DY[dir] * dist;
    // Скругление к сетке 8px при повороте (как в оригинале)
    let ax = nx, ay = ny;
    if (dir === 0 || dir === 2) ax = Math.round(nx / 8) * 8;
    else ay = Math.round(ny / 8) * 8;
    if (!this.g.field.canMove(ax, ay, this.w, this.h)) return false;
    if (this.g.tankAt(ax, ay, this)) return false;
    this.x = ax; this.y = ay;
    return true;
  }
  move(dir) {
    const turned = this.dir !== dir;
    this.dir = dir; this.moving = true;
    const ok = this.tryMove(dir, this.speed);
    if (ok) this.trackPhase += this.speed * 0.12;
    // Лёд: инерция скольжения
    if (this.g.field.onIce(this.x, this.y, this.w, this.h)) this.slide = 12;
    return ok;
  }
  updateSlide() {
    if (this.slide > 0 && !this.moving) { this.slide--; this.tryMove(this.dir, this.speed * 0.7); }
  }
  fire() {
    if (this.cooldown > 0 || this.bullets >= this.maxBullets) return null;
    const cx = this.x + 16 + DX[this.dir] * 14 - 4, cy = this.y + 16 + DY[this.dir] * 14 - 4;
    const b = new Bullet(this, cx, cy, this.dir, this.isPlayer ? (this.stars >= 3 ? 2 : 1) : (this.kind === "boss" ? 2 : 1),
      this.isPlayer ? SAVE.equipped.shot : "normal");
    this.bullets++; this.cooldown = this.reloadTime;
    this.g.bullets.push(b);
    if (this.isPlayer) {
      SAVE.stats.bulletsFired++;
      const s = SAVE.equipped.shot;
      if (s === "laser") Audio_.laser(); else if (s === "plasma") Audio_.plasma(); else Audio_.shoot();
    } else Audio_.shootEnemy();
    return b;
  }
  takeDamage(dmg, from) {
    if (this.shield > 0) return false;
    if (this.armor > 0) { this.armor--; Audio_.hitWall(); return false; }
    this.hp -= dmg;
    if (this.hp <= 0) { this.dead = true; return true; }
    Audio_.hitWall();
    return false;
  }
  draw(ctx, ox, oy) {
    if (this.spawnTimer > 0) { this.drawSpawn(ctx, ox, oy); return; }
    drawTank(ctx, ox + this.x, oy + this.y, this.dir, this.colors, {
      trackPhase: Math.floor(this.trackPhase) % 2, stars: this.isPlayer ? this.stars : 0,
      shield: this.shield > 0, armor: this.armor, skin: this.isPlayer ? SAVE.equipped.skin : null,
      skinData: this.isPlayer ? this.skinData : null
    });
  }
  // Анимация появления (вращающаяся звезда)
  drawSpawn(ctx, ox, oy) {
    const p = Math.floor(this.spawnTimer / 4) % 4;
    const cx = ox + this.x + 16, cy = oy + this.y + 16;
    ctx.fillStyle = p % 2 ? "#f8f8f8" : "#5da0f0";
    const r = [4, 10, 14, 8][p];
    ctx.fillRect(cx - r, cy - 2, r * 2, 4); ctx.fillRect(cx - 2, cy - r, 4, r * 2);
    ctx.fillRect(cx - r / 2, cy - r / 2, r, r);
  }
}

/* --- Игрок --- */
class Player extends Tank {
  constructor(g, idx, x, y) {
    super(g, x, y, 0);
    this.isPlayer = true; this.idx = idx;
    this.startX = x; this.startY = y;
    this.lives = g.mode === "survival" ? 1 : 3;
    this.stars = 0; this.spawnTimer = 60; this.shield = 180;
    this.score = 0; this.applyUpgrades();
    this.colors = idx === 0 ? TANK_COLORS[SAVE.equipped.color] || TANK_COLORS.yellow : TANK_COLORS.green;
    if (idx === 1) this.colors = TANK_COLORS.green;
    this.skinData = SAVE.equipped.skin === "flag"
      ? (FLAGS.find(f => f.id === SAVE.equipped.flag) || FLAGS[0]).c
      : (SAVE.equipped.skin === "custom" ? SAVE.equipped.custom : null);
    this.trail = [];
  }
  applyUpgrades() {
    const u = SAVE.upgrades;
    this.baseSpeed = 1.05 * (1 + (u.speed || 0) * 0.10);
    this.speed = this.baseSpeed;
    this.armorMax = (u.armor || 0); this.armor = this.armorMax;
    this.reloadTime = Math.round(22 * (1 - (u.reload || 0) * 0.20));
  }
  update(input) {
    if (this.spawnTimer > 0) { this.spawnTimer--; return; }
    if (this.cooldown > 0) this.cooldown--;
    if (this.shield > 0) this.shield--;
    this.moving = false;
    const i = input;
    let d = -1;
    if (i.up) d = 0; else if (i.right) d = 1; else if (i.down) d = 2; else if (i.left) d = 3;
    if (d >= 0) { this.move(d); }
    else this.updateSlide();
    if (i.fire) this.fire();
    // Скорость зависит от «звёзд» прокачки
    this.speed = this.baseSpeed * (1 + this.stars * 0.12);
    this.maxBullets = this.stars >= 2 ? 2 : 1;
    // След от танка (купленный эффект)
    if (this.moving && SAVE.owned.effect.includes("trail") && chance(0.4))
      this.g.particles.push({ x: this.x + 8 + rnd(16), y: this.y + 8 + rnd(16), vx: 0, vy: 0, life: 20, c: "#808080", s: 3 });
  }
  powerUp(type) {
    if (type === "star") { this.stars = Math.min(3, this.stars + 1); Audio_.bonus(); }
    else if (type === "tank") { this.lives++; Audio_.bonus(); }
    else if (type === "shield") { this.shield = 300; Audio_.bonus(); }   // 5 секунд неуязвимости
    else if (type === "shovel") { this.g.fortifyBase(); Audio_.bonus(); }
    else if (type === "coin") { addCoins(25, "бонус-монета"); }
    SAVE.stats.bonusesTaken[type] = (SAVE.stats.bonusesTaken[type] || 0) + 1;
  }
  respawn() {
    this.x = this.startX; this.y = this.startY; this.dir = 0;
    this.dead = false; this.hp = 1; this.spawnTimer = 60; this.shield = 180;
    this.stars = Math.max(0, this.stars - 1);
    this.armor = this.armorMax; this.bullets = 0;
  }
}

/* --- Враг --- */
const ENEMY_TYPES = {
  // Оригинальные 4 типа врагов Battle City + босс нашего расширения
  basic: { speed: 0.85, hp: 1, score: 100, coins: 10, colors: "e_basic", fireRate: 0.006 },
  fast: { speed: 1.75, hp: 1, score: 200, coins: 25, colors: "e_fast", fireRate: 0.007 },
  power: { speed: 1.0, hp: 1, score: 300, coins: 40, colors: "e_power", fireRate: 0.013, fastBullet: true },
  armor: { speed: 0.85, hp: 4, score: 400, coins: 60, colors: "e_armor", fireRate: 0.010 },
  boss: { speed: 0.7, hp: 5, score: 1000, coins: 50, colors: "e_boss", fireRate: 0.021 }
};
// Броневой танк в оригинале меняет цвет по мере повреждений
const ARMOR_COLORS = ["e_armor_1", "e_armor_2", "e_armor_3", "e_armor"];
class Enemy extends Tank {
  constructor(g, x, y, kind, bonus) {
    super(g, x, y, 2);
    const t = ENEMY_TYPES[kind] || ENEMY_TYPES.basic;
    this.kind = kind; this.speed = t.speed * (1 + g.difficulty * 0.15);
    this.hp = t.hp; this.maxHp = t.hp; this.score = t.score; this.coins = t.coins;
    this.colors = TANK_COLORS[t.colors]; this.fireRate = t.fireRate;
    this.bonus = !!bonus;                 // «красный» танк с бонусом
    this.spawnTimer = 60; this.dirTimer = 0; this.reloadTime = kind === "boss" ? 26 : 40;
    this.maxBullets = kind === "boss" ? 2 : 1;
    this.frozen = 0;
  }
  update() {
    if (this.spawnTimer > 0) { this.spawnTimer--; return; }
    if (this.cooldown > 0) this.cooldown--;
    if (this.frozen > 0) { this.frozen--; return; }
    this.moving = true;
    if (this.dirTimer-- <= 0) this.chooseDir();
    if (!this.move(this.dir)) this.dirTimer = 0;   // упёрлись — меняем направление
    if (Math.random() < this.fireRate * (1 + this.g.difficulty * 0.4)) this.fire();
  }
  /* ИИ выбора направления — как в оригинале: движение преимущественно случайное
     со смещением вниз, и лишь изредка танк идёт целенаправленно к игроку или к орлу.
     Раньше враг шёл к базе в 55% случаев и сносил её за минуту — это не поведение
     оригинальной игры.                                                              */
  chooseDir() {
    this.dirTimer = 30 + rnd(60);
    // Доля осмысленных ходов растёт со сложностью, но остаётся небольшой
    const aim = 0.12 + this.g.difficulty * 0.06;
    if (chance(aim)) {
      const target = chance(0.35) ? this.g.baseTarget() : this.g.nearestPlayer(this);
      if (target) {
        const dx = target.x - this.x, dy = target.y - this.y;
        const opts = [];
        if (Math.abs(dx) > 8) opts.push(dx > 0 ? 1 : 3);
        if (Math.abs(dy) > 8) opts.push(dy > 0 ? 2 : 0);
        if (opts.length) { this.dir = pick(opts); return; }
      }
    }
    // Иначе — равномерно случайное направление. Любой перекос «вниз» превращает
    // врагов в поток, идущий прямо на орла: при уклоне 50% база гибла за минуту
    // даже без участия игрока (замерено), при равномерном выборе — выживает.
    this.dir = rnd(4);
  }
  draw(ctx, ox, oy) {
    if (this.spawnTimer > 0) { this.drawSpawn(ctx, ox, oy); return; }
    // Бонусный танк мигает красным
    let base = this.colors;
    if (this.kind === "armor") base = TANK_COLORS[ARMOR_COLORS[clamp(this.hp - 1, 0, 3)]];
    const c = this.bonus && Math.floor(now() / 120) % 2 ? TANK_COLORS.bonusFlash : base;
    drawTank(ctx, ox + this.x, oy + this.y, this.dir, c, { trackPhase: Math.floor(this.trackPhase) % 2 });
    if (this.kind === "armor") { // броневой: цвет по остатку HP, полоска не нужна
      return;
    }
    if (this.kind === "boss") { // полоска HP
      const w = 28 * (this.hp / this.maxHp);
      ctx.fillStyle = "#400"; ctx.fillRect(ox + this.x + 2, oy + this.y - 5, 28, 3);
      ctx.fillStyle = this.hp > this.maxHp / 2 ? "#40d040" : "#e04040";
      ctx.fillRect(ox + this.x + 2, oy + this.y - 5, w, 3);
    }
  }
}

/* --- Бонус --- */
const POWERUP_TYPES = ["star", "tank", "shield", "shovel", "coin"];
class PowerUp {
  constructor(x, y, type) { this.x = x; this.y = y; this.w = 32; this.h = 32; this.type = type; this.life = 900; this.dead = false; }
  update() { if (--this.life <= 0) this.dead = true; }
  draw(ctx, ox, oy) {
    if (Math.floor(this.life / 8) % 2 === 0 && this.life < 180) return;   // мигание перед исчезновением
    const x = ox + this.x, y = oy + this.y, s = 2;
    const px = (a, b, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x + a * s, y + b * s, w * s, h * s); };
    px(0, 0, 16, 16, "#000"); px(1, 1, 14, 14, "#f8f8f8"); px(2, 2, 12, 12, "#000");
    const t = this.type;
    if (t === "star") { px(7, 3, 2, 3, "#f0c020"); px(4, 6, 8, 2, "#f0c020"); px(5, 8, 6, 4, "#f0c020"); px(4, 12, 3, 1, "#f0c020"); px(9, 12, 3, 1, "#f0c020"); }
    else if (t === "tank") { px(4, 5, 8, 6, "#70B050"); px(3, 5, 1, 6, "#70B050"); px(12, 5, 1, 6, "#70B050"); px(7, 2, 2, 4, "#70B050"); }
    else if (t === "shield") { px(4, 3, 8, 6, "#5da0f0"); px(5, 9, 6, 2, "#5da0f0"); px(7, 11, 2, 2, "#5da0f0"); }
    else if (t === "shovel") { px(7, 2, 2, 7, "#C09848"); px(5, 9, 6, 4, "#C09848"); }
    else if (t === "coin") { px(4, 3, 8, 10, "#f0c020"); px(6, 5, 4, 6, "#a07800"); px(5, 4, 1, 8, "#fff090"); }
  }
}

/* --- Взрыв (6 фаз) --- */
class Explosion {
  constructor(x, y, big, colorful) {
    this.x = x; this.y = y; this.big = big; this.frame = 0; this.dead = false;
    this.colorful = colorful;
    this.tint = colorful ? pick(["#ff40ff", "#40ffff", "#ffff40", "#40ff40", "#ff8040"]) : null;
  }
  update() { this.frame += 0.35; if (this.frame >= 6) this.dead = true; }
  draw(ctx, ox, oy) {
    const f = Math.floor(this.frame), x = ox + this.x, y = oy + this.y;
    const sizes = [8, 14, 20, 26, 20, 12];
    const r = sizes[clamp(f, 0, 5)] * (this.big ? 1.6 : 1);
    const cx = x + 16, cy = y + 16;
    const c1 = this.tint || "#f0c020", c2 = this.tint || "#e05010", c3 = "#f8f8f8";
    ctx.fillStyle = c2; ctx.fillRect(cx - r / 2, cy - r / 2, r, r);
    ctx.fillStyle = c1; ctx.fillRect(cx - r / 3, cy - r / 2.2, r / 1.5, r / 1.1);
    if (f < 3) { ctx.fillStyle = c3; ctx.fillRect(cx - r / 6, cy - r / 6, r / 3, r / 3); }
    // «Осколки» на последних кадрах
    if (f >= 3) { ctx.fillStyle = c2; for (let i = 0; i < 4; i++) ctx.fillRect(cx + Math.cos(i * 1.6) * r, cy + Math.sin(i * 1.6) * r, 3, 3); }
  }
}

/* ============================== 11. УПРАВЛЕНИЕ (клавиатура / геймпад / сенсор / голос) ============================== */
const Input = {
  keys: {},
  p1: { up: 0, down: 0, left: 0, right: 0, fire: 0 },
  p2: { up: 0, down: 0, left: 0, right: 0, fire: 0 },
  touch: { up: 0, down: 0, left: 0, right: 0, fire: 0, active: false },
  voice: { dir: -1, fire: false, until: 0 },
  init() {
    window.addEventListener("keydown", e => {
      this.keys[e.code] = 1;
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", "Enter", "Tab"].includes(e.code)) e.preventDefault();
      Audio_.init(); Audio_.resume();
      UI.onKey(e);
    });
    window.addEventListener("keyup", e => { this.keys[e.code] = 0; });
    window.addEventListener("blur", () => { this.keys = {}; });
    this.initTouch();
  },
  poll() {
    const k = this.keys;
    // Игрок 1: стрелки + Пробел
    this.p1.up = k["ArrowUp"] || 0; this.p1.down = k["ArrowDown"] || 0;
    this.p1.left = k["ArrowLeft"] || 0; this.p1.right = k["ArrowRight"] || 0;
    this.p1.fire = k["Space"] || 0;
    // Игрок 2: WASD + Enter
    this.p2.up = k["KeyW"] || 0; this.p2.down = k["KeyS"] || 0;
    this.p2.left = k["KeyA"] || 0; this.p2.right = k["KeyD"] || 0;
    this.p2.fire = k["Enter"] || 0;
    // Сенсор и голос подмешиваются к игроку 1
    if (this.touch.active) {
      this.p1.up |= this.touch.up; this.p1.down |= this.touch.down;
      this.p1.left |= this.touch.left; this.p1.right |= this.touch.right; this.p1.fire |= this.touch.fire;
    }
    if (this.voice.until > now()) {
      if (this.voice.dir === 0) this.p1.up = 1; if (this.voice.dir === 1) this.p1.right = 1;
      if (this.voice.dir === 2) this.p1.down = 1; if (this.voice.dir === 3) this.p1.left = 1;
      if (this.voice.fire) { this.p1.fire = 1; this.voice.fire = false; }
    }
    this.pollGamepad();
  },
  // Gamepad API
  pollGamepad() {
    if (!navigator.getGamepads) return;
    const pads = navigator.getGamepads();
    for (let i = 0; i < Math.min(2, pads.length); i++) {
      const gp = pads[i]; if (!gp) continue;
      const t = i === 0 ? this.p1 : this.p2;
      const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
      if (ay < -0.4 || gp.buttons[12]?.pressed) t.up = 1;
      if (ay > 0.4 || gp.buttons[13]?.pressed) t.down = 1;
      if (ax < -0.4 || gp.buttons[14]?.pressed) t.left = 1;
      if (ax > 0.4 || gp.buttons[15]?.pressed) t.right = 1;
      if (gp.buttons[0]?.pressed || gp.buttons[2]?.pressed || gp.buttons[7]?.pressed) t.fire = 1;
      if (gp.buttons[9]?.pressed && Game.cur) Game.cur.togglePause();
    }
  },
  // Джойстик на экране
  initTouch() {
    const base = $("#stickBase"), knob = $("#stickKnob"), fire = $("#btnFire"), pause = $("#btnPause");
    let id = null, cx = 0, cy = 0;
    const set = (dx, dy) => {
      const d = Math.hypot(dx, dy);
      this.touch.up = this.touch.down = this.touch.left = this.touch.right = 0;
      if (d > 18) {   // мёртвая зона
        if (Math.abs(dx) > Math.abs(dy)) this.touch[dx > 0 ? "right" : "left"] = 1;
        else this.touch[dy > 0 ? "down" : "up"] = 1;
      }
      const m = Math.min(40, d), a = Math.atan2(dy, dx);
      knob.style.left = (40 + Math.cos(a) * m) + "px"; knob.style.top = (40 + Math.sin(a) * m) + "px";
    };
    base.addEventListener("touchstart", e => {
      e.preventDefault(); const t = e.changedTouches[0]; id = t.identifier;
      const r = base.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2;
      this.touch.active = true; set(t.clientX - cx, t.clientY - cy);
    }, { passive: false });
    base.addEventListener("touchmove", e => {
      e.preventDefault();
      for (const t of e.changedTouches) if (t.identifier === id) set(t.clientX - cx, t.clientY - cy);
    }, { passive: false });
    const end = e => {
      for (const t of e.changedTouches) if (t.identifier === id) {
        id = null; this.touch.up = this.touch.down = this.touch.left = this.touch.right = 0;
        knob.style.left = "40px"; knob.style.top = "40px";
      }
    };
    base.addEventListener("touchend", end); base.addEventListener("touchcancel", end);
    const fdown = e => { e.preventDefault(); this.touch.active = true; this.touch.fire = 1; Audio_.init(); Audio_.resume(); };
    const fup = e => { e.preventDefault(); this.touch.fire = 0; };
    fire.addEventListener("touchstart", fdown, { passive: false });
    fire.addEventListener("touchend", fup); fire.addEventListener("mousedown", fdown); fire.addEventListener("mouseup", fup);
    pause.addEventListener("click", () => { if (Game.cur) Game.cur.togglePause(); else UI.back(); });
  }
};

/* --- Голосовое управление (Web Speech API) --- */
const Voice = {
  rec: null, on: false,
  toggle() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { toast("Голосовое управление не поддерживается браузером", "#d05050"); return false; }
    if (this.on) { try { this.rec.stop(); } catch (e) { } this.on = false; toast("Голос выключен"); return false; }
    this.rec = new SR(); this.rec.lang = "ru-RU"; this.rec.continuous = true; this.rec.interimResults = true;
    this.rec.onresult = e => {
      const txt = e.results[e.results.length - 1][0].transcript.toLowerCase().trim();
      const v = Input.voice; v.until = now() + 900;
      if (/вперёд|вперед|верх|вверх/.test(txt)) v.dir = 0;
      else if (/назад|вниз/.test(txt)) v.dir = 2;
      else if (/влево|лево/.test(txt)) v.dir = 3;
      else if (/вправо|право/.test(txt)) v.dir = 1;
      else if (/стой|стоп/.test(txt)) { v.dir = -1; v.until = 0; }
      if (/стреляй|огонь|пли/.test(txt)) v.fire = true;
    };
    this.rec.onerror = () => { };
    this.rec.onend = () => { if (this.on) try { this.rec.start(); } catch (e) { } };
    try { this.rec.start(); this.on = true; toast("Голос включён: «вперёд», «назад», «стреляй»", "#70B050"); }
    catch (e) { toast("Не удалось запустить микрофон", "#d05050"); }
    return this.on;
  }
};

/* ============================== 12. ПОГОДА И ВРЕМЯ СУТОК ============================== */
const WEATHER = ["none", "none", "fog", "rain", "night"];
class Weather {
  constructor(kind) {
    this.kind = kind; this.drops = [];
    if (kind === "rain") for (let i = 0; i < 90; i++)
      this.drops.push({ x: rnd(CFG.FIELD), y: rnd(CFG.FIELD), s: 4 + rnd(5) });
    this.fogPhase = 0;
  }
  update() {
    if (this.kind === "rain") for (const d of this.drops) {
      d.y += d.s; d.x += 1; if (d.y > CFG.FIELD) { d.y = -8; d.x = rnd(CFG.FIELD); }
    }
    this.fogPhase += 0.3;
  }
  draw(ctx, ox, oy, players) {
    if (this.kind === "none") return;
    ctx.save(); ctx.beginPath(); ctx.rect(ox, oy, CFG.FIELD, CFG.FIELD); ctx.clip();
    if (this.kind === "rain") {
      ctx.strokeStyle = "rgba(150,190,255,.45)"; ctx.lineWidth = 1; ctx.beginPath();
      for (const d of this.drops) { ctx.moveTo(ox + d.x, oy + d.y); ctx.lineTo(ox + d.x - 2, oy + d.y + 7); }
      ctx.stroke();
      ctx.fillStyle = "rgba(20,30,60,.25)"; ctx.fillRect(ox, oy, CFG.FIELD, CFG.FIELD);
    } else if (this.kind === "fog") {
      ctx.fillStyle = "rgba(190,190,200,.30)"; ctx.fillRect(ox, oy, CFG.FIELD, CFG.FIELD);
      ctx.fillStyle = "rgba(220,220,230,.18)";
      for (let i = 0; i < 6; i++) {
        const y = (i * 70 + this.fogPhase) % (CFG.FIELD + 60) - 30;
        ctx.fillRect(ox, oy + y, CFG.FIELD, 26);
      }
    } else if (this.kind === "night") {
      // Ночь: затемнение с «фонариками» вокруг игроков.
      // ВАЖНО: слой темноты собирается в отдельном холсте С АЛЬФОЙ. На основном холсте
      // (он создан с alpha:false) destination-out даёт чёрный цвет, а не прозрачность,
      // из-за чего вместо фонарика получалось чёрное пятно, скрывавшее танк.
      if (!this.dark) {
        this.dark = document.createElement("canvas");
        this.dark.width = CFG.FIELD; this.dark.height = CFG.FIELD;
        this.dctx = this.dark.getContext("2d");
      }
      const d = this.dctx;
      d.globalCompositeOperation = "source-over";
      d.clearRect(0, 0, CFG.FIELD, CFG.FIELD);
      d.fillStyle = "rgba(0,0,20,.78)"; d.fillRect(0, 0, CFG.FIELD, CFG.FIELD);
      d.globalCompositeOperation = "destination-out";
      for (const p of players) {
        if (!p || p.dead || p.lives < 0) continue;
        const cx = p.x + 16, cy = p.y + 16;
        const gr = d.createRadialGradient(cx, cy, 10, cx, cy, 96);
        gr.addColorStop(0, "rgba(0,0,0,1)"); gr.addColorStop(0.55, "rgba(0,0,0,0.85)");
        gr.addColorStop(1, "rgba(0,0,0,0)");
        d.fillStyle = gr; d.fillRect(cx - 96, cy - 96, 192, 192);
      }
      d.globalCompositeOperation = "source-over";
      ctx.drawImage(this.dark, ox, oy);
    }
    ctx.restore();
  }
  label() { return { none: "", fog: "FOG", rain: "RAIN", night: "NIGHT" }[this.kind]; }  // латиница: в пиксельном шрифте нет кириллицы
}

/* ============================== 13. ЯДРО ИГРЫ ============================== */
class Game {
  static cur = null;
  constructor(opts) {
    this.mode = opts.mode || "1p";            // 1p | 2p | endless | survival | ctf | boss | custom
    this.levelIndex = opts.level || 1;
    this.customRows = opts.rows || null;      // карта из редактора
    this.twoPlayers = (this.mode === "2p" || this.mode === "ctf" || opts.two);
    this.field = new Field();
    this.players = []; this.enemies = []; this.bullets = [];
    this.explosions = []; this.powerups = []; this.particles = [];
    this.state = "intro"; this.timer = 0; this.frame = 0;
    this.score = 0; this.wave = 1; this.difficulty = 0;
    this.startTime = now(); this.levelStartTime = now();
    this.coinsEarned = 0; this.lostLifeThisLevel = false;
    this.stats = { kills: 0, blocks: 0, byType: { basic: 0, fast: 0, power: 0, boss: 0 } };
    this.paused = false;
    this.flags = null;
    this.shovelTimer = 0;
    this.startLevel(this.levelIndex);
    SAVE.stats.games++; persist();
    Game.cur = this;
  }
  /* --- Инициализация уровня --- */
  startLevel(n) {
    this.levelIndex = n;
    const rows = this.customRows || LEVELS[(n - 1) % LEVELS.length];
    this.field.load(rows);
    this.difficulty = Math.min(2, (n - 1) / 20 + (this.wave - 1) * 0.2);
    this.weather = new Weather(SAVE.settings.weather ? pick(WEATHER) : "none");
    // Игроки
    const keepLives = this.players.map(p => p.lives), keepScore = this.players.map(p => p.score);
    this.players = [new Player(this, 0, 128, 384)];
    if (this.twoPlayers) this.players.push(new Player(this, 1, 256, 384));
    this.players.forEach((p, i) => {
      if (keepLives[i] !== undefined) { p.lives = keepLives[i]; p.score = keepScore[i]; }
    });
    // Очередь врагов
    this.enemyQueue = this.buildQueue(n);
    this.enemiesLeft = this.enemyQueue.length;
    this.enemies = []; this.bullets = []; this.powerups = []; this.explosions = []; this.particles = [];
    this.spawnPoint = 0; this.spawnTimer = 60;
    // Первый уровень партии открывается стартовой темой оригинала (4.3 с)
    const firstStage = !this.startedOnce;
    this.startedOnce = true;
    this.state = "intro"; this.timer = firstStage ? 285 : 130;
    this.levelStartTime = now(); this.lostLifeThisLevel = false;
    this.shovelTimer = 0;
    // Режим «Захват флага»
    if (this.mode === "ctf") {
      this.flags = [
        { x: 32, y: 32, owner: 1, taken: null, home: { x: 32, y: 32 } },     // флаг игрока 2 (слева сверху)
        { x: 352, y: 32, owner: 0, taken: null, home: { x: 352, y: 32 } }   // флаг игрока 1 (справа сверху)
      ];
      this.ctfScore = [0, 0];
    }
    firstStage ? Audio_.stageStart() : Audio_.start();
  }
  // Состав волны врагов — из оригинальной игры (20 танков на уровень)
  buildQueue(n) {
    const q = [];
    const spec = ORIGINAL_BOTS[(n - 1) % ORIGINAL_BOTS.length] || ["18*basic", "2*fast"];
    // Распаковываем группы вида "18*basic" и равномерно перемешиваем типы по волне
    const groups = spec.map(s => { const [c, k] = s.split("*"); return { kind: k, left: +c }; });
    const total = groups.reduce((a, g) => a + g.left, 0);
    for (let i = 0; i < total; i++) {
      // берём тип, у которого «долг» по расписанию наибольший
      let best = null, bestScore = -1;
      for (const g of groups) {
        if (!g.left) continue;
        const sc = g.left / (total - i);
        if (sc > bestScore) { bestScore = sc; best = g; }
      }
      best.left--;
      q.push({ kind: best.kind, bonus: (i === 3 || i === 10 || i === 17) });   // 4-й, 11-й и 18-й — с бонусом
    }
    // В бесконечном режиме и на поздних волнах усиливаем состав
    if (this.mode === "endless" || this.mode === "survival") {
      for (let i = 0; i < q.length; i++)
        if (chance(Math.min(0.5, this.wave * 0.06)) && q[i].kind === "basic") q[i].kind = pick(["fast", "power", "armor"]);
    }
    if (n % 5 === 0 || this.mode === "boss") q.push({ kind: "boss", bonus: true });
    if (this.mode === "ctf") return q.slice(0, 6);
    return q;
  }
  /* --- Вспомогательные --- */
  tankAt(x, y, self) {
    const r = { x: x + 2, y: y + 2, w: 28, h: 28 };
    for (const t of this.allTanks()) {
      if (t === self || t.dead || t.spawnTimer > 0) continue;
      if (hit(r, { x: t.x + 2, y: t.y + 2, w: 28, h: 28 })) return t;
    }
    return null;
  }
  allTanks() { return this.players.concat(this.enemies); }
  alivePlayers() { return this.players.filter(p => !p.dead && p.spawnTimer <= 0); }
  nearestPlayer(from) {
    let best = null, bd = 1e9;
    for (const p of this.players) {
      if (p.dead) continue;
      const d = Math.hypot(p.x - from.x, p.y - from.y);
      if (d < bd) { bd = d; best = p; }
    }
    return best;
  }
  baseTarget() { return { x: this.field.baseX * CFG.UNIT, y: this.field.baseY * CFG.UNIT }; }
  addExplosion(x, y, size) {
    this.explosions.push(new Explosion(x, y, size === "big", SAVE.owned.effect.includes("boom")));
    Audio_.explode(size === "big");
  }
  fortifyBase() { this.field.fortify(T.STEEL); this.shovelTimer = 20 * 60; }   // лопата: 20 секунд стали
  baseDestroyed() {
    if (this.field.baseDead) return;
    this.field.destroyBase();
    this.addExplosion(this.field.baseX * CFG.UNIT, this.field.baseY * CFG.UNIT, "big");
    this.gameOver(false);
  }
  togglePause() {
    if (this.state !== "play" && this.state !== "pause") return;
    this.paused = !this.paused;
    this.state = this.paused ? "pause" : "play";
    Audio_.engine(false);
    if (this.paused) Audio_.pauseSfx();
  }
  /* --- Главный апдейт --- */
  update() {
    this.frame++;
    if (this.state === "intro") { if (--this.timer <= 0) this.state = "play"; return; }
    if (this.state === "pause") return;
    if (this.state === "clear" || this.state === "over") { this.timer--; return; }
    Input.poll();
    // Игроки
    this.players.forEach((p, i) => {
      if (p.dead || p.lives < 0) return;
      p.update(i === 0 ? Input.p1 : Input.p2);
    });
    // Мотор гудит постоянно во время боя и меняет тон при движении (как в оригинале)
    const anyMoving = this.players.some(p => !p.dead && p.lives >= 0 && p.moving);
    Audio_.engine(Audio_.enabled && this.state === "play", anyMoving);
    // Враги
    for (const e of this.enemies) if (!e.dead) e.update();
    // Пули
    for (const b of this.bullets) if (!b.dead) b.update(this);
    this.resolveBullets();
    // Бонусы
    for (const pu of this.powerups) {
      pu.update();
      for (const p of this.players) {
        if (p.dead || p.spawnTimer > 0 || pu.dead) continue;
        if (hit(pu, p.rect())) { p.powerUp(pu.type); pu.dead = true; this.score += 500; }
      }
    }
    // Прочее
    this.explosions.forEach(e => e.update());
    this.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
    this.weather.update();
    if (this.shovelTimer > 0 && --this.shovelTimer === 0 && !this.field.baseDead) this.field.fortify(T.BRICK);
    if (this.mode === "ctf") this.updateCTF();
    // Уборка мёртвых
    this.bullets = this.bullets.filter(b => !b.dead);
    this.explosions = this.explosions.filter(e => !e.dead);
    this.powerups = this.powerups.filter(p => !p.dead);
    this.particles = this.particles.filter(p => p.life > 0);
    this.enemies = this.enemies.filter(e => !e.dead);
    // Спавн врагов
    this.spawnEnemies();
    // Условие завершения уровня
    if (this.mode !== "ctf" && this.enemyQueue.length === 0 && this.enemies.length === 0 && this.state === "play")
      this.levelComplete();
    // Проверка жизней игроков
    if (this.state === "play" && this.players.every(p => p.lives < 0)) this.gameOver(false);
  }
  /* Столкновения пуль с танками и другими пулями */
  resolveBullets() {
    for (const b of this.bullets) {
      if (b.dead) continue;
      // Пуля против пули
      for (const b2 of this.bullets) {
        if (b2 === b || b2.dead || b2.owner.isPlayer === b.owner.isPlayer) continue;
        if (hit(b, b2)) { b.dead = b2.dead = true; b.owner.bullets--; b2.owner.bullets--; break; }
      }
      if (b.dead) continue;
      for (const t of this.allTanks()) {
        if (t === b.owner || t.dead || t.spawnTimer > 0) continue;
        if (t.isPlayer === b.owner.isPlayer && this.mode !== "ctf") continue;   // не бьём своих (кроме CTF)
        if (t.isPlayer === b.owner.isPlayer && t === b.owner) continue;
        if (!hit(b, { x: t.x + 2, y: t.y + 2, w: 28, h: 28 })) continue;
        b.dead = true; b.owner.bullets--;
        const killed = t.takeDamage(1, b.owner);
        if (b.style === "firework") this.fireworkBurst(b.x, b.y);
        if (killed) {
          if (t.isPlayer) this.playerKilled(t);
          else this.enemyKilled(t, b.owner);
        } else this.addExplosion(t.x, t.y, "small");
        break;
      }
    }
    // Синхронизация счётчика пуль (страховка)
    for (const t of this.allTanks()) {
      const c = this.bullets.filter(b => b.owner === t && !b.dead).length;
      t.bullets = c;
    }
  }
  fireworkBurst(x, y) {
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 3;
      this.particles.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 20 + rnd(15),
        c: pick(["#ff40ff", "#40ffff", "#ffff40", "#ff8040", "#80ff80"]), s: 3
      });
    }
  }
  enemyKilled(e, killer) {
    this.addExplosion(e.x, e.y, e.kind === "boss" ? "big" : "normal");
    this.score += e.score;
    if (killer && killer.isPlayer) killer.score += e.score;
    this.stats.kills++; this.stats.byType[e.kind]++;
    SAVE.stats.kills++;
    SAVE.stats["kills" + e.kind[0].toUpperCase() + e.kind.slice(1)] =
      (SAVE.stats["kills" + e.kind[0].toUpperCase() + e.kind.slice(1)] || 0) + 1;
    // Монеты за врага (с премиум-множителем)
    const c = Math.round(e.coins * premiumMult());
    SAVE.coins += c; this.coinsEarned += c;
    // Бонус выпадает из «красного» танка
    if (e.bonus) this.dropPowerUp();
    if (this.mode === "survival" && chance(0.25)) this.dropPowerUp();
    this.enemiesLeft--;
  }
  dropPowerUp() {
    const type = pick(POWERUP_TYPES);
    const x = 32 + rnd(11) * 32, y = 32 + rnd(10) * 32;
    this.powerups.push(new PowerUp(x, y, type));
    Audio_.bonusAppear();
  }
  playerKilled(p) {
    this.addExplosion(p.x, p.y, "big");   // 510 мс, как в оригинале
    p.lives--; this.lostLifeThisLevel = true;
    SAVE.stats.deaths++;
    if (p.lives >= 0) setTimeout(() => { if (Game.cur === this) p.respawn(); }, 800);
    else p.dead = true;
  }
  spawnEnemies() {
    if (this.state !== "play" || !this.enemyQueue.length) return;
    if (this.enemies.length >= CFG.MAX_ENEMIES_ON_SCREEN + Math.floor(this.difficulty)) return;
    if (--this.spawnTimer > 0) return;
    this.spawnTimer = Math.max(60, 190 - this.levelIndex * 3 - this.wave * 5);
    const pts = [0, 192, 384];
    const x = pts[this.spawnPoint % 3]; this.spawnPoint++;
    if (this.tankAt(x, 0, null)) { this.spawnTimer = 30; return; }
    const spec = this.enemyQueue.shift();
    this.enemies.push(new Enemy(this, x, 0, spec.kind, spec.bonus));
  }
  /* --- Режим «Захват флага» --- */
  updateCTF() {
    for (const p of this.players) {
      if (p.dead || p.spawnTimer > 0) continue;
      for (const f of this.flags) {
        if (f.taken === p) { f.x = p.x; f.y = p.y; continue; }
        if (f.taken) continue;
        if (f.owner !== p.idx && hit({ x: f.x, y: f.y, w: 24, h: 24 }, p.rect())) { f.taken = p; Audio_.bonus(); }
      }
      // Доставка на базу (нижняя часть своей половины)
      const carried = this.flags.find(f => f.taken === p);
      if (carried && p.y > 340 && Math.abs(p.x - p.startX) < 60) {
        this.ctfScore[p.idx]++; carried.taken = null;
        carried.x = carried.home.x; carried.y = carried.home.y;
        Audio_.win(); toast(`ИГРОК ${p.idx + 1} ЗАХВАТИЛ ФЛАГ! ${this.ctfScore[0]}:${this.ctfScore[1]}`, "#f0c020");
        if (this.ctfScore[p.idx] >= 3) this.gameOver(true);
      }
    }
  }
  /* --- Завершение уровня --- */
  levelComplete() {
    this.state = "clear"; this.timer = 100;
    Audio_.engine(false); Audio_.win();
    const dur = now() - this.levelStartTime;
    // Награды
    const lvlCoins = Math.round(100 * premiumMult());
    SAVE.coins += lvlCoins; this.coinsEarned += lvlCoins;
    let baseBonus = 0;
    if (!this.field.baseDead) {
      baseBonus = Math.round(50 * premiumMult());
      SAVE.coins += baseBonus; this.coinsEarned += baseBonus;
      SAVE.stats.basesSaved = (SAVE.stats.basesSaved || 0) + 1;
    }
    SAVE.stats.levels++;
    if (this.twoPlayers) SAVE.stats.coopLevels++;
    if (!this.lostLifeThisLevel) SAVE.stats.perfectLevels++;
    if (dur < 60000) SAVE.stats.fastLevels++;
    if (this.mode === "endless") SAVE.stats.endlessWaves = (SAVE.stats.endlessWaves || 0) + 1;
    if (this.mode === "survival") SAVE.stats.survivalWaves = (SAVE.stats.survivalWaves || 0) + 1;
    if (this.mode === "1p" || this.mode === "2p") SAVE.maxLevel = Math.max(SAVE.maxLevel, this.levelIndex);
    SAVE.stats.playTime += dur;
    this.lastLevelStats = { dur, lvlCoins, baseBonus };
    Challenges.report(this, dur);
    persist(); Ach.check();
    setTimeout(() => { if (Game.cur === this) this.nextLevel(); }, 2600);
  }
  nextLevel() {
    if (this.mode === "endless" || this.mode === "survival") {
      this.wave++;
      this.startLevel(((this.levelIndex) % CFG.TOTAL_LEVELS) + 1);
    } else if (this.mode === "boss") {
      this.wave++; this.startLevel(((this.levelIndex + 4) % CFG.TOTAL_LEVELS) + 1);
    } else if (this.levelIndex >= CFG.TOTAL_LEVELS) {
      this.gameOver(true);
    } else {
      this.customRows = null;
      this.startLevel(this.levelIndex + 1);
    }
  }
  /* --- Конец игры --- */
  gameOver(victory) {
    if (this.state === "over") return;
    this.state = "over"; this.timer = 220; this.victory = victory;
    Audio_.engine(false); victory ? Audio_.win() : Audio_.lose();
    const total = this.score + this.players.reduce((a, p) => a + p.score, 0) * 0;
    SAVE.stats.playTime += now() - this.levelStartTime;
    SAVE.stats.totalScore += this.score;
    SAVE.stats.bestScore = Math.max(SAVE.stats.bestScore, this.score);
    victory ? SAVE.stats.wins++ : SAVE.stats.losses++;
    LB.submit(SAVE.name, this.score, this.levelIndex);
    persist(); Ach.check();
    setTimeout(() => { if (Game.cur === this) { Game.cur = null; UI.showGameOver(this); } }, 3000);
  }
  /* ============================== ОТРИСОВКА ============================== */
  draw(ctx) {
    const ox = CFG.OX, oy = CFG.OY;
    // Фон
    ctx.fillStyle = PAL.bg; ctx.fillRect(0, 0, CFG.CW, CFG.CH);
    ctx.fillStyle = "#000"; ctx.fillRect(ox, oy, CFG.FIELD, CFG.FIELD);
    if (this.state === "intro") { this.drawIntro(ctx); this.drawHUD(ctx); return; }
    this.field.drawBack(ctx, ox, oy);
    // Бонусы под танками
    this.powerups.forEach(p => p.draw(ctx, ox, oy));
    // Флаги CTF
    if (this.flags) this.flags.forEach((f, i) => {
      ctx.fillStyle = i === 0 ? "#70B050" : "#C09848";
      ctx.fillRect(ox + f.x + 8, oy + f.y + 2, 3, 22);
      ctx.fillRect(ox + f.x + 11, oy + f.y + 3, 14, 10);
    });
    // Танки
    this.enemies.forEach(e => e.draw(ctx, ox, oy));
    this.players.forEach(p => { if (!p.dead && p.lives >= 0) p.draw(ctx, ox, oy); });
    // Пули и эффекты
    this.bullets.forEach(b => b.draw(ctx, ox, oy));
    this.field.drawFront(ctx, ox, oy);   // кусты поверх
    this.particles.forEach(p => { ctx.fillStyle = p.c; ctx.fillRect(ox + p.x, oy + p.y, p.s, p.s); });
    this.explosions.forEach(e => e.draw(ctx, ox, oy));
    this.weather.draw(ctx, ox, oy, this.players);
    this.drawHUD(ctx);
    if (this.state === "pause") {
      ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillRect(ox, oy, CFG.FIELD, CFG.FIELD);
      textC(ctx, "PAUSE", ox + 208, oy + 190, 4, "#f8f8f8");
      textC(ctx, "ESC - MENU   P - CONTINUE", ox + 208, oy + 230, 1, "#c0c0c0");
    }
    if (this.state === "clear") this.drawLevelClear(ctx);
    if (this.state === "over") {
      const y = oy + 200;
      ctx.fillStyle = "rgba(0,0,0,.75)"; ctx.fillRect(ox, oy, CFG.FIELD, CFG.FIELD);
      textC(ctx, this.victory ? "VICTORY" : "GAME OVER", ox + 208, y, 4, this.victory ? "#70B050" : "#d05050");
      textC(ctx, "SCORE " + this.score, ox + 208, y + 46, 2, "#f0c020");
    }
  }
  drawIntro(ctx) {
    const ox = CFG.OX, oy = CFG.OY;
    ctx.fillStyle = "#8c8c8c"; ctx.fillRect(ox, oy, CFG.FIELD, CFG.FIELD);
    const name = this.mode === "endless" ? "ENDLESS WAVE " + this.wave :
      this.mode === "survival" ? "SURVIVAL WAVE " + this.wave :
        this.mode === "ctf" ? "CAPTURE THE FLAG" :
          this.mode === "custom" ? "CUSTOM LEVEL" : "STAGE " + this.levelIndex;
    textC(ctx, name, ox + 208, oy + 196, 3, "#000");
    const w = this.weather.label();
    if (w) textC(ctx, w, ox + 208, oy + 236, 2, "#303030");
  }
  drawLevelClear(ctx) {
    const ox = CFG.OX, oy = CFG.OY;
    ctx.fillStyle = "rgba(0,0,0,.8)"; ctx.fillRect(ox, oy, CFG.FIELD, CFG.FIELD);
    textC(ctx, "STAGE CLEAR", ox + 208, oy + 90, 3, "#f0c020");
    const s = this.stats.byType;
    let y = oy + 150;
    const line = (a, b, c) => { text(ctx, a, ox + 60, y, 1, "#c0c0c0"); text(ctx, b, ox + 250, y, 1, c || "#fff"); y += 22; };
    line("BASIC x" + s.basic, s.basic * 100 + " PTS");
    line("FAST  x" + s.fast, s.fast * 200 + " PTS");
    line("POWER x" + s.power, s.power * 300 + " PTS");
    line("BOSS  x" + s.boss, s.boss * 1000 + " PTS");
    y += 10;
    line("TOTAL SCORE", "" + this.score, "#f0c020");
    line("COINS EARNED", "+" + this.coinsEarned, "#f0c020");
  }
  drawHUD(ctx) {
    const x = 448, ctx2 = ctx;
    ctx.fillStyle = PAL.bg; ctx.fillRect(440, 0, 104, CFG.CH);
    // Оставшиеся враги — иконки
    let n = this.enemyQueue.length + this.enemies.length, i = 0;
    for (let r = 0; r < 10 && i < n; r++) for (let c = 0; c < 4 && i < n; c++, i++) {
      ctx.fillStyle = "#000"; ctx.fillRect(x + c * 12, 20 + r * 12, 8, 8);
      ctx.fillStyle = "#404040"; ctx.fillRect(x + c * 12 + 1, 21 + r * 12, 6, 6);
      ctx.fillStyle = "#000"; ctx.fillRect(x + c * 12 + 3, 20 + r * 12, 2, 3);
    }
    let y = 150;
    this.players.forEach((p, k) => {
      text(ctx, "IP" + (k ? "I" : ""), x, y, 1, "#000");
      drawTank(ctx, x + 2, y + 12, 0, p.colors, { trackPhase: 0 });
      text(ctx, String(Math.max(0, p.lives)), x + 40, y + 22, 2, "#000");
      y += 56;
    });
    // Флажок уровня
    text(ctx, "STAGE", x, y + 6, 1, "#000");
    text(ctx, String(this.levelIndex), x, y + 20, 2, "#000");
    // Счёт и монеты
    y += 50;
    text(ctx, "SCORE", x, y, 1, "#000");
    text(ctx, String(this.score), x, y + 12, 1, "#fff");
    text(ctx, "COINS", x, y + 30, 1, "#000");
    text(ctx, String(SAVE.coins), x, y + 42, 1, "#f0c020");
    if (this.mode === "ctf") {
      text(ctx, "CTF " + this.ctfScore[0] + ":" + this.ctfScore[1], x, y + 62, 1, "#000");
    }
    if (SAVE.settings.showFPS) text(ctx, "FPS " + Loop.fps, x, CFG.CH - 14, 1, "#000");
  }
}

/* ============================== 14. РЕЙТИНГ И ОБЛАКО ============================== */
/* Локальный топ-10 + глобальный рейтинг (Firebase/Supabase). Без сети — офлайн-режим. */
const LB = {
  submit(name, score, level) {
    if (score <= 0) return;
    SAVE.records.push({ name, score, level, date: today(), ts: now() });
    SAVE.records.sort((a, b) => b.score - a.score);
    SAVE.records = SAVE.records.slice(0, 10);
    persist();
    Online.submitScore(name, score, level);
  },
  local() { return SAVE.records; },
  isTop10(name) { return SAVE.records.slice(0, 10).some(r => r.name === name); },
  // Фильтрация по периоду: day | week | all
  byPeriod(list, period) {
    const t = now();
    const lim = period === "day" ? 864e5 : period === "week" ? 6048e5 : Infinity;
    return list.filter(r => (t - (r.ts || 0)) <= lim).sort((a, b) => b.score - a.score).slice(0, 20);
  }
};

/* --- Онлайн-бэкенд: Firebase Firestore (или офлайн-заглушка) --- */
const Online = {
  ready: false, mode: "offline", db: null, uid: null,
  async init() {
    if (!CFG.FIREBASE.apiKey) { this.mode = "offline"; return; }   // ключи не заданы => офлайн
    try {
      // Подключение Firebase SDK через CDN (модульная версия 10.x)
      const app = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
      const fs = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
      const auth = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");
      const a = app.initializeApp(CFG.FIREBASE);
      this.db = fs.getFirestore(a); this.fs = fs;
      const au = auth.getAuth(a);
      const cred = await auth.signInAnonymously(au);
      this.uid = cred.user.uid; this.ready = true; this.mode = "online";
      toast("Онлайн-режим подключён", "#70B050");
      this.pullProfile();
    } catch (e) {
      this.mode = "offline";
      console.warn("Firebase недоступен, работаем офлайн:", e.message);
    }
  },
  async submitScore(name, score, level) {
    if (!this.ready) return;   // офлайн — счёт уже сохранён локально
    try {
      const { collection, addDoc, serverTimestamp } = this.fs;
      await addDoc(collection(this.db, "scores"), {
        name, score, level, uid: this.uid, ts: serverTimestamp(), day: today()
      });
    } catch (e) { console.warn("submitScore:", e.message); }
  },
  async getLeaderboard(period) {
    if (!this.ready) return null;    // null => UI покажет локальный топ
    try {
      const { collection, query, orderBy, limit, where, getDocs } = this.fs;
      let q = query(collection(this.db, "scores"), orderBy("score", "desc"), limit(20));
      if (period === "day") q = query(collection(this.db, "scores"), where("day", "==", today()), orderBy("score", "desc"), limit(20));
      const snap = await getDocs(q);
      return snap.docs.map(d => d.data());
    } catch (e) { return null; }
  },
  // Синхронизация профиля между устройствами
  async syncProfile() {
    if (!this.ready) return;
    try {
      const { doc, setDoc } = this.fs;
      await setDoc(doc(this.db, "profiles", this.uid), {
        name: SAVE.name, avatar: SAVE.avatar, coins: SAVE.coins, maxLevel: SAVE.maxLevel,
        owned: SAVE.owned, equipped: SAVE.equipped, upgrades: SAVE.upgrades,
        stats: SAVE.stats, achievements: SAVE.achievements, updated: now()
      }, { merge: true });
    } catch (e) { }
  },
  async pullProfile() {
    if (!this.ready) return;
    try {
      const { doc, getDoc } = this.fs;
      const s = await getDoc(doc(this.db, "profiles", this.uid));
      if (s.exists()) {
        const d = s.data();
        // Берём максимум монет/прогресса (простое разрешение конфликтов)
        if (d.coins > SAVE.coins) SAVE.coins = d.coins;
        SAVE.maxLevel = Math.max(SAVE.maxLevel, d.maxLevel || 1);
        for (const k in (d.owned || {})) SAVE.owned[k] = Array.from(new Set([...(SAVE.owned[k] || []), ...d.owned[k]]));
        persist();
      }
    } catch (e) { }
  }
};

/* ============================== 15. МУЛЬТИПЛЕЕР (WebSocket) ============================== */
/* Протокол (клиентская часть готова; серверная — см. README, TODO: развернуть сервер).
   -> {t:"create"} / {t:"join", room:"1234"} / {t:"state", ...} / {t:"chat", msg}
   <- {t:"room", code} / {t:"peer", ...} / {t:"state", ...} / {t:"chat", from, msg}         */
const MP = {
  ws: null, room: null, role: null, peers: [], chat: [], connected: false,
  connect(cb) {
    if (!CFG.MP_SERVER) { toast("Сервер мультиплеера не настроен — офлайн", "#d05050"); cb && cb(false); return; }
    try {
      this.ws = new WebSocket(CFG.MP_SERVER);
      this.ws.onopen = () => { this.connected = true; toast("Подключено к серверу", "#70B050"); cb && cb(true); };
      this.ws.onclose = () => { this.connected = false; toast("Соединение потеряно — офлайн-режим", "#d05050"); };
      this.ws.onerror = () => { this.connected = false; cb && cb(false); };
      this.ws.onmessage = e => this.onMessage(JSON.parse(e.data));
    } catch (err) { cb && cb(false); }
  },
  send(o) { if (this.connected) this.ws.send(JSON.stringify(o)); },
  createRoom(mode) {
    const code = String(1000 + rnd(9000));   // 4-значный код комнаты
    this.room = code; this.role = "host";
    this.connect(ok => { if (ok) this.send({ t: "create", room: code, mode, name: SAVE.name }); });
    return code;
  },
  joinRoom(code) {
    this.room = code; this.role = "guest";
    this.connect(ok => { if (ok) this.send({ t: "join", room: code, name: SAVE.name }); });
  },
  onMessage(m) {
    if (m.t === "chat") { this.chat.push(m); toast(m.from + ": " + m.msg, "#5da0f0"); }
    else if (m.t === "peer") { this.peers = m.peers || []; toast("Игроков в комнате: " + this.peers.length); }
    else if (m.t === "state") { /* TODO: синхронизация состояния игры (позиции танков, пуль) */ }
    else if (m.t === "start") { UI.startGame({ mode: m.mode === "pvp" ? "ctf" : "2p", level: 1 }); }
  },
  sendChat(msg) { this.send({ t: "chat", room: this.room, from: SAVE.name, msg }); },
  // Список активных комнат (TODO: реализовать запрос к серверу /rooms)
  async listRooms() {
    if (!this.connected) return [];
    return new Promise(res => { this.send({ t: "rooms" }); setTimeout(() => res(this.rooms || []), 500); });
  },
  leave() { if (this.ws) try { this.ws.close(); } catch (e) { } this.room = null; this.connected = false; }
};

/* ============================== 16. ПЛАТЕЖИ (Stripe / PayPal / ЮKassa) ============================== */

   Реальные платежи требуют бэкенда: создание Checkout Session и обработка webhook.       */

    return this.stripe;
  },
  isLive() { return CFG.PAYMENTS_LIVE && !!CFG.STRIPE_PK; },
  // Покупка пакета монет
  async buyCoins(pack) {
    if (!this.isLive()) return this.demo(pack);
    // TODO: заменить на вызов вашего бэкенда, создающего Checkout Session:
    // const r = await fetch("/api/checkout", {method:"POST", body: JSON.stringify({pack: pack.id})});
    // const {sessionId} = await r.json();

/* ============================== 17. ЕЖЕДНЕВНЫЙ БОНУС И ЧЕЛЛЕНДЖИ ============================== */
function dailyBonus() {
  const d = today();
  if (SAVE.daily.last === d) return null;
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  SAVE.daily.streak = (SAVE.daily.last === y) ? SAVE.daily.streak + 1 : 1;
  SAVE.daily.last = d;
  const amount = 50 + (SAVE.daily.streak - 1) * 10;   // +50 за вход, +10 за каждый день стрика
  SAVE.coins += amount; persist(); Ach.check();
  return { amount, streak: SAVE.daily.streak };
}
const CHALLENGE_POOL = [
  { id: "c1", t: "Пройди 3 уровня за 5 минут", r: 200, test: (g, st) => st.levelsToday >= 3 },
  { id: "c2", t: "Уничтожь 30 врагов за день", r: 150, test: (g, st) => st.killsToday >= 30 },
  { id: "c3", t: "Пройди уровень без потери жизни", r: 180, test: (g) => g && !g.lostLifeThisLevel },
  { id: "c4", t: "Пройди уровень быстрее 60 секунд", r: 220, test: (g, st, dur) => dur < 60000 },
  { id: "c5", t: "Разрушь 200 блоков", r: 160, test: (g, st) => st.blocksToday >= 200 },
  { id: "c6", t: "Убей босса", r: 250, test: (g) => g && g.stats.byType.boss > 0 },
  { id: "c7", t: "Собери 5 бонусов", r: 140, test: (g, st) => st.bonusToday >= 5 }
];
const Challenges = {
  todayList() {
    const R = mulberry32(seedFromString("chal_" + today()));
    const pool = CHALLENGE_POOL.slice();
    const out = [];
    for (let i = 0; i < 3 && pool.length; i++) out.push(pool.splice(Math.floor(R() * pool.length), 1)[0]);
    return out;
  },
  daySt() {
    if (SAVE.challenges.date !== today()) SAVE.challenges = { date: today(), done: [], st: {} };
    SAVE.challenges.st = SAVE.challenges.st || {};
    return SAVE.challenges.st;
  },
  report(g, dur) {
    const st = this.daySt();
    st.levelsToday = (st.levelsToday || 0) + 1;
    st.killsToday = (st.killsToday || 0) + g.stats.kills;
    st.blocksToday = (st.blocksToday || 0) + g.stats.blocks;
    st.bonusToday = (st.bonusToday || 0) + 0;
    for (const c of this.todayList()) {
      if (SAVE.challenges.done.includes(c.id)) continue;
      let ok = false; try { ok = c.test(g, st, dur); } catch (e) { }
      if (ok) {
        SAVE.challenges.done.push(c.id);
        SAVE.coins += c.r;
        SAVE.stats.challengesDone = (SAVE.stats.challengesDone || 0) + 1;
        toast("ЧЕЛЛЕНДЖ ВЫПОЛНЕН: " + c.t + " (+" + c.r + "🪙)", "#f0c020");
      }
    }
    persist();
  }
};
